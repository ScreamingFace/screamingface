# First pre-commit config in the monorepo (OME-525).
# FAST hooks gate every commit (see .githooks/pre-commit). The HEAVY per-stack suite
# (run_gates.py — pytest, pyright, coverage) runs on pre-push + CI (see .githooks/pre-push),
# so commits stay fast.
default_language_version:
  python: python3.12
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # VENDORED-VERBATIM EXCLUSION (OME-715). These two hooks REWRITE files, and the design-system
      # reference is a byte-identical copy of brand.screamingface.ai. `end-of-file-fixer` appended a
      # newline to tokens.json, which broke the `cmp`-against-upstream drift check that file exists
      # to support — a one-byte edit that silently turned "verbatim" into "nearly verbatim".
      #
      # Vendored third-party content is not ours to format. Edit SKILL.md (our interpretation) or
      # re-pull (upstream's content); never reformat in between.
      #
      # Audit evidence (docs/spec/<slug>/evidence/) is the same kind of record: the models, probes
      # and tool output exactly as they were run. Reformatting them changes the evidence.
      - id: trailing-whitespace
        exclude: '^(\.claude/skills/screamingface-design/reference/|docs/spec/[^/]+/evidence/)'
      - id: end-of-file-fixer
        exclude: '^(\.claude/skills/screamingface-design/reference/|docs/spec/[^/]+/evidence/)'
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: '(^|/)templates/.*\.ya?ml$'   # Helm templates use Go-template syntax, not valid YAML
      - id: check-toml
      - id: check-added-large-files
        # Blessed e2e replay fixtures (owner-approved): a board's cache slice is ~1 MB
        exclude: 'tests/e2e/fixtures/snapshots/.*\.snapshot\.gz$'
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      # ruff resolves each stack's own [tool.ruff] config (incl. C901/PLR complexity) per file.
      # Audit evidence is excluded for the same reason as above: it is a record, not product code.
      - id: ruff-check
        args: [--fix]
        exclude: '^docs/spec/[^/]+/evidence/'
      - id: ruff-format
        exclude: '^docs/spec/[^/]+/evidence/'
