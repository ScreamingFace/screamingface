<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 515" width="1240" height="515" font-family="IBM Plex Mono, Menlo, monospace">
<title>ScreamingFace request architecture</title>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#585d67"/></marker>
</defs>
<rect width="1240" height="515" fill="#ffffff"/>
<text x="40" y="46" font-size="17" fill="#16181d" font-weight="600">ScreamingFace · request architecture</text>
<text x="40" y="70" font-size="11" fill="#8b909a" letter-spacing="0.06em">LOCAL · RUNS ON YOUR MACHINE · YOUR KEYS, YOUR SUBSCRIPTIONS</text>
<rect x="40" y="150" width="228" height="122" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<text x="154.0" y="180" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.08em">SCREAMINGFACE CLIENT</text>
<text x="154.0" y="200" font-size="10.5" fill="#8b909a" text-anchor="middle">notebook / Python SDK</text>
<text x="154.0" y="224" font-size="10.5" fill="#585d67" text-anchor="middle">composes an ensemble,</text>
<text x="154.0" y="241" font-size="10.5" fill="#585d67" text-anchor="middle">reads the report back</text>
<rect x="350" y="150" width="228" height="122" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<rect x="350" y="150" width="3" height="122" fill="#c9821f"/>
<text x="464.0" y="180" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.08em">SCREAMINGFACE ENGINE</text>
<text x="464.0" y="200" font-size="10.5" fill="#8b909a" text-anchor="middle">runs your ensemble</text>
<text x="464.0" y="224" font-size="10.5" fill="#585d67" text-anchor="middle">combines the answers,</text>
<text x="464.0" y="241" font-size="10.5" fill="#585d67" text-anchor="middle">grades and ranks them</text>
<rect x="660" y="150" width="228" height="122" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<text x="774.0" y="180" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.08em">AI GATEWAY</text>
<text x="774.0" y="200" font-size="10.5" fill="#8b909a" text-anchor="middle">talks to the models</text>
<text x="774.0" y="224" font-size="10.5" fill="#585d67" text-anchor="middle">your keys, encrypted</text>
<rect x="970" y="150" width="228" height="122" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<text x="1084.0" y="180" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.08em">PROVIDERS</text>
<text x="1084.0" y="200" font-size="10.5" fill="#8b909a" text-anchor="middle">the models</text>
<text x="1084.0" y="224" font-size="10.5" fill="#585d67" text-anchor="middle">Claude · Gemini</text>
<text x="1084.0" y="241" font-size="10.5" fill="#585d67" text-anchor="middle">GPT / Codex · OpenRouter</text>
<text x="1084.0" y="258" font-size="10.5" fill="#585d67" text-anchor="middle">Ollama</text>
<line x1="268" y1="198" x2="350" y2="198" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="309.0" y="190" font-size="9.5" fill="#8b909a" text-anchor="middle" letter-spacing="0.04em" paint-order="stroke fill" stroke="#ffffff" stroke-width="3">one request</text>
<line x1="350" y1="230" x2="268" y2="230" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)" stroke-dasharray="5 4"/>
<text x="309.0" y="248" font-size="9.5" fill="#8b909a" text-anchor="middle" letter-spacing="0.04em" paint-order="stroke fill" stroke="#ffffff" stroke-width="3">one report</text>
<line x1="578" y1="211.0" x2="660" y2="211.0" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="619.0" y="203.0" font-size="9.5" fill="#8b909a" text-anchor="middle" letter-spacing="0.04em" paint-order="stroke fill" stroke="#ffffff" stroke-width="3">asks each model</text>
<line x1="888" y1="211.0" x2="970" y2="211.0" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)"/>
<rect x="350" y="330" width="110" height="82" fill="#efeff1" stroke="#e6e7ea" stroke-width="1"/>
<text x="405.0" y="360" font-size="10.5" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.06em">BENCHMARK DATA</text>
<text x="405.0" y="380" font-size="10" fill="#8b909a" text-anchor="middle">Hugging Face</text>
<rect x="468" y="330" width="110" height="82" fill="#efeff1" stroke="#e6e7ea" stroke-width="1"/>
<text x="523.0" y="360" font-size="10.5" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.06em">WEB TOOLS</text>
<text x="523.0" y="380" font-size="10" fill="#8b909a" text-anchor="middle">Tavily</text>
<line x1="405.0" y1="272" x2="405.0" y2="330" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)"/>
<line x1="523.0" y1="272" x2="523.0" y2="330" stroke="#585d67" stroke-width="1.4" marker-end="url(#arw)"/>
<text x="405.0" y="322" font-size="9.5" fill="#8b909a" text-anchor="middle" letter-spacing="0.04em" paint-order="stroke fill" stroke="#ffffff" stroke-width="3">the questions</text>
<text x="523.0" y="322" font-size="9.5" fill="#8b909a" text-anchor="middle" letter-spacing="0.04em" paint-order="stroke fill" stroke="#ffffff" stroke-width="3">web search</text>
<line x1="40" y1="470" x2="70" y2="470" stroke="#585d67" stroke-width="1.4"/>
<text x="78" y="474" font-size="10" fill="#8b909a">request</text>
<line x1="160" y1="470" x2="190" y2="470" stroke="#585d67" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="198" y="474" font-size="10" fill="#8b909a">response</text>
<rect x="288" y="464" width="10" height="12" fill="#c9821f"/>
<text x="304" y="474" font-size="10" fill="#8b909a">the ScreamingFace Engine · your keys stay in the gateway</text>
</svg>