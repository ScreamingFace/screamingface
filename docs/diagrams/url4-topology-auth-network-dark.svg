<rect x="534.0" y="163.0" width="84.0" height="18" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="576.0" y="175.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#d2e6ff" text-anchor="middle">2  session S</text>
<path d="M 328,244 L 328,290" fill="none" stroke="#c8ccd2" stroke-width="1.2" marker-end="url(#h-c8ccd2)"/>
<rect x="223.0" y="258.0" width="210.0" height="18" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="328.0" y="270.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#e0e5eb" text-anchor="middle">3  s3://brand-assets/logo.png + S</text>
<path d="M 576,244 L 576,290" fill="none" stroke="#c8ccd2" stroke-width="1.2" marker-end="url(#h-c8ccd2)"/>
<rect x="471.0" y="258.0" width="210.0" height="18" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="576.0" y="270.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#e0e5eb" text-anchor="middle">3  url4://beta.example/gemini + S</text>
<rect x="760" y="250" width="196" height="150" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="770" y="268" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Host B  beta.example</text>
<rect x="776" y="282" width="164" height="40" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="786" y="306.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">auth gate · T(B) → S′</text>
<rect x="776" y="332" width="164" height="54" fill="#05070b" stroke="#e0e5eb" stroke-width="1"/>
<text x="786" y="350" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/gemini</text>
<text x="786" y="367.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">holds S′ only</text>
<path d="M 688,302 L 776,302" fill="none" stroke="#e2a35b" stroke-width="1.2" marker-end="url(#h-e2a35b)"/>
<rect x="705.0" y="275.0" width="54.0" height="18" fill="#05070b" stroke="#e2a35b" stroke-width="1"/>
<text x="732.0" y="287.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#e2a35b" text-anchor="middle">4  T(B)</text>
<rect x="760" y="440" width="196" height="70" fill="#05070b" stroke="#585c61" stroke-width="1" stroke-dasharray="2,3"/>
<text x="770" y="458" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Host C  λ function</text>
<text x="770" y="475.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">own keys · gate validates T(C)</text>
<text x="770" y="489.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">inside it: a node + egress</text>
<path d="M 688,370 L 736,370 L 736,475 L 760,475" fill="none" stroke="#e2a35b" stroke-width="1.2" marker-end="url(#h-e2a35b)"/>
<rect x="709.0" y="411.0" width="54.0" height="18" fill="#05070b" stroke="#e2a35b" stroke-width="1"/>
<text x="736.0" y="423.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#e2a35b" text-anchor="middle">5  T(C)</text>
<rect x="760" y="540" width="196" height="44" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="770" y="566.0" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">s3://brand-assets</text>
<path d="M 688,398 L 712,398 L 712,562 L 760,562" fill="none" stroke="#c8ccd2" stroke-width="1.2" marker-end="url(#h-c8ccd2)"/>
<rect x="649.0" y="517.0" width="126.0" height="18" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="712.0" y="529.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#e0e5eb" text-anchor="middle">6  host credentials</text>
<text x="24" y="604" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Nodes never open a connection. They hand a target and their session to the host; the host does policy, tokens, credentials and cache once.</text>
<text x="24" y="622" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Results and envelopes return on the same connections; the relay merges them (step 7).</text>
<text x="24" y="640" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Requestor to host and host to host use the spec&#x27;s tokens; node to host adds nothing on the wire in-process.</text>
<rect x="24" y="665" width="14" height="10" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="44" y="674" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">host-owned auth machinery</text>
<rect x="215.5" y="665" width="14" height="10" fill="#05070b" stroke="#e0e5eb" stroke-width="1"/>
<text x="235.5" y="674" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">node: session only</text>
<rect x="365.14" y="665" width="14" height="10" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="385.14" y="674" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">host</text>
<rect x="431.06" y="665" width="14" height="10" fill="#05070b" stroke="#585c61" stroke-width="1" stroke-dasharray="2,3"/>
<text x="451.06" y="674" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">standalone function = its own host</text>
<rect x="676.38" y="665" width="14" height="10" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="696.38" y="674" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">outside</text>
</svg>
