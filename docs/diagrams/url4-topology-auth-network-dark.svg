<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" role="img" aria-label="url4 topology — networking sketch: nodes act on behalf of the host"><title>url4 topology — networking sketch: nodes act on behalf of the host</title><defs><marker id="h-75affe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#75affe"/></marker><marker id="h-c8ccd2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c8ccd2"/></marker><marker id="h-e2a35b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#e2a35b"/></marker></defs>
<rect x="0" y="0" width="980" height="700" fill="#05070b"/>
<text x="24" y="34" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e5eb" text-anchor="start">url4 topology — networking sketch: nodes act on behalf of the host</text>
<rect x="24" y="100" width="150" height="54" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="34" y="118" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Requestor</text>
<text x="34" y="135.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">holds its own token</text>
<rect x="200" y="70" width="504" height="500" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="210" y="88" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Host A  url4://alpha.example</text>
<rect x="216" y="100" width="472" height="54" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="226" y="118" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">auth gate</text>
<text x="226" y="135.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">validates URL4-Auth-Token · mints run session S (rid, tree, purpose, expiry, identity)</text>
<rect x="216" y="190" width="224" height="54" fill="#05070b" stroke="#e0e5eb" stroke-width="1"/>
<text x="226" y="208" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/summarize</text>
<text x="226" y="225.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">holds S only · no credentials</text>
<rect x="464" y="190" width="224" height="54" fill="#05070b" stroke="#e0e5eb" stroke-width="1"/>
<text x="474" y="208" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/claude</text>
<text x="474" y="225.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">holds S only · no credentials</text>
<rect x="216" y="290" width="472" height="118" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="226" y="308" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">egress · acts on behalf of the host</text>
<text x="226" y="325.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">policy registry + consumer disclosure (v0.2 §16.2.2) · cache (§16.3)</text>
<text x="226" y="339.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">budgets (§20) · rate limits (§31) · host credentials for s3:// pg://</text>
<text x="226" y="354.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">mints destination-bound tokens T(B), T(C) on behalf of the requestor (§22.2)</text>
<rect x="216" y="450" width="472" height="54" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="226" y="468" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">telemetry relay</text>
<text x="226" y="485.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">merges child envelopes and events into the run&#x27;s one trace</text>
<path d="M 174,127 L 216,127" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="24" y="166" width="125.39999999999999" height="18.5" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="86.69999999999999" y="178.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#d2e6ff" text-anchor="middle">1  URL4-Auth-Token</text>
<path d="M 328,154 L 328,190" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="286.0" y="163.0" width="84.0" height="18" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="328.0" y="175.5" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10" font-weight="400" fill="#d2e6ff" text-anchor="middle">2  session S</text>
