<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="IBM Plex Mono, Menlo, monospace">
<title>Fusion with quorum and optional members</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0aa"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07a62"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fbf86"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a23c"/></marker></defs>
<rect width="1060" height="430" fill="#0a0b0d"/>
<text x="40" y="42" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="600">Which members reach the synthesizer</text>
<text x="40" y="64" font-size="11" fill="#686e78" text-anchor="start" letter-spacing="0.04em">FUSION(MEMBERS, SYNTHESIZER, QUORUM=...) · THE QUORUM IS CHECKED AFTER THE MEMBERS FINISH</text>
<rect x="40" y="100" width="230" height="66" fill="#131519" stroke="#5fbf86" stroke-width="1"/>
<text x="155.0" y="124" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member A</text>
<text x="155.0" y="146" font-size="10.5" fill="#9aa0aa" text-anchor="middle">required, succeeds</text>
<rect x="40" y="190" width="230" height="66" fill="#131519" stroke="#5fbf86" stroke-width="1"/>
<text x="155.0" y="214" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member B</text>
<text x="155.0" y="236" font-size="10.5" fill="#9aa0aa" text-anchor="middle">required, succeeds</text>
<rect x="40" y="280" width="230" height="66" fill="#131519" stroke="#e07a62" stroke-width="1" stroke-dasharray="5 4"/>
<text x="155.0" y="304" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member C</text>
<text x="155.0" y="326" font-size="10.5" fill="#9aa0aa" text-anchor="middle">optional=True, fails</text>
<rect x="400" y="170" width="270" height="106" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<rect x="400" y="170" width="3" height="106" fill="#e0a23c"/>
<text x="535.0" y="194" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Quorum check</text>
<text x="535.0" y="216" font-size="10.5" fill="#9aa0aa" text-anchor="middle">succeeded members &gt;= quorum</text>
<text x="535.0" y="233" font-size="10.5" fill="#9aa0aa" text-anchor="middle">&quot;all&quot;: every member (default)</text>
<text x="535.0" y="250" font-size="10.5" fill="#9aa0aa" text-anchor="middle">an integer: that many members</text>
<path d="M270 133 L335 133 L335 200 L400 200" fill="none" stroke="#5fbf86" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M270 223 L400 223" fill="none" stroke="#5fbf86" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M270 313 L335 313 L335 250 L400 250" fill="none" stroke="#e07a62" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a-bad)"/>
<text x="40" y="372" font-size="10.5" fill="#e07a62" text-anchor="start">A failed optional member is a failed answer with reason missing,</text>
<text x="40" y="389" font-size="10.5" fill="#e07a62" text-anchor="start">never a vote.</text>
<rect x="780" y="100" width="240" height="90" fill="#131519" stroke="#5fbf86" stroke-width="1"/>
<text x="900.0" y="124" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Synthesizer</text>
<text x="900.0" y="146" font-size="10.5" fill="#9aa0aa" text-anchor="middle">combines the answers</text>
<text x="900.0" y="163" font-size="10.5" fill="#9aa0aa" text-anchor="middle">that reached it</text>
<rect x="780" y="250" width="240" height="90" fill="#131519" stroke="#e07a62" stroke-width="1"/>
<text x="900.0" y="274" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Candidate fails</text>
<text x="900.0" y="296" font-size="10.5" fill="#9aa0aa" text-anchor="middle">quorum not met, or a</text>
<text x="900.0" y="313" font-size="10.5" fill="#9aa0aa" text-anchor="middle">required member failed</text>
<path d="M670 200 L725 200 L725 145 L780 145" fill="none" stroke="#5fbf86" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M670 250 L725 250 L725 295 L780 295" fill="none" stroke="#e07a62" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="676" y="192" font-size="10.5" fill="#5fbf86" text-anchor="start">met</text>
<text x="676" y="268" font-size="10.5" fill="#e07a62" text-anchor="start">not met</text>
<text x="40" y="418" font-size="10" fill="#686e78" text-anchor="start">A required member that fails fails the candidate, whatever the quorum. quorum=0 lets the synthesizer run with no successful member.</text>
</svg>
