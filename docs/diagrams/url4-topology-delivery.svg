<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="url4 topology — delivery modes and the fallback ladder"><title>url4 topology — delivery modes and the fallback ladder</title><defs><marker id="h-4b91f0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#4b91f0"/></marker><marker id="h-616265" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#616265"/></marker></defs>
<rect x="0" y="0" width="980" height="620" fill="#fcfdff"/>
<text x="24" y="34" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#3b3c3e" text-anchor="start">url4 topology — delivery modes and the fallback ladder</text>
<rect x="24" y="60" width="296" height="340" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="40" y="84" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#616265" text-anchor="start" letter-spacing="1.2">SYNC (DEFAULT)</text>
