<text x="50" y="356.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Node</text>
<path d="M 64,144 L 64,330" fill="none" stroke="#4b91f0" stroke-width="1.2" marker-end="url(#h-4b91f0)"/>
<rect x="80" y="166" width="75.0" height="18.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="117.5" y="178.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">GET /n?q=…</text>
<path d="M 292,330 L 292,144" fill="none" stroke="#616265" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-616265)"/>
<rect x="80" y="230" width="156.9" height="18.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="158.45" y="242.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">200 · result + envelope</text>
<rect x="80" y="250" width="163.2" height="18.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="161.6" y="262.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">envelope.delivery = sync</text>
<rect x="342" y="60" width="296" height="340" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="358" y="84" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#616265" text-anchor="start" letter-spacing="1.2">STREAM</text>
<rect x="358" y="100" width="264" height="44" fill="#eceef0" stroke="#b4b6b8" stroke-width="1"/>
<text x="368" y="126.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Requestor</text>
<rect x="358" y="330" width="264" height="44" fill="#fcfdff" stroke="#3b3c3e" stroke-width="1"/>
<text x="368" y="356.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Node</text>
<path d="M 382,144 L 382,330" fill="none" stroke="#4b91f0" stroke-width="1.2" marker-end="url(#h-4b91f0)"/>
<rect x="398" y="166" width="175.79999999999998" height="18.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="485.9" y="178.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">GET /n?delivery=stream&amp;q=…</text>
<rect x="398" y="186" width="169.5" height="18.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="482.75" y="198.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">Accept: text/event-stream</text>
<path d="M 610,330 L 610,144" fill="none" stroke="#616265" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-616265)"/>
<rect x="398" y="230" width="156.9" height="18.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="476.45" y="242.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">200 · text/event-stream</text>
<text x="404" y="260" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· source.resolved</text>
<text x="404" y="276" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· trigger.result</text>
<text x="404" y="292" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· result</text>
<text x="404" y="308" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· envelope</text>
<rect x="660" y="60" width="296" height="340" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="676" y="84" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#616265" text-anchor="start" letter-spacing="1.2">ASYNC</text>
<rect x="676" y="100" width="264" height="44" fill="#eceef0" stroke="#b4b6b8" stroke-width="1"/>
<text x="686" y="126.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Requestor</text>
<rect x="676" y="330" width="264" height="44" fill="#fcfdff" stroke="#3b3c3e" stroke-width="1"/>
<text x="686" y="356.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Node</text>
<path d="M 700,144 L 700,330" fill="none" stroke="#4b91f0" stroke-width="1.2" marker-end="url(#h-4b91f0)"/>
<rect x="716" y="166" width="75.0" height="18.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="753.5" y="178.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">GET /n?q=…</text>
<rect x="716" y="186" width="144.29999999999998" height="18.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="788.15" y="198.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">Prefer: respond-async</text>
<path d="M 928,330 L 928,144" fill="none" stroke="#616265" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-616265)"/>
<rect x="716" y="230" width="188.4" height="18.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="810.2" y="242.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">202 · Location: &lt;run handle&gt;</text>
<text x="722" y="260" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· GET  handle  → status</text>
<text x="722" y="276" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#616265" text-anchor="start">· DELETE handle → cancel</text>
<rect x="24" y="430" width="616" height="150" fill="#f2f6fe" stroke="#b2c5e1" stroke-width="1"/>
<text x="34" y="448" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Fallback (spec v0.2 §11.4, plus one rule of ours)</text>
<text x="34" y="465.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">stream → sync: the node cannot stream; the envelope says delivery: sync</text>
<text x="34" y="479.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">sync → async: the run would outlive the timeout; 202 + Location</text>
<text x="34" y="494.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">any → sync: sync is the universal floor (our addition)</text>
<text x="34" y="508.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start"></text>
<text x="34" y="523.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">One optimistic request: ask for stream, accept whatever comes back. No probing.</text>
<rect x="660" y="430" width="296" height="150" fill="#eceef0" stroke="#b4b6b8" stroke-width="1"/>
<text x="670" y="448" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">WebSocket</text>
<text x="670" y="465.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">product client ↔ Engine session only</text>
<text x="670" y="479.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">never a node binding</text>
<text x="670" y="494.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">never a fallback target</text>
<text x="670" y="508.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start"></text>
<text x="670" y="523.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">SSE is the spec&#x27;s stream transport (§11.2).</text>
<text x="24" y="606" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">Every mode is the same GET with the same expression. Only the answer&#x27;s shape changes.</text>
</svg>
