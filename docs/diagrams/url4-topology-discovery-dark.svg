<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-label="url4 topology — discovery: node document vs per-endpoint OPTIONS"><title>url4 topology — discovery: node document vs per-endpoint OPTIONS</title><defs><marker id="h-75affe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#75affe"/></marker><marker id="h-c8ccd2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c8ccd2"/></marker></defs>
<rect x="0" y="0" width="980" height="540" fill="#05070b"/>
<text x="24" y="34" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e5eb" text-anchor="start">url4 topology — discovery: node document vs per-endpoint OPTIONS</text>
<rect x="24" y="60" width="456" height="400" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<rect x="500" y="60" width="456" height="400" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="40" y="84" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#c8ccd2" text-anchor="start" letter-spacing="1.2">A · ONE DOCUMENT PER NODE</text>
<text x="516" y="84" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#c8ccd2" text-anchor="start" letter-spacing="1.2">B · ONE ANSWER PER ENDPOINT</text>
<rect x="44" y="110" width="140" height="50" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="54" y="139.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Requestor</text>
<rect x="330" y="100" width="126" height="170" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="340" y="118" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Node</text>
<rect x="346" y="130" width="94" height="30" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="356" y="148" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/</text>
<rect x="346" y="170" width="94" height="30" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="356" y="188" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/summarize</text>
<rect x="346" y="210" width="94" height="30" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="356" y="228" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/claude</text>
<path d="M 184,125 L 330,125" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="44" y="88" width="236.4" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="162.2" y="101.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">GET /.well-known/url4-capabilities</text>
<path d="M 330,150 L 184,150" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-c8ccd2)"/>
<rect x="44" y="172" width="256.2" height="19" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="172.1" y="185.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#e0e5eb" text-anchor="middle">one JSON: endpoints, mounts, features</text>
<rect x="44" y="300" width="412" height="120" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="54" y="318" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">one call answers “can this node run my expression?”</text>
<text x="54" y="335.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">+ cacheable, one round-trip, lists proxy mounts with targets</text>
<text x="54" y="349.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">− lives at the origin root only (RFC 8615): an endpoint behind a shared</text>
<text x="54" y="364.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">   gateway is visible only if that gateway lists it</text>
<rect x="520" y="110" width="140" height="50" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="530" y="139.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Requestor</text>
<rect x="776" y="105" width="160" height="40" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="786" y="123" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/summarize</text>
<rect x="776" y="175" width="160" height="40" fill="#0c0f13" stroke="#44484d" stroke-width="1"/>
<text x="786" y="193" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">/claude</text>
<path d="M 660,125 L 776,125" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="652.6" y="98.5" width="130.8" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="718.0" y="111.85" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">OPTIONS /summarize</text>
<path d="M 660,145 L 700,145 L 700,195 L 776,195" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="662.5" y="205.5" width="111.0" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="718.0" y="218.85" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">OPTIONS /claude</text>
<path d="M 776,135 L 660,135" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="520" y="300" width="412" height="120" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="530" y="318" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">each endpoint describes only itself (RFC 9110 §9.3.7)</text>
<text x="530" y="335.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">+ works for a standalone function with no node document</text>
<text x="530" y="349.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">− one round-trip per endpoint; browsers and CORS middleware also use</text>
<text x="530" y="364.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">   OPTIONS (preflight); CDNs do not cache it; some gateways drop it</text>
<text x="24" y="492" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">A third mechanism in the draft: a Capabilities response header pointing at the document (Part G §27.1). Section 5 leaves the choice to the owner.</text>
<text x="24" y="510" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">The document is Part G §27.2 (draft, SHOULD); the header is MAY; OPTIONS appears nowhere in the spec.</text>
</svg>
