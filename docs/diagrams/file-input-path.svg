<text class="s" x="40" y="320">TARGET v1: two ingress paths; local run-scoped blobs; attachments ride beside the string payload</text>
<rect x="40" y="345" width="260" height="150" rx="10" fill="#1e293b" stroke="#30a46c" stroke-width="2.5"/>
<text class="h" x="170.0" y="375">Case ingress (engine)</text>
<text class="l" x="170.0" y="405">inline data: parts in $input</text>
<text class="l" x="170.0" y="427">RUN_SPEC ≤ 1 MiB</text>
<text class="l" x="170.0" y="449">never in the URL</text>
<text class="l" x="170.0" y="471">or an expression</text>
<rect x="40" y="545" width="260" height="150" rx="10" fill="#1e293b" stroke="#30a46c" stroke-width="2.5"/>
<text class="h" x="170.0" y="575">url4 ingress</text>
<text class="l" x="170.0" y="605">(img:src=/blob/sha256/&lt;hex&gt;)</text>
<text class="l" x="170.0" y="627">blob:sha256/&lt;hex&gt;</text>
<text class="l" x="170.0" y="649">(no url4:// refs in v1)</text>
<text class="l" x="170.0" y="671">refs as AST bindings</text>
<rect x="360" y="545" width="260" height="150" rx="10" fill="#1e293b" stroke="#3e8ed0" stroke-width="2.5"/>
<text class="h" x="490.0" y="575">url4 node resolver</text>
<text class="l" x="490.0" y="605">no authority → store read</text>
<text class="l" x="490.0" y="627">any url4:// ref →</text>
<text class="l" x="490.0" y="649">x.remote_blob_unsupported</text>
<text class="l" x="490.0" y="671">(no network I/O)</text>
<line x1="304" y1="620" x2="356" y2="620" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="680" y="345" width="300" height="350" rx="10" fill="#1e293b" stroke="#30a46c" stroke-width="2.5"/>
<text class="h" x="830.0" y="375">engine run blob store</text>
<text class="l" x="830.0" y="405">scope: tenant + run</text>
<text class="l" x="830.0" y="427">sha256 verified on store</text>
<text class="l" x="830.0" y="449">and on every read</text>
<text class="l" x="830.0" y="471"></text>
<text class="l" x="830.0" y="493">run context:</text>
<text class="l" x="830.0" y="515">payload: str (unchanged)</text>
<text class="l" x="830.0" y="537">attachments[]: ordered refs</text>
<text class="l" x="830.0" y="559">(digest, media type,</text>
<text class="l" x="830.0" y="581"> filename?, detail?)</text>
<text class="l" x="830.0" y="603"></text>
<text class="l" x="830.0" y="625">inherited unchanged by</text>
<text class="l" x="830.0" y="647">pipelines, nesting, retries</text>
<line x1="304" y1="420" x2="676" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="490" y="410">ingest: decode, hash, store</text>
<line x1="624" y1="620" x2="676" y2="620" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="490" y="725">ref → attachment; IOLayer bytes fetch (bytes, media_type)</text>
<rect x="1040" y="430" width="200" height="180" rx="10" fill="#1e293b" stroke="#30a46c" stroke-width="2.5"/>
