<text class="h" x="750.0" y="130">engine connector</text>
<text class="l" x="750.0" y="160">content must be text</text>
<text class="l" x="750.0" y="182">→ invalid_candidate_input</text>
<line x1="864" y1="165.0" x2="936" y2="165.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="900.0" y="254">chat/completions</text>
<rect x="940" y="100" width="220" height="130" rx="10" fill="#1e293b" stroke="#f5a524" stroke-width="2.5"/>
<text class="h" x="1050.0" y="130">gateway</text>
<text class="l" x="1050.0" y="160">native image/PDF parts</text>
<text class="l" x="1050.0" y="182">(OME-1541); else typed</text>
<text class="l" x="1050.0" y="204">422; no body cap</text>
<line x1="1164" y1="165.0" x2="1236" y2="165.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="1200.0" y="254">inlineData / input_*</text>
<rect x="1240" y="100" width="220" height="130" rx="10" fill="#1e293b" stroke="#f5a524" stroke-width="2.5"/>
<text class="h" x="1350.0" y="130">provider</text>
<text class="l" x="1350.0" y="160">Antigravity · Codex ·</text>
<text class="l" x="1350.0" y="182">Claude · OpenRouter ✓</text>
