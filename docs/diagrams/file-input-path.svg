<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="t d" font-family="JetBrains Mono, Menlo, SF Mono, monospace">
<title id="t">File input path: url4, engine, gateway, provider (OME-1535)</title>
<desc id="d">Top row, TODAY at main ec4b632b2 (2026-10-21): a caller can only send text in the URL; url4 payloads are strings and an unquoted data: source is a ParseError; the engine connector refuses non-text content; the gateway carries native image and PDF parts for Gemini, Antigravity and Codex and refuses the rest with a typed 422; Ollama answers a PDF with 422 since #1447. Bottom rows, TARGET v1: two separate ingress paths. Case ingress puts inline data: parts in the run spec, straight into the engine run blob store. url4 ingress resolves authority-less src= blob refs at the evaluating node; every url4:// blob ref, the node's own authority included, fails with x.remote_blob_unsupported before any network I/O. The engine keeps run-scoped blobs, verifies sha256 and carries an ordered attachments list beside the string payload; every model-calling node sends attachments first, then the text, through the gateway to the provider.</desc>
<style>text{fill:#e2e8f0}.t{font-size:18px;font-weight:700}.s{font-size:15px;font-weight:700}.h{font-size:15px;font-weight:700;text-anchor:middle}.l{font-size:13px;text-anchor:middle;fill:#cbd5e1}.a{font-size:13px;text-anchor:middle;fill:#94a3b8}.c{font-size:13px;fill:#94a3b8}</style>
<rect width="1500" height="860" fill="#0f172a"/>
