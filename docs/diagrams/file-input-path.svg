<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1770 1030" role="img" aria-labelledby="t d" font-family="JetBrains Mono, Menlo, SF Mono, monospace">
<title id="t">File input path: url4, engine, gateway, provider (OME-1535)</title>
<desc id="d">Top row, TODAY at main ec4b632b2 (2026-10-21): a caller can only send text in the URL; url4 payloads are strings and an unquoted data: source is a ParseError; the engine connector refuses non-text content; the gateway carries native image and PDF parts for Gemini, Antigravity and Codex and refuses the rest with a typed 422; Ollama answers a PDF with 422 since #1447. Bottom rows, TARGET v1: two separate ingress paths. Case ingress reads Cases from cases.json; a Case with pictures or PDFs is a v2 candidate-input envelope (spec 2.7) whose typed parts go straight to the engine connector in their written position, never through the run spec and never into attachments. url4 ingress resolves authority-less src= blob refs at the evaluating node; every url4:// blob ref, the node's own authority included, fails with x.remote_blob_unsupported before any network I/O. An https:// value in a src= binding is fetched at run start through the url4 HTTP transport destination guard (https only, DNS vetted and pinned, at most 3 hops, deadline, byte cap; refusals are typed x.source_* errors) and its non-text bytes are written through to the store. A url4:// remote-node call (C6) fails with x.remote_node_unsupported before any I/O. The engine run blob store keeps these url4 and https blobs, run-scoped and sha256-verified, as an ordered attachments list beside the string payload. The engine connector keeps v2 envelope parts as written and puts url4 attachment parts on the last user message, data: URIs only, refuses parts on judge calls, and authorizes and verifies every blob before forming a request key; requests pass the gateway (content-part gate, 8 MiB body cap) to every model-calling node.</desc>
