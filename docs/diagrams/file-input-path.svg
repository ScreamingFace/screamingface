<text class="l" x="150.0" y="160">GET /?q=&lt;url4&gt;</text>
<text class="l" x="150.0" y="182">text in the URL</text>
<text class="l" x="150.0" y="204">8 KiB cap</text>
<line x1="264" y1="165.0" x2="336" y2="165.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="300.0" y="254">text only</text>
<rect x="340" y="100" width="220" height="130" rx="10" fill="#1e293b" stroke="#e5484d" stroke-width="2.5"/>
<text class="h" x="450.0" y="130">url4</text>
<text class="l" x="450.0" y="160">Payload = str</text>
<text class="l" x="450.0" y="182">unquoted data: source</text>
<text class="l" x="450.0" y="204">→ ParseError</text>
<line x1="564" y1="165.0" x2="636" y2="165.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<text class="a" x="600.0" y="254">str context</text>
