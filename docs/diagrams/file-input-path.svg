<rect x="1290" y="430" width="170" height="180" rx="10" fill="#1e293b" stroke="#30a46c" stroke-width="2.5"/>
<text class="h" x="1375.0" y="460">every model node</text>
<text class="l" x="1375.0" y="490">members</text>
