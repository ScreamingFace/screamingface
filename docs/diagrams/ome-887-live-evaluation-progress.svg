<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1420" width="1400" height="1420" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Live Evaluation progress through one Event stream</title>
  <desc id="diagram-desc">Existing URL4 observations and Benchmark-owned terminal Case snapshots join at the generic bridge and travel through the existing NATS and WebSocket Event stream to one Client callback. Generated URL4, execution, paid calls, and final CandidateResult remain unchanged.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "JetBrains Mono", monospace; paint-order: stroke fill; stroke: #020617; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      text.title { stroke-width: 6; }
      text.sub { stroke-width: 3; }
      .cluster { fill: none; stroke-width: 1; stroke-dasharray: 8 6; rx: 4; }
      .component { rx: 2; stroke-width: 1.5; }
      .edge { fill: none; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1400" height="1420" fill="#020617"/>
  <rect width="1400" height="1420" fill="url(#grid)"/>

  <text x="40" y="45" class="title" fill="#f8fafc" font-size="22" font-weight="700">LIVE EVALUATION PROGRESS · ONE EVENT STREAM</text>
  <text x="40" y="72" class="sub" fill="#94a3b8" font-size="12">Existing URL4 activity keeps the interface alive; terminal Case Logs add exact progress.</text>

  <rect class="cluster" x="300" y="100" width="800" height="400" stroke="#22d3ee"/>
  <text x="320" y="120" fill="#22d3ee" font-size="11" font-weight="700">CLIENT · OME-933</text>
  <rect class="cluster" x="40" y="620" width="1320" height="250" stroke="#fb923c"/>
  <text x="60" y="640" fill="#fb923c" font-size="11" font-weight="700">GENERIC ENGINE DELIVERY · OME-934 + EXISTING TRANSPORT</text>
  <rect class="cluster" x="40" y="1040" width="1320" height="300" stroke="#34d399"/>
  <text x="930" y="1060" fill="#34d399" font-size="11" font-weight="700">EXECUTION + BENCHMARK SEMANTICS · OME-932</text>

  <path d="M700 250V345" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <text x="716" y="302" fill="#94a3b8" font-size="10">updates one row</text>
  <path d="M235 1120V790" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <text x="251" y="960" fill="#94a3b8" font-size="10">terminal snapshot</text>
  <path d="M370 745H530" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <text x="450" y="733" fill="#94a3b8" font-size="10" text-anchor="middle">ordinary Log</text>
  <path d="M680 1120V790" class="edge" stroke="#34d399" marker-end="url(#arrow-emerald)"/>
  <text x="696" y="960" fill="#94a3b8" font-size="10">existing observations</text>
  <path d="M830 745H1010" class="edge" stroke="#fb923c" marker-end="url(#arrow-orange)"/>
  <text x="920" y="733" fill="#94a3b8" font-size="10" text-anchor="middle">existing Event stream</text>
  <path d="M1145 700V207Q1145 195 1133 195H900" class="edge" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <text x="1161" y="452" fill="#94a3b8" font-size="10">one ordered callback</text>
  <line x1="1148" y1="448" x2="1158" y2="448" stroke="#64748b" stroke-width="0.5" stroke-dasharray="2,2"/>

  <rect class="component cyan" x="500" y="165" width="400" height="85" rx="2" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/>
  <text x="700" y="195" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">ONE CLIENT CALLBACK</text>
  <text x="700" y="218" fill="#94a3b8" font-size="10" text-anchor="middle">receives every public Event in sequence</text>
  <text x="700" y="235" fill="#22d3ee" font-size="9" text-anchor="middle">no URL4 parsing · no Client scoring</text>
  <rect class="component cyan" x="420" y="345" width="560" height="105" rx="2" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/>
  <text x="445" y="374" fill="#f8fafc" font-size="13" font-weight="700">CANDIDATE ROW</text>
  <text x="445" y="403" fill="#22d3ee" font-size="11" font-weight="600">Running</text>
  <text x="605" y="403" fill="#f8fafc" font-size="11">completed / total</text>
  <text x="825" y="403" fill="#f8fafc" font-size="11">score so far</text>
  <text x="445" y="430" fill="#94a3b8" font-size="9">activity: existing Events · exact bar: terminal Log · authority: final CandidateResult</text>

  <rect class="component emerald" x="100" y="700" width="270" height="90" rx="2" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text x="235" y="730" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">GENERIC RUN LOG SEAM</text>
  <text x="235" y="753" fill="#94a3b8" font-size="9" text-anchor="middle">exact URL4 + opaque emit_log</text>
  <text x="235" y="772" fill="#34d399" font-size="9" text-anchor="middle">no Benchmark knowledge</text>
  <rect class="component emerald" x="530" y="700" width="300" height="90" rx="2" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text x="680" y="730" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">EXISTING _BRIDGE</text>
  <text x="680" y="753" fill="#94a3b8" font-size="9" text-anchor="middle">one observer · ordered wire frames</text>
  <text x="680" y="772" fill="#34d399" font-size="9" text-anchor="middle">span · log · cost · result</text>
  <rect class="component amber" x="1010" y="700" width="270" height="90" rx="2" fill="rgba(251,146,60,.3)" stroke="#fb923c"/>
  <text x="1145" y="730" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">NATS / WEBSOCKET</text>
  <text x="1145" y="753" fill="#94a3b8" font-size="9" text-anchor="middle">existing ordered transport</text>
  <text x="1145" y="772" fill="#fb923c" font-size="9" text-anchor="middle">one public Event stream</text>

  <rect class="component emerald" x="75" y="1120" width="320" height="110" rx="2" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text x="235" y="1150" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">TERMINAL CASE RECORDER</text>
  <text x="235" y="1173" fill="#94a3b8" font-size="9" text-anchor="middle">shared grade_case + native scorer</text>
  <text x="235" y="1194" fill="#34d399" font-size="9" text-anchor="middle">completed · graded · failed · refused</text>
  <text x="235" y="1213" fill="#34d399" font-size="9" text-anchor="middle">provisional score · fail-open</text>
  <rect class="component slate" x="520" y="1120" width="320" height="110" rx="2" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/>
  <text x="680" y="1150" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">EXISTING URL4 RUN</text>
  <text x="680" y="1173" fill="#94a3b8" font-size="9" text-anchor="middle">Candidate / Fusion execution DAG</text>
  <text x="680" y="1194" fill="#94a3b8" font-size="9" text-anchor="middle">model · judge · cache · usage · cost</text>
  <text x="680" y="1213" fill="#f8fafc" font-size="9" text-anchor="middle">activity arrives without inference</text>
  <rect class="component slate" x="980" y="1100" width="320" height="150" rx="2" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/>
  <text x="1140" y="1131" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">UNCHANGED CONTRACT</text>
  <text x="1140" y="1157" fill="#94a3b8" font-size="9" text-anchor="middle">generated URL4 · execution graph</text>
  <text x="1140" y="1177" fill="#94a3b8" font-size="9" text-anchor="middle">protocol · revision · cache identity</text>
  <text x="1140" y="1197" fill="#94a3b8" font-size="9" text-anchor="middle">paid calls · Case envelopes</text>
  <text x="1140" y="1217" fill="#94a3b8" font-size="9" text-anchor="middle">final CandidateResult</text>
  <text x="1140" y="1238" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">BYTE-IDENTICAL / AUTHORITATIVE</text>

  <text x="40" y="1390" fill="#475569" font-size="10">OME-887 · OME-934 → OME-932 → OME-933 · SFDS v2 · 2026-08-22</text>
</svg>
