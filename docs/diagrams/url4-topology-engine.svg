<text x="24" y="606" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">The Runner becomes the evaluator process the / node spawns per run. The App keeps /ws for the product client and gains the node surface.</text>
<text x="24" y="624" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">Serverless posture: nodes are functions; the host is the only thing that needs an origin.</text>
