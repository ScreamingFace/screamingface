<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="url4 topology — request tree: the expression is the composition"><title>url4 topology — request tree: the expression is the composition</title><defs><marker id="h-4b91f0" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#4b91f0"/></marker><marker id="h-2b964e" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2b964e"/></marker><marker id="h-616265" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#616265"/></marker></defs>
<rect x="0" y="0" width="980" height="560" fill="#fcfdff"/>
<text x="24" y="34" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#3b3c3e" text-anchor="start">url4 topology — request tree: the expression is the composition</text>
<rect x="232.14999999999998" y="68.25" width="515.7" height="19.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="490.0" y="82.025" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">(a=/claude(ctx)!&#x27;a&#x27;, b=url4://beta.example/gemini(ctx)!&#x27;b&#x27;)!&#x27;merge $a $b&#x27;</text>
<path d="M 490,92 L 490,190" fill="none" stroke="#4b91f0" stroke-width="1.2" marker-end="url(#h-4b91f0)"/>
<rect x="452.95" y="122.25" width="74.1" height="19.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="490.0" y="136.025" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">GET /?q=…</text>
<rect x="60" y="150" width="520" height="330" fill="#f4f6f9" stroke="#c2c4c6" stroke-width="1"/>
<text x="70" y="168" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Host  url4://alpha.example  (evaluating)</text>
<rect x="80" y="190" width="480" height="54" fill="#fcfdff" stroke="#3b3c3e" stroke-width="1"/>
<text x="90" y="208" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">/</text>
<text x="90" y="225.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">evaluator: resolves the sources, then runs the intent</text>
<rect x="80" y="330" width="220" height="54" fill="#fcfdff" stroke="#3b3c3e" stroke-width="1"/>
<text x="90" y="348" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">/claude</text>
<text x="90" y="365.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">local mount</text>
<rect x="340" y="330" width="220" height="54" fill="#f2f6fe" stroke="#b2c5e1" stroke-width="1"/>
<text x="350" y="348" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">intent processor</text>
<text x="350" y="365.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">reduce: !&#x27;merge $a $b&#x27; → /claude</text>
<rect x="660" y="300" width="296" height="120" fill="#f4f6f9" stroke="#c2c4c6" stroke-width="1"/>
<text x="670" y="318" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">Host  url4://beta.example</text>
<rect x="676" y="340" width="264" height="54" fill="#fcfdff" stroke="#3b3c3e" stroke-width="1"/>
<text x="686" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" font-weight="500" fill="#3b3c3e" text-anchor="start">/gemini</text>
<text x="686" y="375.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#616265" text-anchor="start">beta resolves its own subtree</text>
<path d="M 190,244 L 190,330" fill="none" stroke="#2b964e" stroke-width="1.2" marker-end="url(#h-2b964e)"/>
<rect x="118.45" y="280.25" width="143.1" height="19.5" fill="#fcfdff" stroke="#2b964e" stroke-width="1"/>
<text x="190.0" y="294.025" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#2b964e" text-anchor="middle">1  a = /claude(ctx)</text>
<path d="M 560,217 L 808,217 L 808,340" fill="none" stroke="#4b91f0" stroke-width="1.2" marker-end="url(#h-4b91f0)"/>
<rect x="586.9" y="207.25" width="274.2" height="19.5" fill="#fcfdff" stroke="#b2c5e1" stroke-width="1"/>
<text x="724.0" y="221.025" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#0f3b6e" text-anchor="middle">2  b = url4://beta.example/gemini(ctx)</text>
<path d="M 450,244 L 450,330" fill="none" stroke="#616265" stroke-width="1.2" marker-end="url(#h-616265)"/>
<rect x="395.7" y="280.25" width="108.6" height="19.5" fill="#fcfdff" stroke="#c2c4c6" stroke-width="1"/>
<text x="450.0" y="294.025" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11.5" font-weight="400" fill="#3b3c3e" text-anchor="middle">3  merge $a $b</text>
<text x="60" y="508" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">The hosts an expression touches form its request tree (spec v0.2 §16.1: strict trees). There is no plan object and no swarm noun.</text>
<text x="60" y="526" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">1 and 2 run in parallel; 3 runs once both are terminal (quorum and triggers, spec v0.2 §12).</text>
</svg>
