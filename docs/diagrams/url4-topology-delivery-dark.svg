<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-label="url4 topology — delivery: one request, the node picks the richest mode it has"><title>url4 topology — delivery: one request, the node picks the richest mode it has</title><defs><marker id="h-75affe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#75affe"/></marker><marker id="h-c8ccd2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c8ccd2"/></marker></defs>
<rect x="0" y="0" width="980" height="640" fill="#05070b"/>
<text x="24" y="34" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e0e5eb" text-anchor="start">url4 topology — delivery: one request, the node picks the richest mode it has</text>
<rect x="24" y="70" width="220" height="60" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="34" y="88" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Evaluator</text>
<text x="34" y="105.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">requestor side</text>
<rect x="716" y="70" width="240" height="60" fill="#05070b" stroke="#e0e5eb" stroke-width="1"/>
<text x="726" y="88" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Node</text>
<text x="726" y="105.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">answers with the best it has</text>
<path d="M 244,100 L 716,100" fill="none" stroke="#75affe" stroke-width="1.2" marker-end="url(#h-75affe)"/>
<rect x="342.0" y="90.5" width="276.0" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="480.0" y="103.85" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">GET /claude?delivery=stream&amp;q=(ctx)!&#x27;go&#x27;</text>
<rect x="272.4" y="114.75" width="415.2" height="18.5" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="480.0" y="127.675" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#d2e6ff" text-anchor="middle">Upgrade: websocket   Accept: text/event-stream, application/json</text>
<text x="24" y="176" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="500" fill="#c8ccd2" text-anchor="start" letter-spacing="1.2">THE NODE&#x27;S FOUR POSSIBLE ANSWERS · ONE ROUND TRIP</text>
<path d="M 716,218 L 244,218" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-c8ccd2)"/>
<rect x="258" y="204" width="163.79999999999998" height="19" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="339.9" y="217.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#e0e5eb" text-anchor="middle">101 Switching Protocols</text>
<text x="258" y="240" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c8ccd2" text-anchor="start">bidirectional · cancel and attach in-band · telemetry as frames</text>
<rect x="636.6" y="204" width="71.4" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="672.3000000000001" y="217.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">WebSocket</text>
<rect x="24" y="204" width="49.8" height="18.5" fill="#05070b" stroke="#c8ccd2" stroke-width="1"/>
<text x="48.9" y="216.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#c8ccd2" text-anchor="middle">SHOULD</text>
<path d="M 716,284 L 244,284" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-c8ccd2)"/>
<rect x="258" y="270" width="150.6" height="19" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="333.3" y="283.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#e0e5eb" text-anchor="middle">200 text/event-stream</text>
<text x="258" y="306" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c8ccd2" text-anchor="start">events: log, span, cost.usage … result, envelope (spec v0.2 §11.2)</text>
<rect x="616.8" y="270" width="91.2" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="662.4" y="283.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">stream (SSE)</text>
<rect x="24" y="270" width="49.8" height="18.5" fill="#05070b" stroke="#c8ccd2" stroke-width="1"/>
<text x="48.9" y="282.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#c8ccd2" text-anchor="middle">SHOULD</text>
<path d="M 716,350 L 244,350" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-c8ccd2)"/>
<rect x="258" y="336" width="144.0" height="19" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="330.0" y="349.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#e0e5eb" text-anchor="middle">200 application/json</text>
<text x="258" y="372" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c8ccd2" text-anchor="start">result + envelope; telemetry in envelope.meta</text>
<rect x="669.6" y="336" width="38.4" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="688.8000000000001" y="349.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">sync</text>
<rect x="24" y="336" width="37.2" height="18.5" fill="#05070b" stroke="#e2a35b" stroke-width="1"/>
<text x="42.6" y="348.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#e2a35b" text-anchor="middle">MUST</text>
<path d="M 716,416 L 244,416" fill="none" stroke="#c8ccd2" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#h-c8ccd2)"/>
<rect x="258" y="402" width="196.79999999999998" height="19" fill="#05070b" stroke="#44484d" stroke-width="1"/>
<text x="356.4" y="415.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#e0e5eb" text-anchor="middle">202 + Location: &lt;run handle&gt;</text>
<text x="258" y="438" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11" font-weight="400" fill="#c8ccd2" text-anchor="start">GET handle → status · DELETE handle → cancel (Prefer: respond-async, or timeout)</text>
<rect x="663.0" y="402" width="45.0" height="19" fill="#05070b" stroke="#3c485b" stroke-width="1"/>
<text x="685.5" y="415.35" font-family="'IBM Plex Mono', Menlo, monospace" font-size="11" font-weight="400" fill="#d2e6ff" text-anchor="middle">async</text>
<rect x="24" y="402" width="49.8" height="18.5" fill="#05070b" stroke="#c8ccd2" stroke-width="1"/>
<text x="48.9" y="414.925" font-family="'IBM Plex Mono', Menlo, monospace" font-size="10.5" font-weight="400" fill="#c8ccd2" text-anchor="middle">SHOULD</text>
<rect x="24" y="470" width="616" height="120" fill="#0d0f13" stroke="#3c485b" stroke-width="1"/>
<text x="34" y="488" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Ladder, not error</text>
<text x="34" y="505.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">WebSocket → SSE → sync: the node answers below the ask when it must; envelope.delivery says what happened.</text>
<text x="34" y="519.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">sync → async when a run would outlive the timeout (spec v0.2 §11.4). any → sync is always legal.</text>
<text x="34" y="534.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Browsers cannot hand-craft the upgrade: they ask SSE-first and upgrade only where capabilities say WebSocket.</text>
<rect x="660" y="470" width="296" height="120" fill="#15181c" stroke="#585c61" stroke-width="1"/>
<text x="670" y="488" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#e0e5eb" text-anchor="start">Conformance</text>
<text x="670" y="505.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">sync MUST</text>
<text x="670" y="519.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">SSE, WebSocket, async SHOULD</text>
<text x="670" y="534.0" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">advertised per node in the</text>
<text x="670" y="548.5" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#c8ccd2" text-anchor="start">capabilities document (§5)</text>
<text x="24" y="620" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Telemetry is always in-band: frames, SSE events, or the envelope. A remote host&#x27;s own OTLP export is never something the caller needs.</text>
</svg>
