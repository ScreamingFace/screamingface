<text x="24" y="558" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#616265" text-anchor="start">Rule (spec §5.4, §3.5): /path resolves on the evaluating host; url4:// names another host; every other scheme is data read by an adapter.</text>
