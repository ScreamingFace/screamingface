<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 430" width="1060" height="430" font-family="IBM Plex Mono, Menlo, monospace">
<title>Fusion with quorum and optional members</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#585d67"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4452f"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9821f"/></marker></defs>
<rect width="1060" height="430" fill="#ffffff"/>
<text x="40" y="42" font-size="16" fill="#16181d" text-anchor="start" font-weight="600">Which members reach the synthesizer</text>
<text x="40" y="64" font-size="11" fill="#8b909a" text-anchor="start" letter-spacing="0.04em">FUSION(MEMBERS, SYNTHESIZER, QUORUM=...) · THE QUORUM IS CHECKED AFTER THE MEMBERS FINISH</text>
<rect x="40" y="100" width="230" height="66" fill="#f6f6f7" stroke="#2f7d4f" stroke-width="1"/>
<text x="155.0" y="124" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member A</text>
<text x="155.0" y="146" font-size="10.5" fill="#585d67" text-anchor="middle">required, succeeds</text>
<rect x="40" y="190" width="230" height="66" fill="#f6f6f7" stroke="#2f7d4f" stroke-width="1"/>
<text x="155.0" y="214" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member B</text>
<text x="155.0" y="236" font-size="10.5" fill="#585d67" text-anchor="middle">required, succeeds</text>
<rect x="40" y="280" width="230" height="66" fill="#f6f6f7" stroke="#b4452f" stroke-width="1" stroke-dasharray="5 4"/>
<text x="155.0" y="304" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Member C</text>
<text x="155.0" y="326" font-size="10.5" fill="#585d67" text-anchor="middle">optional=True, fails</text>
<rect x="400" y="170" width="270" height="106" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<rect x="400" y="170" width="3" height="106" fill="#c9821f"/>
<text x="535.0" y="194" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Quorum check</text>
<text x="535.0" y="216" font-size="10.5" fill="#585d67" text-anchor="middle">succeeded members &gt;= quorum</text>
<text x="535.0" y="233" font-size="10.5" fill="#585d67" text-anchor="middle">&quot;all&quot;: every member (default)</text>
<text x="535.0" y="250" font-size="10.5" fill="#585d67" text-anchor="middle">an integer: that many members</text>
<path d="M270 133 L335 133 L335 200 L400 200" fill="none" stroke="#2f7d4f" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M270 223 L400 223" fill="none" stroke="#2f7d4f" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M270 313 L335 313 L335 250 L400 250" fill="none" stroke="#b4452f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a-bad)"/>
<text x="40" y="372" font-size="10.5" fill="#b4452f" text-anchor="start">A failed optional member is a failed answer with reason missing,</text>
<text x="40" y="389" font-size="10.5" fill="#b4452f" text-anchor="start">never a vote.</text>
<rect x="780" y="100" width="240" height="90" fill="#f6f6f7" stroke="#2f7d4f" stroke-width="1"/>
<text x="900.0" y="124" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Synthesizer</text>
<text x="900.0" y="146" font-size="10.5" fill="#585d67" text-anchor="middle">combines the answers</text>
<text x="900.0" y="163" font-size="10.5" fill="#585d67" text-anchor="middle">that reached it</text>
<rect x="780" y="250" width="240" height="90" fill="#f6f6f7" stroke="#b4452f" stroke-width="1"/>
<text x="900.0" y="274" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Candidate fails</text>
<text x="900.0" y="296" font-size="10.5" fill="#585d67" text-anchor="middle">quorum not met, or a</text>
<text x="900.0" y="313" font-size="10.5" fill="#585d67" text-anchor="middle">required member failed</text>
<path d="M670 200 L725 200 L725 145 L780 145" fill="none" stroke="#2f7d4f" stroke-width="1.3" marker-end="url(#a-ok)"/>
<path d="M670 250 L725 250 L725 295 L780 295" fill="none" stroke="#b4452f" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="676" y="192" font-size="10.5" fill="#2f7d4f" text-anchor="start">met</text>
<text x="676" y="268" font-size="10.5" fill="#b4452f" text-anchor="start">not met</text>
<text x="40" y="418" font-size="10" fill="#8b909a" text-anchor="start">A required member that fails fails the candidate, whatever the quorum. quorum=0 lets the synthesizer run with no successful member.</text>
</svg>
