<text x="24" y="500" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">A node is a stateless function behind a path. A host is the origin that mounts nodes and answers discovery.</text>
<text x="24" y="518" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#c8ccd2" text-anchor="start">Nodes share nothing. They know each other only by address.</text>
