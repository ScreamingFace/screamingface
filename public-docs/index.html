<!doctype html>
<html lang="en" data-brand="marketing">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>ScreamingFace docs — compose and reproduce model fusions</title>
    <meta
      name="description"
      content="Documentation for ScreamingFace: an open toolkit for composing model fusions, running them against benchmarks, and reproducing any result from a single url4 line. Covers the Python client — install, quickstart, and the url4 format."
    />
    <meta
      name="keywords"
      content="ScreamingFace, model fusions, fusion, url4, reproducible evaluation, open-source, OpenMined, documentation"
    />
    <meta name="author" content="ScreamingFace" />
    <meta name="theme-color" content="#05070b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fcfdff" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://screamingface.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScreamingFace" />
    <meta property="og:title" content="ScreamingFace documentation" />
    <meta
      property="og:description"
      content="Compose model fusions, run them against benchmarks, and reproduce any result from a single url4 line. Documentation for the ScreamingFace Client."
    />
    <meta property="og:url" content="https://screamingface.ai/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ScreamingFace documentation" />
    <meta
      name="twitter:description"
      content="Compose model fusions, run them against benchmarks, and reproduce any result from a single url4 line."
    />

    <!-- Fonts — IBM Plex Sans + IBM Plex Mono + Parastoo (SFDS v2). Not yet
         self-hosted; loaded from Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Parastoo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Dark mode initialization -->
    <script>
      const theme = localStorage.getItem('theme') || 'dark';
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- Privacy-friendly analytics by Plausible. Cookieless; the script ignores localhost and
         file://, so dev and preview builds send nothing. Pageviews follow the router's
         history.pushState. Outbound links, file downloads and form submissions are captured by
         the script; '404' and 'Code Copy' are sent from src/lib/analytics.ts callers. -->
    <script async src="https://plausible.io/js/pa-dO3dK2BaMjDATf0c8Jznh.js"></script>
    <script>
      window.plausible =
        window.plausible ||
        function () {
          ;(plausible.q = plausible.q || []).push(arguments)
        }
      plausible.init =
        plausible.init ||
        function (i) {
          plausible.o = i || {}
        }
      plausible.init()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
