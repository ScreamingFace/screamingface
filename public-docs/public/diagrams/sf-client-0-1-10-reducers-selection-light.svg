<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" width="1060" height="360" font-family="IBM Plex Mono, Menlo, monospace">
<title>The input of the stage after Rank or Filter</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#585d67"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b4452f"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f7d4f"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9821f"/></marker></defs>
<rect width="1060" height="360" fill="#ffffff"/>
<text x="40" y="42" font-size="16" fill="#16181d" text-anchor="start" font-weight="600">What the stage after Rank or Filter receives</text>
<text x="40" y="64" font-size="11" fill="#8b909a" text-anchor="start" letter-spacing="0.04em">SELECTION IN A PIPELINE · THE NEXT STAGE IS A STAGE OF THE SAME PIPELINE</text>
<rect x="40" y="100" width="220" height="96" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<text x="150.0" y="124" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Case input</text>
<text x="150.0" y="146" font-size="10.5" fill="#585d67" text-anchor="middle">the question of one case,</text>
<text x="150.0" y="163" font-size="10.5" fill="#585d67" text-anchor="middle">given to every member</text>
<rect x="340" y="100" width="260" height="96" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<rect x="340" y="100" width="3" height="96" fill="#c9821f"/>
<text x="470.0" y="124" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Members</text>
<text x="470.0" y="146" font-size="10.5" fill="#585d67" text-anchor="middle">each member answers</text>
<text x="470.0" y="163" font-size="10.5" fill="#585d67" text-anchor="middle">the Case input</text>
<rect x="680" y="100" width="340" height="96" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<text x="850.0" y="124" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Rank(k) or Filter</text>
<text x="850.0" y="146" font-size="10.5" fill="#585d67" text-anchor="middle">Rank keeps the best k, best first</text>
<text x="850.0" y="163" font-size="10.5" fill="#585d67" text-anchor="middle">Filter keeps by a test, author order</text>
<path d="M260 148 L340 148" fill="none" stroke="#585d67" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M600 148 L680 148" fill="none" stroke="#585d67" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="640" y="138" font-size="10.5" fill="#8b909a" text-anchor="middle">answers</text>
<rect x="340" y="250" width="680" height="82" fill="#f6f6f7" stroke="#d4d6db" stroke-width="1"/>
<rect x="340" y="250" width="3" height="82" fill="#c9821f"/>
<text x="680.0" y="274" font-size="12" fill="#16181d" text-anchor="middle" font-weight="600" letter-spacing="0.04em">The next stage</text>
<text x="680.0" y="296" font-size="10.5" fill="#585d67" text-anchor="middle">receives one JSON object:</text>
<text x="680.0" y="313" font-size="10.5" fill="#585d67" text-anchor="middle">{&quot;input&quot;: &lt;Case input&gt;, &quot;selected&quot;: [{&quot;id&quot;: ..., &quot;text&quot;: ...}]}</text>
<path d="M850 196 L850 250" fill="none" stroke="#585d67" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="860" y="228" font-size="10.5" fill="#8b909a" text-anchor="start">kept members</text>
<path d="M150 196 L150 291 L340 291" fill="none" stroke="#585d67" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="160" y="240" font-size="10.5" fill="#8b909a" text-anchor="start">input</text>
<text x="40" y="352" font-size="10" fill="#8b909a" text-anchor="start">When nothing is kept, selected is []. A selection that ends a candidate, is a Fusion member or feeds a corrective loop raises ValueError.</text>
</svg>
