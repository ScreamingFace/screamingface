<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" font-family="Helvetica Neue, Arial, sans-serif">
<title>Your local cache fills from your own runs and from pulling the shared global community cache; calls already in the cache run for free.</title>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a808a"/></marker>
<marker id="arwg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4faa68"/></marker>
</defs>
<rect width="720" height="232" fill="#0c0f13"/>

<!-- global cache -->
<rect x="64" y="104" width="252" height="74" rx="10" fill="#11231a" stroke="#4faa68" stroke-width="1.4"/>
<text x="190" y="138" font-size="16" fill="#7cdf8c" text-anchor="middle" font-weight="500">global cache</text>
<text x="190" y="160" font-size="12" fill="#5aa16f" text-anchor="middle">grows as the community runs</text>

<!-- your cache cylinder -->
<line x1="508" y1="46" x2="508" y2="90" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="508" y="38" font-size="12.5" fill="#8d939b" text-anchor="middle">your runs</text>
<path d="M456 92 a52 11 0 0 1 104 0 v62 a52 11 0 0 1 -104 0 z" fill="#1a1d22" stroke="#3a3e45" stroke-width="1.3"/>
<path d="M456 92 a52 11 0 0 0 104 0" fill="none" stroke="#3a3e45" stroke-width="1.3"/>
<text x="508" y="130" font-size="15" fill="#e0e5eb" text-anchor="middle">your cache</text>
<text x="508" y="196" font-size="12.5" fill="#8d939b" text-anchor="middle">cached calls run for free</text>

<!-- pull -->
<line x1="316" y1="138" x2="452" y2="138" stroke="#4faa68" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arwg)"/>
<text x="384" y="128" font-size="12.5" fill="#7cdf8c" text-anchor="middle">pull from global cache</text>
</svg>
