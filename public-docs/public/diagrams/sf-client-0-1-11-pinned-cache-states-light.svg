<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" font-family="Helvetica Neue, Arial, sans-serif">
<title>Pinned cache states</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6069"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d0634a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58b36e"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9821f"/></marker></defs>
<rect width="1060" height="470" fill="#ffffff"/>
<text x="40" y="42" font-size="16" fill="#2c2f36" text-anchor="start" font-weight="600">States of a pinned cache</text>
<text x="40" y="64" font-size="11" fill="#8b9096" text-anchor="start">capture=True · the engine opens the copy at the start of the run and seals it at the end</text>
<rect x="40" y="100" width="180" height="70" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="130.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Opening</text>
<text x="130.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">the run starts</text>
<rect x="280" y="100" width="180" height="70" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="370.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Open</text>
<text x="370.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">stores each answer</text>
<text x="370.0" y="163" font-size="10.5" fill="#5a6069" text-anchor="middle">and web-tool result</text>
<rect x="520" y="100" width="180" height="70" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="610.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Sealing</text>
<text x="610.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">the run ends</text>
<rect x="760" y="100" width="260" height="70" rx="10" fill="#f4f5f7" stroke="#58b36e" stroke-width="1"/>
<text x="890.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Sealed</text>
<text x="890.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">the gateway confirmed it</text>
<path d="M220 135 L280 135" fill="none" stroke="#5a6069" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M460 135 L520 135" fill="none" stroke="#5a6069" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M700 135 L760 135" fill="none" stroke="#58b36e" stroke-width="1.3" marker-end="url(#a-ok)"/>
<rect x="40" y="270" width="200" height="70" rx="10" fill="#f4f5f7" stroke="#d0634a" stroke-width="1"/>
<text x="140.0" y="294" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">capture_status</text>
<text x="140.0" y="316" font-size="10.5" fill="#5a6069" text-anchor="middle">&#x27;partial&#x27;</text>
<rect x="760" y="270" width="260" height="70" rx="10" fill="#f4f5f7" stroke="#58b36e" stroke-width="1"/>
<text x="890.0" y="294" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">capture_status</text>
<text x="890.0" y="316" font-size="10.5" fill="#5a6069" text-anchor="middle">&#x27;complete&#x27;</text>
<path d="M890 170 L890 270" fill="none" stroke="#58b36e" stroke-width="1.3" marker-end="url(#a-ok)"/>
<text x="880" y="230" font-size="10.5" fill="#58b36e" text-anchor="end">every call and web-tool result</text>
<text x="880" y="246" font-size="10.5" fill="#58b36e" text-anchor="end">stored, and the run did not</text>
<text x="880" y="262" font-size="10.5" fill="#58b36e" text-anchor="end">use the local runtime</text>
<path d="M110 170 L110 270" fill="none" stroke="#d0634a" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="118" y="196" font-size="10.5" fill="#d0634a" text-anchor="start">Open: the copy</text>
<text x="118" y="212" font-size="10.5" fill="#d0634a" text-anchor="start">did not open</text>
<path d="M370 170 L370 220 L170 220 L170 270" fill="none" stroke="#d0634a" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="380" y="196" font-size="10.5" fill="#d0634a" text-anchor="start">Failed, Refused, Missing,</text>
<text x="380" y="212" font-size="10.5" fill="#d0634a" text-anchor="start">Error, Ambiguous</text>
<path d="M610 170 L610 250 L210 250 L210 270" fill="none" stroke="#d0634a" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="620" y="196" font-size="10.5" fill="#d0634a" text-anchor="start">Seal: the seal was not confirmed.</text>
<text x="620" y="212" font-size="10.5" fill="#8b9096" text-anchor="start">A cancelled run is never sealed.</text>
<rect x="280" y="380" width="740" height="66" rx="10" fill="#f4f5f7" stroke="#d0634a" stroke-width="1" stroke-dasharray="5 4"/>
<text x="650.0" y="404" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Local runtime</text>
<text x="650.0" y="426" font-size="10.5" fill="#5a6069" text-anchor="middle">Local: a capture on the local runtime is always partial,</text>
<text x="650.0" y="443" font-size="10.5" fill="#5a6069" text-anchor="middle">capture_partial_reasons == (&#x27;local&#x27;,)</text>
<path d="M280 413 L140 413 L140 340" fill="none" stroke="#d0634a" stroke-width="1.3" marker-end="url(#a-bad)"/>
<text x="40" y="366" font-size="10.5" fill="#8b9096" text-anchor="start">Capture is off by default.</text>
</svg>
