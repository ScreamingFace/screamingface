<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="Helvetica Neue, Arial, sans-serif">
<title>Local request flow: you, through the Client, engine and gateway on your machine, out to a provider on your keys; the engine's cache accumulates across runs and can pull from the shared community cache, and the engine submits a verifiable result to the public leaderboard.</title>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a808a"/></marker>
<marker id="arwg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4faa68"/></marker>
</defs>
<rect width="1240" height="470" fill="#0c0f13"/>

<!-- your jupyter container -->
<rect x="30" y="24" width="872" height="312" rx="12" fill="none" stroke="#3a3e45" stroke-width="1.3" stroke-dasharray="6 5"/>
<text x="52" y="48" font-size="15" fill="#8d939b">your jupyter</text>

<!-- top row -->
<rect x="56" y="64" width="104" height="84" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1.4"/>
<text x="108" y="112" font-size="18" fill="#e0e5eb" text-anchor="middle" font-weight="500">You</text>

<rect x="210" y="64" width="176" height="84" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1.4"/>
<text x="298" y="112" font-size="18" fill="#e0e5eb" text-anchor="middle" font-weight="500">Client</text>

<rect x="446" y="64" width="176" height="84" rx="10" fill="#4f86e8" stroke="#6a9bf0" stroke-width="1.4"/>
<text x="534" y="112" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="500">Engine</text>

<rect x="682" y="64" width="176" height="84" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1.4"/>
<text x="770" y="112" font-size="18" fill="#e0e5eb" text-anchor="middle" font-weight="500">Gateway</text>

<rect x="980" y="64" width="214" height="84" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1.4"/>
<text x="1087" y="105" font-size="18" fill="#e0e5eb" text-anchor="middle" font-weight="500">Provider</text>
<text x="1087" y="127" font-size="13" fill="#8d939b" text-anchor="middle">OpenRouter · …</text>

<!-- top row arrows -->
<line x1="160" y1="106" x2="206" y2="106" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<line x1="386" y1="106" x2="442" y2="106" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<line x1="622" y1="106" x2="678" y2="106" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<line x1="858" y1="106" x2="976" y2="106" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="917" y="94" font-size="13" fill="#8d939b" text-anchor="middle">your key</text>

<!-- cache cylinder -->
<line x1="534" y1="148" x2="534" y2="208" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<path d="M479 210 a55 11 0 0 1 110 0 v56 a55 11 0 0 1 -110 0 z" fill="#1a1d22" stroke="#3a3e45" stroke-width="1.3"/>
<path d="M479 210 a55 11 0 0 0 110 0" fill="none" stroke="#3a3e45" stroke-width="1.3"/>
<text x="534" y="246" font-size="15" fill="#e0e5eb" text-anchor="middle">cache</text>
<text x="534" y="302" font-size="12.5" fill="#8d939b" text-anchor="middle">accumulates across runs</text>

<!-- global cache (live pull) -->
<rect x="356" y="372" width="178" height="54" rx="10" fill="#11231a" stroke="#4faa68" stroke-width="1.4"/>
<text x="445" y="404" font-size="16" fill="#7cdf8c" text-anchor="middle" font-weight="500">global cache</text>
<path d="M451 372 L510 284" fill="none" stroke="#4faa68" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arwg)"/>
<text x="356" y="446" font-size="12.5" fill="#7cdf8c" text-anchor="start">pull from global cache</text>

<!-- verifiable submission to the public leaderboard -->
<rect x="840" y="372" width="360" height="54" rx="10" fill="#11231a" stroke="#4faa68" stroke-width="1.4"/>
<text x="1020" y="405" font-size="17" fill="#7cdf8c" text-anchor="middle" font-weight="500">public verifiable leaderboard</text>
<path d="M612 148 V399 H840" fill="none" stroke="#7a808a" stroke-width="1.8" marker-end="url(#arw)"/>
<text x="700" y="392" font-size="12.5" fill="#8d939b" text-anchor="start">verifiable submission</text>
</svg>
