<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 1060 268" width="1060" height="268" font-family="Helvetica Neue, Arial, sans-serif">
<title>A chain with a narrow step before a reducer</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6069"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d0634a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58b36e"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9821f"/></marker></defs>
<rect width="1060" height="410" fill="#ffffff"/>
<rect x="40" y="100" width="200" height="96" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="140.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">sf.Fanout</text>
<text x="140.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">members a, b, c answer:</text>
<text x="140.0" y="163" font-size="10.5" fill="#5a6069" text-anchor="middle">1, 1 and 2</text>
<rect x="290" y="100" width="200" height="96" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="390.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">sf.Judge</text>
<text x="390.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">one call scores every</text>
<text x="390.0" y="163" font-size="10.5" fill="#5a6069" text-anchor="middle">member: 10, 10 and 2</text>
<rect x="540" y="100" width="220" height="96" rx="10" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1"/>
<text x="650.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">sf.Rank(2)</text>
<text x="650.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">keeps the 2 best by</text>
<text x="650.0" y="163" font-size="10.5" fill="#5a6069" text-anchor="middle">score:judge: a and b</text>
<rect x="810" y="100" width="210" height="96" rx="10" fill="#f1f9f3" stroke="#58b36e" stroke-width="1"/>
<text x="915.0" y="124" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">sf.Vote()</text>
<text x="915.0" y="146" font-size="10.5" fill="#5a6069" text-anchor="middle">reads a and b only</text>
<text x="915.0" y="163" font-size="10.5" fill="#5a6069" text-anchor="middle">answer: &#x27;1&#x27;</text>
<path d="M240 148 L290 148" fill="none" stroke="#5a6069" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M490 148 L540 148" fill="none" stroke="#5a6069" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M760 148 L810 148" fill="none" stroke="#58b36e" stroke-width="1.3" marker-end="url(#a-ok)"/>
<rect x="540" y="250" width="220" height="70" rx="10" fill="#f4f5f7" stroke="#d0634a" stroke-width="1" stroke-dasharray="5 4"/>
<text x="650.0" y="274" font-size="12" fill="#2c2f36" text-anchor="middle" font-weight="500">Member c</text>
<text x="650.0" y="296" font-size="10.5" fill="#5a6069" text-anchor="middle">status excluded</text>
<text x="650.0" y="313" font-size="10.5" fill="#5a6069" text-anchor="middle">reason not_selected</text>
<path d="M650 196 L650 250" fill="none" stroke="#d0634a" stroke-width="1.3" marker-end="url(#a-bad)"/>
</svg>
