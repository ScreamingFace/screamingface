<text x="165.0" y="225.0" font-size="13" fill="#c8ccd2" text-anchor="middle">answers, then stops</text>
<rect x="410" y="150" width="250" height="96" rx="11" fill="#16231b" stroke="#4faa68" stroke-width="1.6"/>
<text x="535.0" y="181.0" font-size="15" fill="#e0e5eb" text-anchor="middle" font-weight="600">gemini-flash</text>
<text x="535.0" y="205.0" font-size="13" fill="#c8ccd2" text-anchor="middle">runs only if the first</text>
<text x="535.0" y="225.0" font-size="13" fill="#c8ccd2" text-anchor="middle">gave no answer</text>
