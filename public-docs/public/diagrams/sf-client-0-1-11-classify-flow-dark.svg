<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" font-family="Helvetica Neue, Arial, sans-serif">
<title>The sf.classify call path</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a808a"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9735c"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4faa68"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a23c"/></marker></defs>
<rect width="1060" height="300" fill="#0c0f13"/>
<text x="40" y="42" font-size="16" fill="#e0e5eb" text-anchor="start" font-weight="600">The path of sf.classify</text>
<text x="40" y="64" font-size="11" fill="#8d939b" text-anchor="start">One text in, one list of label scores out · the model id names your endpoint</text>
<rect x="40" y="100" width="230" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="155.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">ScreamingFace Client</text>
<text x="155.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">sf.classify(model, input)</text>
<text x="155.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">byom_&lt;id&gt;/classifier_v1</text>
<rect x="320" y="100" width="210" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="425.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">ScreamingFace Engine</text>
<text x="425.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">POST /classify</text>
<text x="425.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">waits at most 30 s</text>
<rect x="580" y="100" width="210" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="685.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">AI Gateway</text>
<text x="685.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">holds the key stored</text>
<text x="685.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">with sf.connect</text>
<rect x="840" y="100" width="180" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="930.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">Your endpoint</text>
<text x="930.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">the byom_&lt;id&gt;</text>
<text x="930.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">origin</text>
<path d="M270 148 L320 148" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M530 148 L580 148" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M790 148 L840 148" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="40" y="232" font-size="10.5" fill="#c8ccd2" text-anchor="start">The endpoint receives {&quot;inputs&quot;: &lt;input&gt;} with the bearer key.</text>
<text x="40" y="252" font-size="10" fill="#c8ccd2" text-anchor="start">It returns [{label, score}, ...] with scores from 0 to 1. The Client returns Classification(model, contract, scores).</text>
<text x="40" y="280" font-size="10.5" fill="#8d939b" text-anchor="start">The Client refuses before any call when the encoded request is over 8,192 bytes (uri_too_long).</text>
</svg>
