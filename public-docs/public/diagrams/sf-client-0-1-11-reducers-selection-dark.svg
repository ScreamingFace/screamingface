<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 76 1060 280" width="1060" height="280" font-family="Helvetica Neue, Arial, sans-serif">
<title>The input of the Synthesize writer after Rank or Filter</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a808a"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9735c"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4faa68"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a23c"/></marker></defs>
<rect width="1060" height="360" fill="#0c0f13"/>
<rect x="40" y="100" width="220" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="150.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">Case input</text>
<text x="150.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">the question of one case,</text>
<text x="150.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">given to every member</text>
<rect x="340" y="100" width="260" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="470.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">sf.Fanout members</text>
<text x="470.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">each member answers</text>
<text x="470.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">the Case input</text>
<rect x="680" y="100" width="340" height="96" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="850.0" y="124" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">sf.Rank(k) or sf.Filter</text>
<text x="850.0" y="146" font-size="10.5" fill="#c8ccd2" text-anchor="middle">Rank keeps the best k, best first</text>
<text x="850.0" y="163" font-size="10.5" fill="#c8ccd2" text-anchor="middle">Filter keeps by a test, author order</text>
<path d="M260 148 L340 148" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M600 148 L680 148" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="640" y="138" font-size="10.5" fill="#8d939b" text-anchor="middle">answers</text>
<rect x="340" y="250" width="680" height="82" rx="10" fill="#15181c" stroke="#3a3e45" stroke-width="1"/>
<text x="680.0" y="274" font-size="12" fill="#e0e5eb" text-anchor="middle" font-weight="500">sf.Synthesize writer</text>
<text x="680.0" y="296" font-size="10.5" fill="#c8ccd2" text-anchor="middle">receives one JSON object:</text>
<text x="680.0" y="313" font-size="10.5" fill="#c8ccd2" text-anchor="middle">{&quot;input&quot;: &lt;Case input&gt;, &quot;selected&quot;: [{&quot;id&quot;: ..., &quot;text&quot;: ...}]}</text>
<path d="M850 196 L850 250" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="860" y="228" font-size="10.5" fill="#8d939b" text-anchor="start">kept members</text>
<path d="M150 196 L150 291 L340 291" fill="none" stroke="#7a808a" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="160" y="240" font-size="10.5" fill="#8d939b" text-anchor="start">input</text>
</svg>
