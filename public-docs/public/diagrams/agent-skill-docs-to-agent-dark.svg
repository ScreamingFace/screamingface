<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" font-family="IBM Plex Mono, Menlo, monospace">
<title>From docs to agent</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa0aa"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07a62"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fbf86"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a23c"/></marker></defs>
<rect width="1240" height="400" fill="#0a0b0d"/>
<text x="40" y="42" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="600">From docs to agent</text>
<text x="40" y="64" font-size="11" fill="#686e78" text-anchor="start" letter-spacing="0.04em">ONE GENERATOR WRITES THE SKILL AND THE MARKDOWN ENDPOINTS FROM THE SAME PAGES</text>
<rect x="40" y="150" width="200" height="96" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="140.0" y="174" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Docs pages</text>
<text x="140.0" y="196" font-size="10.5" fill="#9aa0aa" text-anchor="middle">public-docs/src/pages</text>
<rect x="290" y="150" width="230" height="96" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<rect x="290" y="150" width="3" height="96" fill="#e0a23c"/>
<text x="405.0" y="174" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Generator</text>
<text x="405.0" y="196" font-size="10.5" fill="#9aa0aa" text-anchor="middle">npm run build:skill</text>
<text x="405.0" y="213" font-size="10.5" fill="#9aa0aa" text-anchor="middle">npm run build</text>
<rect x="580" y="90" width="250" height="96" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="705.0" y="114" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">agent-skill/</text>
<text x="705.0" y="136" font-size="10.5" fill="#9aa0aa" text-anchor="middle">committed to the repository</text>
<text x="705.0" y="153" font-size="10.5" fill="#9aa0aa" text-anchor="middle">SKILL.md and one reference</text>
<text x="705.0" y="170" font-size="10.5" fill="#9aa0aa" text-anchor="middle">for each page</text>
<rect x="580" y="230" width="250" height="96" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="705.0" y="254" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">dist/</text>
<text x="705.0" y="276" font-size="10.5" fill="#9aa0aa" text-anchor="middle">served at docs.screamingface.ai</text>
<text x="705.0" y="293" font-size="10.5" fill="#9aa0aa" text-anchor="middle">&lt;route&gt;.md, llms.txt,</text>
<text x="705.0" y="310" font-size="10.5" fill="#9aa0aa" text-anchor="middle">llms-full.txt</text>
<rect x="890" y="50" width="310" height="80" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="1045.0" y="74" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Claude Code</text>
<text x="1045.0" y="96" font-size="10.5" fill="#9aa0aa" text-anchor="middle">claude plugin install</text>
<text x="1045.0" y="113" font-size="10.5" fill="#9aa0aa" text-anchor="middle">docs@screamingface</text>
<rect x="890" y="140" width="310" height="96" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="1045.0" y="164" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Other agents</text>
<text x="1045.0" y="186" font-size="10.5" fill="#9aa0aa" text-anchor="middle">npx skills add</text>
<text x="1045.0" y="203" font-size="10.5" fill="#9aa0aa" text-anchor="middle">ScreamingFace/screamingface</text>
<text x="1045.0" y="220" font-size="10.5" fill="#9aa0aa" text-anchor="middle">--skill screamingface</text>
<rect x="890" y="243" width="310" height="70" fill="#131519" stroke="#2c303a" stroke-width="1"/>
<text x="1045.0" y="267" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" letter-spacing="0.04em">Any agent</text>
<text x="1045.0" y="289" font-size="10.5" fill="#9aa0aa" text-anchor="middle">reads &lt;route&gt;.md</text>
<text x="1045.0" y="306" font-size="10.5" fill="#9aa0aa" text-anchor="middle">or llms.txt over HTTPS</text>
<path d="M240 198 L290 198" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M520 180 L550 180 L550 138 L580 138" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M520 216 L550 216 L550 278 L580 278" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M830 120 L860 120 L860 90 L890 90" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M830 150 L860 150 L860 188 L890 188" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<path d="M830 278 L890 278" fill="none" stroke="#9aa0aa" stroke-width="1.3" marker-end="url(#a-mid)"/>
<text x="40" y="372" font-size="10" fill="#686e78" text-anchor="start">CI regenerates the skill on every change and fails when the committed copy differs.</text>
</svg>
