<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.0 132 1060 126" width="1060" height="126" font-family="Helvetica Neue, Arial, sans-serif">
<title>A cascade: tiers joined by escalate_if lines</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6069"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d0634a"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#58b36e"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9821f"/></marker></defs>
<path d="M290 195 L410 195" fill="none" stroke="#c9821f" stroke-width="1.8" marker-end="url(#a-accent)"/>
<path d="M660 195 L780 195" fill="none" stroke="#c9821f" stroke-width="1.8" marker-end="url(#a-accent)"/>
<rect x="40" y="150" width="250" height="90" rx="11" fill="#f1f9f3" stroke="#58b36e" stroke-width="1.6"/>
<text x="165.0" y="178.0" font-size="15" fill="#2c2f36" text-anchor="middle" font-weight="600">Tier 1</text>
<text x="165.0" y="202.0" font-size="13" fill="#5a6069" text-anchor="middle">cheap panel vote</text>
<text x="165.0" y="222.0" font-size="13" fill="#5a6069" text-anchor="middle">kept when good enough</text>
<rect x="410" y="150" width="250" height="90" rx="11" fill="#f4f5f7" stroke="#cdd0d6" stroke-width="1.6"/>
<text x="535.0" y="178.0" font-size="15" fill="#2c2f36" text-anchor="middle" font-weight="600">Tier 2</text>
<text x="535.0" y="202.0" font-size="13" fill="#5a6069" text-anchor="middle">runs only after</text>
<text x="535.0" y="222.0" font-size="13" fill="#5a6069" text-anchor="middle">escalate_if holds</text>
<rect x="780" y="150" width="250" height="90" rx="11" fill="#fdf7ec" stroke="#c9821f" stroke-width="1.6"/>
<text x="905.0" y="178.0" font-size="15" fill="#2c2f36" text-anchor="middle" font-weight="600">Tier 3</text>
<text x="905.0" y="202.0" font-size="13" fill="#5a6069" text-anchor="middle">the last tier</text>
<text x="905.0" y="222.0" font-size="13" fill="#5a6069" text-anchor="middle">answers unconditionally</text>
<text x="350" y="186" font-size="13" fill="#c9821f" text-anchor="middle" font-weight="600">escalate_if</text>
<text x="720" y="186" font-size="13" fill="#c9821f" text-anchor="middle" font-weight="600">escalate_if</text>
</svg>