<svg xmlns="http://www.w3.org/2000/svg" viewBox="10.0 74 1060 264" width="1060" height="264" font-family="Helvetica Neue, Arial, sans-serif">
<title>A budget checks an optional call before it is sent</title>
<defs><marker id="a-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a808a"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d9735c"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4faa68"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e0a23c"/></marker></defs>
<path d="M310 195 L410 195" fill="none" stroke="#7a808a" stroke-width="1.8" marker-end="url(#a-mid)"/>
<path d="M650 195 L715 195 L715 134 L780 134" fill="none" stroke="#4faa68" stroke-width="1.8" marker-end="url(#a-ok)"/>
<path d="M650 195 L715 195 L715 278 L780 278" fill="none" stroke="#d9735c" stroke-width="1.8" marker-end="url(#a-bad)"/>
<rect x="40" y="150" width="270" height="90" rx="11" fill="#15181c" stroke="#3a3e45" stroke-width="1.6"/>
<text x="175.0" y="178.0" font-size="15" fill="#e0e5eb" text-anchor="middle" font-weight="600">spent so far + estimate</text>
<text x="175.0" y="202.0" font-size="13" fill="#c8ccd2" text-anchor="middle">of the branch a gate</text>
<text x="175.0" y="222.0" font-size="13" fill="#c8ccd2" text-anchor="middle">could skip</text>
<rect x="410" y="150" width="240" height="90" rx="11" fill="#15181c" stroke="#3a3e45" stroke-width="1.6"/>
<text x="530.0" y="188.0" font-size="15" fill="#e0e5eb" text-anchor="middle" font-weight="600">within the cap?</text>
<text x="530.0" y="212.0" font-size="13" fill="#c8ccd2" text-anchor="middle">sum vs budget_usd</text>
<rect x="780" y="92" width="260" height="84" rx="11" fill="#16231b" stroke="#4faa68" stroke-width="1.6"/>
<text x="910.0" y="127.0" font-size="15" fill="#e0e5eb" text-anchor="middle" font-weight="600">send the call</text>
<text x="910.0" y="151.0" font-size="13" fill="#c8ccd2" text-anchor="middle">the branch runs</text>
<rect x="780" y="236" width="260" height="84" rx="11" fill="#241816" stroke="#d9735c" stroke-width="1.6"/>
<text x="910.0" y="271.0" font-size="15" fill="#e0e5eb" text-anchor="middle" font-weight="600">skip it</text>
<text x="910.0" y="295.0" font-size="13" fill="#c8ccd2" text-anchor="middle">budget_refused</text>
<text x="692" y="158" font-size="13" fill="#4faa68" text-anchor="middle" font-weight="600">under</text>
<text x="692" y="250" font-size="13" fill="#d9735c" text-anchor="middle" font-weight="600">over</text>
</svg>