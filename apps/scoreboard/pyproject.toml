[project]
name = "scoreboard"
version = "0.1.1"
description = "ScreamingFace benchmark scoreboard service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # WHY a runtime dependency, not a dev one: the seed job reads the Engine benchmark catalogue
    # over HTTP inside the production image, which is built with `uv sync --frozen --no-dev`.
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tortoise-orm[asyncpg]==1.1.9",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
scoreboard = "scoreboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoreboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
# OME-1916: test_catalog_summary.py carries an owner-approved test-contract edit, tracked
# byte-exact in .claude/test-change-approvals/OME-1916.json (base_blob/approved_blob pin
# the whole file's git blob hash, same mechanism OME-1852 used). The approved line is one
# character set literal over 100 chars; `ruff format` has no per-line or per-rule
# exemption (only `ruff check` does, via per-file-ignores below), and reformatting the
# line, or wrapping it with `# fmt: off`/`# fmt: on`, would change its bytes and invalidate
# that approval. Excluded here instead of touching the approved file — this is the only
# file ruff skips in the project, and only because of this one pinned line.
extend-exclude = ["tests/unit/test_catalog_summary.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.per-file-ignores]
# Belt-and-suspenders: documents the same E501 exemption for `ruff check` specifically,
# in case the `extend-exclude` entry above is ever narrowed to format-only in a future
# ruff release.
"tests/unit/test_catalog_summary.py" = ["E501"]

[tool.ruff.lint.mccabe]
# Day-1 threshold — see apps/scoreboard/docs/complexity-baseline.md
max-complexity = 8

[tool.ruff.lint.pylint]
# Day-1 thresholds — see apps/scoreboard/docs/complexity-baseline.md
max-statements = 26
max-branches = 7
max-returns = 3

[tool.tortoise]
tortoise_orm = "scoreboard.db.TORTOISE_CONFIG"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
# Smoke tests reach the network and assert against systems we do not own (the brand site).
# They are drift alarms, run deliberately — never a merge gate, because someone else editing
# their site must not turn our build red. Run them with: uv run pytest -m smoke
addopts = ["-m", "not smoke"]
markers = [
    "smoke: hits a real external system; opt-in, excluded from the default run and from CI",
]
filterwarnings = [
    "error::DeprecationWarning:scoreboard",
    "ignore::DeprecationWarning:tortoise",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5",
    "ruff>=0.16.1",
    "tinycss2>=1.5.1",
]
