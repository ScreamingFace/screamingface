[project]
name = "scoreboard"
version = "0.2.0"
description = "ScreamingFace benchmark scoreboard service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # WHY a runtime dependency, not a dev one: the seed job reads the Engine benchmark catalogue
    # over HTTP inside the production image, which is built with `uv sync --frozen --no-dev`.
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tortoise-orm[asyncpg]==1.1.8",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
scoreboard = "scoreboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoreboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
# Day-1 threshold — see apps/scoreboard/docs/complexity-baseline.md
max-complexity = 8

[tool.ruff.lint.pylint]
# Day-1 thresholds — see apps/scoreboard/docs/complexity-baseline.md
max-statements = 26
max-branches = 7
max-returns = 3

[tool.tortoise]
tortoise_orm = "scoreboard.db.TORTOISE_CONFIG"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
# Smoke tests reach the network and assert against systems we do not own (the brand site).
# They are drift alarms, run deliberately — never a merge gate, because someone else editing
# their site must not turn our build red. Run them with: uv run pytest -m smoke
addopts = ["-m", "not smoke"]
markers = [
    "smoke: hits a real external system; opt-in, excluded from the default run and from CI",
]
filterwarnings = [
    "error::DeprecationWarning:scoreboard",
    "ignore::DeprecationWarning:tortoise",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5",
    "ruff>=0.16.1",
]
