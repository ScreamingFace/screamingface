replicaCount: 1

image:
  repository: ghcr.io/screamingface/screamingface-scoreboard
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001

config:
  host: 0.0.0.0
  port: 9106
  logLevel: info
  portalDir: /app/web/portal
  portalArtifactsDir: /app/web/artifacts
  forwardedAllowIps: "*"
  # disabled (default) trusts the client-supplied submitted_by free text, matching
  # today's behavior. cloudflare_headers requires and trusts the X-User-Email identity
  # header the mesh gateway injects — only sound where this service is reachable
  # exclusively through that mesh (OME-404).
  authMode: disabled
  allowedNetworks: ""

cors:
  origins:
    - "*"

database:
  existingSecret: scoreboard-db
  existingSecretKey: database-url

service:
  type: ClusterIP
  port: 9106

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: scoreboard.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

# OME-894: `sfp-`/`sfu-` are server-owned idempotency namespaces. `0009` clears client-written
# rows out of them, but it runs as a PRE-upgrade hook, so rows the old replicas write during the
# rollout survive it. This post-upgrade pass clears those. Touches only `idempotency_keys`, whose
# rows expire within 24h and carry no score data.
purgeReservedIdempotencyKeys:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

seedBenchmarks:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}
  # FEATURE: benchmark descriptions on the leaderboard (OME-904).
  #
  # A benchmark's text — display name, description, focus line, dataset link — is written ONCE,
  # in the Engine benchmark definition it describes
  # (apps/screamingface-engine/src/screamingface_engine/benchmarks/<name>/definition.py). The
  # seed job reads it from that Engine's public catalog at deploy, so `revision` cannot drift
  # from the Engine's computed value and no deploy-time override can blank the prose.
  #
  # AIDEV-NOTE: do NOT reintroduce descriptions for an Engine-published benchmark below. Helm
  # replaces lists wholesale rather than merging them, which is exactly how the hand-copied
  # copy that used to live here was silently lost. An entry whose id the Engine publishes is
  # ignored by the seed job and named in its output.
  #
  # Deployment-owned: the Engine this board ranks submissions against.
  #
  # AIDEV-NOTE: this MUST be the Engine's in-cluster address (its Service DNS name), never the
  # public hostname. The public host sits behind Cloudflare Access, which answers 200 with an
  # HTML sign-in page rather than a 401 — verified 2026-08-20. The seed job then fails to parse
  # it, falls back, refuses the stale configured entries, and exits zero, so the deploy looks
  # clean while benchmark text silently stops being refreshed. The job logs a WARNING naming
  # the content type when this happens.
  #
  # Left empty, the job seeds only the entries listed below.
  engineUrl: ""
  # OME-986: the legacy news demo entries (hle, livetruth, livetruth-latest) were removed here.
  # They were leftovers from the previous SF project, carried no Engine revision, and were still
  # advertised on the public catalogue.
  #
  # AIDEV-NOTE: emptying this list only stops them being RE-CREATED. Seeding registers and
  # updates; it never deletes, so any row already in a database stays and is still served by
  # GET /v1/benchmarks. Removing an existing benchmark is a separate, deliberate step:
  #   python -m scoreboard.retire_benchmark --benchmark <id> --yes
  # which refuses while any score or baseline references it.
  benchmarks: []
networkPolicy:
  enabled: false
  ingressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
