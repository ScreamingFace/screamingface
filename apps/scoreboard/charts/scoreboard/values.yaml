replicaCount: 1

image:
  repository: ghcr.io/screamingface/screamingface-scoreboard
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 10001

config:
  host: 0.0.0.0
  port: 9106
  logLevel: info
  portalDir: /app/web/portal
  portalArtifactsDir: /app/web/artifacts
  forwardedAllowIps: "*"
  # disabled (default) trusts the client-supplied submitted_by free text, matching
  # today's behavior. cloudflare_headers requires and trusts the X-User-Email identity
  # header the mesh gateway injects — only sound where this service is reachable
  # exclusively through that mesh (OME-404).
  authMode: disabled
  allowedNetworks: ""
  # Request-pool bounds per pod for a PostgreSQL database (OME-1452). 1 / 5 are Tortoise 1.1.8's
  # own defaults, made explicit — not a capacity change. Each pod holds ONE more connection,
  # reserved for /readyz, so the budget is replicas x (dbPoolMaxsize + 1). Ignored for SQLite.
  dbPoolMinsize: 1
  dbPoolMaxsize: 5
  # Who may use the /v1/admin surface (withdraw, redistributable). Comma-joined into
  # SCOREBOARD_ADMIN_EMAILS. EMPTY IS THE SAFE DEFAULT: the admin API answers 503.
  # Works only with authMode: cloudflare_headers (D5).
  adminEmails: []
  clustering:
    enabled: true # SCOREBOARD_CLUSTERING_ENABLED
  # C3 verifier keys: {kid: base64 of the raw 32-byte Ed25519 public key}. Public; current
  # plus previous during a rotation. From `keygen --purpose receipt` stdout.
  receiptPublicKeys: {} # SCOREBOARD_RECEIPT_PUBLIC_KEYS (JSON)
  publish:
    enabled: false # SCOREBOARD_PUBLISH_WORKER_ENABLED and the GitHub/archive keys
    githubAppId: ""
    githubAppInstallationId: ""
    githubRepo: ScreamingFace/screamingface-cache-versions
    publicBaseUrl: https://scoreboard.screamingface.ai
    archive:
      endpointUrl: ""
      bucket: screamingface-cache-versions
      region: garage

# E14 key material. Keys in the Secret are the env var names (envFrom cannot rename):
#   SCOREBOARD_REPLAY_GRANT_SIGNING_KEY, SCOREBOARD_REPLAY_GRANT_SIGNING_KID,
#   SCOREBOARD_GITHUB_APP_PRIVATE_KEY, SCOREBOARD_ARCHIVE_S3_ACCESS_KEY_ID,
#   SCOREBOARD_ARCHIVE_S3_SECRET_ACCESS_KEY.
e14Secret:
  existingSecret: "" # RECOMMENDED for prod: created out of band (apps/scoreboard/DEPLOYMENT.md)
  # DEV ONLY - inline values render a chart Secret. No `lookup` reuse (secret-e14.yaml WHY).
  replayGrantSigningKey: ""
  replayGrantSigningKid: ""
  githubAppPrivateKey: ""
  archiveAccessKeyId: ""
  archiveSecretAccessKey: ""

cors:
  origins:
    - "*"

database:
  existingSecret: scoreboard-db
  existingSecretKey: database-url

service:
  type: ClusterIP
  port: 9106

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: scoreboard.screamingface.ai
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
  timeoutSeconds: 5

# WHY two endpoints (OME-944): /healthz is pure liveness and never touches the database — a
# DB-coupled liveness probe restarts every replica when one backend fails. /readyz runs a bounded
# `SELECT 1`, so a pod that cannot reach its database leaves the Service instead of 503ing.
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

migration:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}

seedBenchmarks:
  enabled: true
  serviceAccountName: default
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  annotations: {}
  # FEATURE: benchmark descriptions on the leaderboard (OME-904).
  #
  # A benchmark's text — display name, description, focus line, dataset link — is written ONCE,
  # in the Engine benchmark definition it describes
  # (apps/screamingface-engine/src/screamingface_engine/benchmarks/<name>/definition.py). The
  # seed job reads it from that Engine's public catalog at deploy, so `revision` cannot drift
  # from the Engine's computed value and no deploy-time override can blank the prose.
  #
  # AIDEV-NOTE: do NOT reintroduce descriptions for an Engine-published benchmark below. Helm
  # replaces lists wholesale rather than merging them, which is exactly how the hand-copied
  # copy that used to live here was silently lost. An entry whose id the Engine publishes is
  # ignored by the seed job and named in its output.
  #
  # Deployment-owned: the Engine this board ranks submissions against.
  #
  # AIDEV-NOTE: this MUST be the Engine's in-cluster address (its Service DNS name), never the
  # public hostname. The public host sits behind Cloudflare Access, which answers 200 with an
  # HTML sign-in page rather than a 401 — verified 2026-08-20. The seed job then fails to parse
  # it, falls back, refuses the stale configured entries, and exits zero, so the deploy looks
  # clean while benchmark text silently stops being refreshed. The job logs a WARNING naming
  # the content type when this happens.
  #
  # Left empty, the job seeds only the entries listed below.
  engineUrl: ""
  # OME-986: the legacy news demo entries (hle, livetruth, livetruth-latest) were removed here.
  # They were leftovers from the previous SF project, carried no Engine revision, and were still
  # advertised on the public catalogue.
  #
  # AIDEV-NOTE: emptying this list only stops them being RE-CREATED. Seeding registers and
  # updates; it never deletes, so any row already in a database stays and is still served by
  # GET /v1/benchmarks. Removing an existing benchmark is a separate, deliberate step:
  #   python -m scoreboard.retire_benchmark --benchmark <id> --yes
  # which refuses while any score or baseline references it.
  benchmarks: []
networkPolicy:
  enabled: false
  clientNamespace: "" # empty => this release's namespace
  clientPodNames: [] # app.kubernetes.io/name of the mesh (Envoy) data plane
  ingressCIDRs: []

nodeSelector: {}
tolerations: []
affinity: {}
