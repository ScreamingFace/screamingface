apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scoreboard.fullname" . }}
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
data:
  SCOREBOARD_HOST: {{ .Values.config.host | quote }}
  SCOREBOARD_PORT: {{ .Values.config.port | quote }}
  SCOREBOARD_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SCOREBOARD_PORTAL_DIR: {{ .Values.config.portalDir | quote }}
  SCOREBOARD_PORTAL_ARTIFACTS_DIR: {{ .Values.config.portalArtifactsDir | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.forwardedAllowIps | quote }}
  SCOREBOARD_CORS_ORIGINS: {{ .Values.cors.origins | toJson | quote }}
  SCOREBOARD_AUTH_MODE: {{ .Values.config.authMode | quote }}
  SCOREBOARD_ALLOWED_NETWORKS: {{ .Values.config.allowedNetworks | quote }}
  SCOREBOARD_DB_POOL_MINSIZE: {{ .Values.config.dbPoolMinsize | quote }}
  SCOREBOARD_DB_POOL_MAXSIZE: {{ .Values.config.dbPoolMaxsize | quote }}
