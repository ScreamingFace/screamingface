{{- if .Values.purgeReservedIdempotencyKeys.enabled -}}
{{/*
FEATURE: OME-894 — `sfp-` and `sfu-` are server-owned idempotency namespaces. Migration `0009`
clears client-written rows out of them, but the migrate Job is a `pre-install,pre-upgrade` hook:
it completes BEFORE the new pods roll, and old replicas keep storing client keys verbatim until
they terminate. A row written in that window outlives the migration.

WHY `post-upgrade` and not `post-install`: a fresh install has no old replicas and no legacy rows,
so there is nothing for it to do. Running only on upgrade keeps the hook's purpose legible.

Weighted after the seed Job so a deploy's observable output stays in a stable order. The two are
independent — this touches only `idempotency_keys`, which the seed never writes.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "scoreboard.fullname" . }}-purge-idempotency
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.purgeReservedIdempotencyKeys.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.purgeReservedIdempotencyKeys.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.purgeReservedIdempotencyKeys.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "scoreboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: purge-idempotency
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .Values.purgeReservedIdempotencyKeys.serviceAccountName | quote }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: purge-reserved-idempotency-keys
          image: {{ include "scoreboard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - scoreboard.purge_reserved_idempotency_keys
          env:
            - name: SCOREBOARD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
