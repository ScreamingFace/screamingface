{{/*
The E14 key material of the scoreboard (OME-1307): the replay-grant signing key and kid, the GitHub
App private key, and the archive READ key. Rendered ONLY when the chart owns the Secret, that is,
when `e14Secret.existingSecret` is empty and at least one inline value is set. An `existingSecret`
means an operator (or an External Secrets / Sealed Secrets flow) supplies it out of band, which is
the recommended prod shape.

INVARIANT: the keys MUST be the env var names. The Pod attaches this with `envFrom.secretRef`,
which injects every key under its OWN name and cannot rename.

WHY NO `lookup` REUSE: a reuse branch fires exactly when the operator DID supply a value, and it
would silently revert a key rotation to the stale cluster copy. The durable path is
`existingSecret`, which survives upgrades because the chart does not own the object. Inline values
are dev-only convenience.

WHY `toJson` and not `quote`: `quote` does not escape a newline, and YAML folds a raw newline in a
double-quoted scalar into a space, so a multi-line PEM App key would be corrupted. A JSON string is
a valid YAML double-quoted scalar.
*/}}
{{- if and (not .Values.e14Secret.existingSecret) (include "scoreboard.e14InlineSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "scoreboard.e14SecretName" . }}
  labels:
    {{- include "scoreboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.e14Secret.replayGrantSigningKey }}
  SCOREBOARD_REPLAY_GRANT_SIGNING_KEY: {{ . | toJson }}
  {{- end }}
  {{- with .Values.e14Secret.replayGrantSigningKid }}
  SCOREBOARD_REPLAY_GRANT_SIGNING_KID: {{ . | toJson }}
  {{- end }}
  {{- with .Values.e14Secret.githubAppPrivateKey }}
  SCOREBOARD_GITHUB_APP_PRIVATE_KEY: {{ . | toJson }}
  {{- end }}
  {{- with .Values.e14Secret.archiveAccessKeyId }}
  SCOREBOARD_ARCHIVE_S3_ACCESS_KEY_ID: {{ . | toJson }}
  {{- end }}
  {{- with .Values.e14Secret.archiveSecretAccessKey }}
  SCOREBOARD_ARCHIVE_S3_SECRET_ACCESS_KEY: {{ . | toJson }}
  {{- end }}
{{- end }}
