[project]
name = "report-intake"
version = "0.1.0"
description = "ScreamingFace report-intake service — accepts a client error report and files it"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # A RUNTIME dependency, not a test one: the Turnstile bot gate verifies a token against
    # Cloudflare's siteverify, which is the one outbound call the deployed pod makes.
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    # Pinned exactly, matching apps/scoreboard: the built-in migrations package this service
    # depends on is still labelled experimental upstream, so a patch bump can move the operation
    # set a committed migration file was written against.
    "tortoise-orm[asyncpg]==1.1.8",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
report-intake = "report_intake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_intake"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

# WHY these numbers and not aigateway's looser ones: aigateway's tier is an explicitly labelled
# Day-1 grandfathering of a codebase that already existed. This app is greenfield and has no
# legacy to grandfather, so it starts on the strict tier scoreboard and the engine are on.
# See apps/report-intake/docs/complexity-baseline.md.
[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

# Where `tortoise migrate` finds this service's ORM configuration. The CLI reads it from the
# pyproject.toml in its cwd, which is why every uv command for this app runs with cwd =
# apps/report-intake and why the image keeps pyproject.toml beside the venv.
[tool.tortoise]
tortoise_orm = "report_intake.db.TORTOISE_CONFIG"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:report_intake",
    # tortoise-orm 1.1.8 emits its own deprecations from inside tortoise; they are not this
    # app's to fix and the filter above is deliberately scoped to `report_intake` anyway.
    "ignore::DeprecationWarning:tortoise",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=5",
    "ruff>=0.16.1",
]
