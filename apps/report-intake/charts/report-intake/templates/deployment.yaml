{{- include "report-intake.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "report-intake.fullname" . }}
  labels:
    {{- include "report-intake.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "report-intake.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "report-intake.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the Pods when the ConfigMap changes. Without this a `helm upgrade` that moves
        # REPORT_INTAKE_AUTH_MODE updates the ConfigMap and changes nothing else — `envFrom` is
        # read once at container start, so every Pod keeps the old posture and the upgrade
        # reports success.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "report-intake.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: report-intake
          image: {{ include "report-intake.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          envFrom:
            - configMapRef:
                name: {{ include "report-intake.fullname" . }}
          # The two values that are NOT in the ConfigMap, for the same reason: both are secrets.
          # They complete §2.4's surface — with these, every `Settings` field is rendered.
          env:
            {{- include "report-intake.databaseEnv" . | nindent 12 }}
            {{- if .Values.turnstile.enabled }}
            - name: REPORT_INTAKE_TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "turnstile.existingSecret is required when turnstile.enabled=true — the chart never holds the secret literal, and without it siteverify rejects this service's own credentials and every anonymous report is answered 503" .Values.turnstile.existingSecret }}
                  key: {{ .Values.turnstile.existingSecretKey }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
