{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "report-intake.serviceAccountName" . }}
  labels:
    {{- include "report-intake.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# This service calls no Kubernetes API — it talks to a database and to Cloudflare's siteverify and
# nothing else. Mounting a token would hand an endpoint that accepts unauthenticated writes a
# cluster credential it has no use for.
automountServiceAccountToken: false
{{- end }}
