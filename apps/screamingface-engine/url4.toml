# screamingface-engine — the declared world, read by BOTH the Runner (what a run may address) and the App
# (what `GET /v1/models` advertises). One file, so discovery cannot promise what execution refuses.
#
# Baked into the image at /etc/url4/url4.toml (see Dockerfile). The image decides what CAN exist;
# env supplies only per-Job values (optional base_url / model overrides).
#
# THE MODEL LIST LIVES IN CODE: `screamingface_engine/world/models/builtins.py::BUILTIN_MODEL_WORLD`, seeded from
# every aigateway provider plugin and held to it by SET EQUALITY in
# `tests/unit/test_declared_models_match_aigateway.py` (OME-859). It moved out of this file because
# this array had drifted to 32 declared ids while the gateway served 117, and the guard of the day
# only asserted `declared ⊆ served` — so three seed PRs landed on one day, 2026-08-17, with 85
# models unaddressable and CI green throughout.
#
# INVARIANT: a route path is exactly "/" + the gateway id. No renaming, no aliases. Ids must match
# aigateway's `/v1/models` ids EXACTLY, and that id is ALWAYS `<custom_llm_provider>/<slug>` —
# `canonical_model_id` prefixes every provider's slug unless it already carries the prefix, with no
# exemption for any of them. Anthropic included: the served id is `anthropic/claude-haiku-4-5`.
# `models/registry.py::canonical_id` is the single mirror of that rule.
#
# 29 ids aigateway serves are NOT routable here: every HuggingFace router id pins a `:<provider>`
# backend and five OpenRouter ids carry `:batch` / `:free`, and a ':' cannot appear in a URL4 path
# segment (url4 spec §8). They are declared in the seeds and partitioned into
# `ModelRegistry.aigateway_only`, so the set is an enumerated fact rather than a silent omission —
# OME-819 tracks widening the grammar.
#
# `[[aigateway.models]]` IS STILL ACCEPTED and is ADDITIVE. Use it to declare a route the compiled
# world cannot know about (ollama discovers its models at run time; AIGW_OPENROUTER_DEFAULT_MODELS
# and AIGW_HUGGINGFACE_DEFAULT_MODELS replace their seed lists at deploy time), or to set
# `web_search = false` on a compiled route. It can never REMOVE one: the declared world is
# exhaustive over aigateway's compiled seeds.
#
#   [[aigateway.models]]
#   id = "ollama/llama-4"
#   web_search = false
#
# `web_search` says only THAT a route searches, never HOW — the mechanism is derived from the
# provider by `world.config.provider_of` against `world.config.WEB_SEARCH_NATIVE_PROVIDERS`. A
# provider in that set delegates to its own server-side search; every other route runs the
# Tavily-backed web_search/web_fetch tool loop. Defaults to TRUE, so declare it only to turn a
# route OFF. It also enables nothing on its own where the tool loop is used: the deployment must
# ALSO supply TAVILY_API_KEY, or the route serves plain completions (`runner/web_tools`).
#
# AIDEV-NOTE: a declared route is NOT an enabled deployment. OpenRouter sits behind
# AIGW_OPENROUTER_ENABLED, and a route whose provider is disabled or uncredentialed resolves here
# and then fails at the gateway, inside the user's expression. Before OME-859 the same call failed
# earlier and more legibly, as an unknown route; declaring the full compiled set is what moved that
# boundary outward.

[aigateway]
base_url = "http://127.0.0.1:9105"
default_route = "/anthropic/claude-haiku-4-5"
timeout_s = 600.0
web_tool_max_iterations = 12

# Absolute-URL sources (`https://…`) are a real url4 feature and a Url4Node world has always
# been able to fetch them. Set false to hand the node a denying outbound layer instead.
allow_outbound = true

# READ-SIDE TABLES — live (F3, prd/02). These are `url4 serve`'s tables, parsed by the engine
# and registered on the same node that serves model routes:
#
#   [data]        "/corpus/papers" = { file = "…", media_type = "application/json" }
#   [holdings]    default = { file = "…" }
#   [identities.alice]  default = { file = "…" }
#
# Providers may be `value` or `file` ONLY. A `command` provider is an exec surface the node
# tier cannot sandbox, so declaring one anywhere on the read side is a LOUD config error that
# names the offending declaration — never a silent no-op.
#
# D8 WARNING — [holdings] and [identities] are GLOBAL: every shelf declared here is readable
# by EVERY caller of the sync surface. Put NOTHING here that any single caller must be able to
# keep from the others; there is no per-caller scoping in v1.
#
# [commands] is still deferred deliberately (D2): argv-template exec mounts are deferred, not
# forgotten, and declaring the section today is a loud config error.
