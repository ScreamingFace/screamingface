# screamingface-engine — ONE distribution, ONE image, TWO modes (`screamingface-engine serve` /
# `screamingface-engine run` —
# see `screamingface_engine.cli`). It used to ship two distributions; they were merged because the run
# mode's dependencies were already a subset of the serving mode's, and the split's real cost was
# three hand-synced duplicate modules.
#
# This file is BOTH the shipped distribution and the dev/test root: the package under `src/`, the
# `tests/` tree, and the shared ruff/pytest tooling all hang off it. There used to be a second
# `backend/pyproject.toml` beneath a `package = false` aggregate here; the nesting bought nothing
# once the two distributions became one, so it is gone. The image is built from `Dockerfile`.
[project]
name = "screamingface-engine"
version = "1.5.0"
description = "screamingface-engine — the ScreamingFace Engine: the control plane (REST + WebSocket, schedules Runner Jobs) and the url4 run mode those Jobs execute."
requires-python = ">=3.12"
# Merging the former runner distribution in cost NO new dependency: its deps
# (httpx, nats-py, url4) were already a strict subset of these. What the run mode gains is
# serving-side packages it never imports; the layering gate is what keeps that true.
dependencies = [
    # --- serving mode only ---
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pyjwt>=2.10.1",
    "prometheus-client>=0.21.0",
    "pydantic-settings>=2.14.1",
    # --- both modes ---
    "pydantic>=2.13.4",
    # The catalog's upstream aigateway client (`screamingface_engine.catalog`), and the run mode's
    # aigateway + Tavily clients (`screamingface_engine.runner.connector`).
    "httpx>=0.28.1",
    # Both directions of the run log: the App consumes (`adapters.jetstream.JetStreamConsumer`),
    # the run mode publishes (`JetStreamPublisher`) — one adapter module, shared.
    "nats-py>=2.9.0",
    # The wire contract (`url4.streaming`) and the engine (`url4.dag`) ship in one distribution:
    # the App needs the former, the run mode the latter. The `streaming` extra is what pulls in
    # pydantic — it is NOT a base dependency of the engine, so that embedders who only run
    # expressions do not install a wire-format library they never import.
    "url4[streaming]",
    # --- run mode only: the vendored IFEval verifier (benchmarks/ifeval/vendor) ---
    "immutabledict>=4.2.0",
    "langdetect>=1.0.9",
    "nltk>=3.9.1",
]

[project.scripts]
screamingface-engine = "screamingface_engine.cli:main"
screamingface-engine-runner = "screamingface_engine.runner.main:main"
# COMPATIBILITY ALIASES — the app's previous name (OME-876). The worker pool's children exec
# `screamingface-engine run` (worker/exec_wrapper.py), so the aliases are no longer load-bearing
# for scheduling — they exist for anything that still invokes the old names (compose files,
# ad-hoc pods, operator muscle memory). OME-877 carries their removal.
#
# AIDEV-NOTE: these two move together, one release later, or not at all — dropping one while
# keeping the other breaks whatever still calls the dropped name.
url4-cloud = "screamingface_engine.cli:main"
url4-cloud-runner = "screamingface_engine.runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingface_engine"]

[tool.uv.sources]
url4 = { path = "../../packages/url4", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/screamingface_engine/benchmarks/ifeval/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

# `url4` is a path dependency from packages/, so isort cannot infer it as first-party from this
# project's own layout — name both import packages explicitly.
[tool.ruff.lint.isort]
known-first-party = [
    "url4",
    "screamingface_engine",
]

[tool.pyright]
ignore = ["src/screamingface_engine/benchmarks/ifeval/vendor"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:screamingface_engine",
]

[tool.coverage.run]
omit = ["src/screamingface_engine/benchmarks/ifeval/vendor/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=5",
    "ruff>=0.16.1",
]

# Notebook/example-only aids for .examples/ (not needed by the shipped apps). Mirrors
# packages/url4's `notebook` group: `uv sync --group examples` to run screamingface_engine_client
# standalone (e.g. from Jupyter, add .examples/utils to sys.path).
examples = [
    "httpx>=0.28.1",
    "websockets>=17.0.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
