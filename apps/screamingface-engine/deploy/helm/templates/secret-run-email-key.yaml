{{/*
The key that seals each Run's owner email at rest (OME-1837, E5 P2 spec R16). Rendered with Runs
on (`database.existingSecret`) unless `database.emailKey.existingSecret` names the operator's own.
Only the App reads it; the runner pool and the migrate Job never do.

WHY reuse before generate, as `secret-run-results-storage.yaml` does: a key minted again on a
values-less `helm upgrade` could not open the email of any Run in flight, so their pending
Candidates would fail `owner_unreadable`. WHY `resource-policy: keep`: an uninstall and
reinstall must find the same key. AIDEV-NOTE: `lookup` reads nothing under `helm template`,
GitOps renderers (Argo CD) or a deployer without read access to Secrets, so each render would
mint a new key: those must set `database.emailKey.existingSecret`.
*/}}
{{- if and .Values.database.existingSecret (not .Values.database.emailKey.existingSecret) }}
{{- $secretName := include "screamingface-engine.runEmailKeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data "URL4_CLOUD_RUN_EMAIL_KEY") -}}
{{- $key = (index $existing.data "URL4_CLOUD_RUN_EMAIL_KEY" | b64dec) -}}
{{- end -}}
{{- if not $key -}}
{{- $key = randBytes 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  URL4_CLOUD_RUN_EMAIL_KEY: {{ $key | quote }}
{{- end }}
