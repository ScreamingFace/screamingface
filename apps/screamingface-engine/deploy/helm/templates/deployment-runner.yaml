# The runner pool (OME-1092): the fixed worker pool that replaced one-Job-per-run scheduling.
#
# Each pod runs `screamingface-engine worker` (OME-1089): a slot pool that claims runs from the
# durable queue and forks each as a supervised child process. The declared concurrency is
# `replicas × workerSlots`; the queue's `max_ack_pending` derives from the same slot count, so
# the pool and the queue cannot disagree about how many runs one worker may hold.
#
# The pool runs the BENCHMARK image (`screamingface-engine.runnerImage`): the worker forks each
# run as a child from its own image, and the benchmark image is the one that layers the private
# grading assets the run mode needs. Private assets therefore still never reach the
# client-facing App.
#
# DRAIN (the deploy-interrupts-runs regression): on SIGTERM the worker stops pulling and keeps
# its in-flight children alive for `drainGraceS`, then terminates the rest with a named
# `worker_draining` frame. The preStop starts that drain by SIGTERMing the worker immediately,
# so the drain runs inside the termination grace period; the template FAILS the render
# unless `terminationGracePeriodSeconds` covers the full drain (see the guard at the top).
# The PodDisruptionBudget
# (`maxUnavailable: 1`) does NOT block voluntary disruptions — deliberately: `0` at a small
# replica count is either a placebo (1 replica: an eviction still takes the whole pool) or a
# deadlock (a drain that can never evict). `1` SERIALIZES voluntary disruptions — never two
# pods down at once — and the preStop drain, not the PDB, is what protects in-flight runs.
# An on-call engineer watching a node drain SHOULD expect one runner pod to be evicted and
# its runs to close out as `worker_draining`, not as an outage.
{{- /* The drain-timing guard (review follow-up P2-9): the kubelet SIGKILLs the pod at
`terminationGracePeriodSeconds`, and the drain needs `drainGraceS` (children finish
naturally) + KILL_GRACE_S (a straggler's SIGTERM-to-SIGKILL window) + a terminal-publish
budget (N supervisors each publishing a frame and flushing) to complete inside it. A
JSON-Schema description could not enforce the cross-field relation and the unit test
only reads the chart's own defaults, so a legal override (`drainGraceS: 30`,
`terminationGracePeriodSeconds: 31`) could deploy a pod whose drain cannot finish. The
relation is enforced HERE, where neither defaults nor overrides can bypass it.
KILL_GRACE_S restates `worker.supervisor.KILL_GRACE_S` (10s) — the chart cannot import
Python; keep the two in step. */ -}}
{{- $killGraceS := 10.0 -}}
{{- $publishBudgetS := 15.0 -}}
{{- /* V-10: `drainGraceS` is typed `number` in the schema, so truncating it with `int`
would let a fractional grace slip under the real requirement (30.9/55 rendered, though
55.9 is required). The minimum is computed in floats and CEILED — the termination grace
is an integer, so it must cover the whole fractional requirement. */ -}}
{{- $minimum := ceil (addf (float64 .Values.runnerPool.drainGraceS) $killGraceS $publishBudgetS) -}}
{{- if lt (float64 .Values.runnerPool.terminationGracePeriodSeconds) $minimum -}}
{{- fail (printf "runnerPool.terminationGracePeriodSeconds (%v) must be >= runnerPool.drainGraceS (%v) + kill grace (%v) + terminal-publish budget (%v) = %v: the kubelet SIGKILLs the pod at the termination deadline, and a drain cut short interrupts every in-flight run" (float64 .Values.runnerPool.terminationGracePeriodSeconds) (float64 .Values.runnerPool.drainGraceS) $killGraceS $publishBudgetS $minimum) -}}
{{- /* INVARIANT: `{{- end }}`, NOT `{{- end -}}`. The trailing `-}}` trims the newline after
`end`, which glues `apiVersion` onto the end of the preceding YAML COMMENT line — the field
then vanishes into the comment, `helm lint`/`helm template` still succeed, and the release is
refused at install with "apiVersion not set". Pinned by
`tests/unit/test_chart_render_document_identity.py`. */ -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "screamingface-engine.fullname" . }}-runner
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  replicas: {{ .Values.runnerPool.replicas }}
  selector:
    matchLabels:
      # The pool's own identity, NOT the chart's selectorLabels: aigateway's NetworkPolicy
      # admits the run workload by `app.kubernetes.io/name: url4-runner` (the old Job labels),
      # and the pool replaces the Jobs — so its pods must carry that label or they are denied
      # at the CNI. `instance` keeps the selector unique to this release.
      app.kubernetes.io/name: url4-runner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: url4-runner
        app.kubernetes.io/part-of: url4-cloud
        app.kubernetes.io/component: runner
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # INVARIANT: a ConfigMap/Secret value change alone MUST roll the pool — the worker's
        # deploy-time env comes from these sources, and a stale env is silently wrong behavior
        # (the same invariant as the App Deployment's checksum annotations).
        checksum/runner-env: {{ include (print $.Template.BasePath "/configmap-runner-env.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-artifact-storage.yaml") . | sha256sum }}
        checksum/tavily: {{ include (print $.Template.BasePath "/secret-tavily.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # INVARIANT: kubelet's legacy Docker-link env injection MUST stay off — the same rule as
      # the App Deployment. The worker's env is the runner-env ConfigMap + the secrets below.
      enableServiceLinks: false
      # The worker needs no cluster API at all — it talks to NATS and forks children. No token
      # is mounted, and the ServiceAccount exists for pod identity only.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "screamingface-engine.serviceAccountName" . }}
      # INVARIANT: must stay above `runnerPool.drainGraceS` — the kubelet SIGKILLs the pod at
      # this deadline, and a drain cut short interrupts every in-flight run.
      terminationGracePeriodSeconds: {{ .Values.runnerPool.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "screamingface-engine.runnerImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The mode switch (OME-1089): the worker claims runs from the queue and forks each as
          # a child. Pinned here beside the Deployment that uses it — the entrypoint belongs to
          # the image, and a values-file override could only name a mode the image does not have.
          command:
            - screamingface-engine
            - worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # The worker's Prometheus /metrics endpoint (prometheus_client.start_http_server).
            - name: metrics
              containerPort: {{ .Values.runnerPool.metricsPort }}
          env:
            # The worker's OWN settings, from `runnerPool` — the same values the
            # containerPort and the resource arithmetic above already consume. The
            # worker builds `Settings()` from its environment, and without these entries
            # it reads the code defaults instead of the chart's: an operator who raises
            # `workerSlots` to 8 gets 8× the resource requests and an 8-slot claim, while
            # the worker still runs 4 slots and the queue's `max_ack_pending` (derived
            # from `run_queue_worker_slots`) stays at the default — a drift nothing
            # reports because today's values coincide with the defaults (4 / 30 / 9109).
            # The names are `Settings`' own: the `URL4_CLOUD_` prefix plus the field.
            - name: URL4_CLOUD_RUN_QUEUE_WORKER_SLOTS
              value: {{ .Values.runnerPool.workerSlots | quote }}
            # INVARIANT: the SAME `config.runQueueReplicas` the App's ConfigMap renders. The
            # two halves declare one singleton stream, and `ensure_stream` refuses a divergent
            # declaration — a value reaching only one half fails whichever declares second.
            - name: URL4_CLOUD_RUN_QUEUE_REPLICAS
              value: {{ .Values.config.runQueueReplicas | quote }}
            - name: URL4_CLOUD_WORKER_DRAIN_GRACE_S
              value: {{ .Values.runnerPool.drainGraceS | quote }}
            - name: URL4_CLOUD_WORKER_METRICS_PORT
              value: {{ .Values.runnerPool.metricsPort | quote }}
            # `max_ack_pending` is a WHOLE-CONSUMER bound — the fleet's total unacked runs —
            # so the chart derives it from the fleet's own sizing: pods x slots. The code
            # default is a generic fleet-sized constant; the chart's value is the truth for
            # THIS deployment. (The value binds at consumer creation — resizing means a new
            # consumer, which a cutover or bucket-count change already implies.)
            - name: URL4_CLOUD_RUN_QUEUE_MAX_ACK_PENDING
              value: {{ mul .Values.runnerPool.replicas .Values.runnerPool.workerSlots | quote }}
          # Liveness on the metrics endpoint: the scrape server runs in its own thread, so
          # this catches process/pod-level death (the old Job-per-run design carried its own
          # per-run hard backstop; the pool needs a pod-level one). A wedged CLAIM loop with a
          # live scrape thread passes this probe — the loop-level signal is the
          # `worker_last_claim_attempt` gauge: alert when it stops advancing while
          # `worker_slots_busy` is below `worker_slots` and the queue has depth. No readiness
          # probe: a pull worker receives no routed traffic, so readiness would only delay
          # rollouts without ever gating anything.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            # The deploy-time runner env, unchanged from the Job path: Helm owns these names
            # (AIGATEWAY_BASE_URL, URL4_CLOUD_NATS_URL, the artifact-store settings), and the
            # worker's children inherit them from the worker's own env.
            - configMapRef:
                name: {{ include "screamingface-engine.fullname" . }}-runner-env
            {{- if eq .Values.artifactStorage.backend "s3" }}
            - secretRef:
                name: {{ include "screamingface-engine.artifactSecretName" . }}
            {{- end }}
            {{- if .Values.tavily.enabled }}
            - secretRef:
                name: {{ include "screamingface-engine.tavilySecretName" . }}
            {{- end }}
          lifecycle:
            # Start the drain NOW: the worker stops pulling on SIGTERM and keeps its in-flight
            # children alive for `drainGraceS`. Without this the drain would only start when the
            # kubelet's own SIGTERM lands, and the grace period would have to cover the whole
            # drain; with it, the drain runs inside the termination grace period.
            preStop:
              exec:
                command: ["sh", "-c", "kill -TERM 1"]
          resources:
            # workerSlots × per-run charge + the worker's own overhead — sized so the declared
            # concurrency can actually run. Memory limit only; no CPU limit, so a run can burst
            # into idle CPU instead of being CFS-throttled mid-inference.
            requests:
              cpu: {{ add (mul .Values.runnerPool.workerSlots .Values.runnerPool.perRunCharge.cpuMillicores) .Values.runnerPool.overhead.cpuMillicores }}m
              memory: {{ add (mul .Values.runnerPool.workerSlots .Values.runnerPool.perRunCharge.memoryMi) .Values.runnerPool.overhead.memoryMi }}Mi
            limits:
              memory: {{ add (mul .Values.runnerPool.workerSlots .Values.runnerPool.perRunCharge.memoryLimitMi) .Values.runnerPool.overhead.memoryLimitMi }}Mi
          # INVARIANT: pairs with `securityContext.readOnlyRootFilesystem` — the same rule as
          # the App Deployment. The worker and its children write temp files; without one
          # writable path, a transitive dependency that writes one crashes the pod.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
