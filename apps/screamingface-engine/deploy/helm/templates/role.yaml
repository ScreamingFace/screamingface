{{- if .Values.rbac.create -}}
# Namespace-scoped RBAC bootstrap (spec §9): the least privilege the stateless App needs to run
# Runner Jobs ONLY in its own namespace. Verbs mirror what K8sJobRunner calls exactly —
# create/get/list/watch/delete on batch/jobs; get/list on pods (+ pods/log) for status & logs.
#
# NO secrets verbs: a Runner Job carries no aigateway credential at all. aigateway runs in
# `cloudflare_headers` mode here and resolves the caller from the verified identity header, so
# there is nothing per-run to store by reference and the App never touches the Secret API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "screamingface-engine.fullname" . }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  # FEATURE (OME-1065): quota-aware admission. The App reads the namespace ResourceQuota
  # (status.used vs status.hard) and the LimitRanges (for the Pod's defaulted charge) before
  # scheduling a Job, so a saturated namespace refuses a run with 503 + Retry-After instead of
  # creating a Job whose Pod is silently refused.
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - limitranges
    verbs:
      - get
      - list
{{- end }}
