{{/*
The Tavily web-tools credential (spec 2026-07-23). Rendered ONLY when the chart owns the Secret —
`tavily.existingSecret` means an operator (or an External Secrets / Sealed Secrets flow) supplies
it out-of-band, which is the recommended prod shape.

INVARIANT: this Secret is attached to the runner pool with `envFrom.secretRef`, which injects
every key under its OWN name — so the key MUST be `TAVILY_API_KEY`, the variable the worker's
children read. The App never reads it, so it needs no `get secrets` RBAC and rotating this value
takes effect on the next worker rollout without restarting the App.

BREAKING (was `tavily.secretKey`, default `api-key`): an `existingSecret` supplied out-of-band must
now key the credential as `TAVILY_API_KEY`.
*/}}
{{- if and .Values.tavily.enabled (not .Values.tavily.existingSecret) }}
{{- $secretName := include "screamingface-engine.tavilySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $apiKey := .Values.tavily.apiKey -}}
{{- if not $apiKey -}}
{{/* WHY: reuse the key already in the cluster so a values-less `helm upgrade` does not wipe it. */}}
{{- if and $existing $existing.data (index $existing.data "TAVILY_API_KEY") -}}
{{- $apiKey = (index $existing.data "TAVILY_API_KEY" | b64dec) -}}
{{- else -}}
{{- fail "tavily.enabled requires either tavily.existingSecret or tavily.apiKey" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  TAVILY_API_KEY: {{ $apiKey | quote }}
{{- end }}
