{{- include "screamingface-engine.nodeTierRemoved" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "screamingface-engine.fullname" . }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
data:
  # Keys are the URL4_CLOUD_*-prefixed env consumed by screamingface_engine.config.Settings.
  #
  # The one exception, deliberately: this is read by `logs.configure()` and not by `Settings`
  # (OME-942). Logging is installed BEFORE anything reads config, because a failure while
  # building `Settings` is exactly the failure whose log line the operator needs.
  #
  # INVARIANT: rendered here AND in `configmap-runner-env.yaml` from the SAME value. Both
  # halves run `screamingface_engine` code through `cli.main`; a level reaching only the App
  # would leave the worker pods — the ones carrying a run's log context (OME-1069) — at INFO
  # while the operator believes the whole deployment is at DEBUG.
  URL4_CLOUD_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  URL4_CLOUD_NATS_URL: {{ include "screamingface-engine.natsUrl" . | quote }}
  URL4_CLOUD_IAT_WINDOW_S: {{ .Values.config.iatWindowS | quote }}
  URL4_CLOUD_SYNC_MAX_WAIT_S: {{ .Values.config.syncMaxWaitS | quote }}
  URL4_CLOUD_WS_HEARTBEAT_S: {{ .Values.config.wsHeartbeatS | quote }}
  URL4_CLOUD_JOB_DEADLINE_S: {{ .Values.config.jobDeadlineS | quote }}
  # How long a run may keep going with no WebSocket subscriber before the App stops it (OME-890).
  # INVARIANT: the reaper's audience count is IN-PROCESS, so this chart's `replicaCount: 1` is
  # load-bearing for it — a second replica would answer "nobody is listening" for runs the other
  # replica is streaming and stop healthy runs. Multi-replica needs a shared subscriber gate
  # (NATS consumer interest) before this can be scaled out. 0 disables the reaper.
  URL4_CLOUD_ORPHAN_GRACE_S: {{ .Values.config.orphanGraceS | quote }}
  # How long a queued run may wait with no frame before its attached client gets ONE generic
  # WARN notice (under OME-1086). Advisory only; 0 disables it. Assumes `replicaCount: 1`: only the
  # replica that scheduled a run warns, and only sockets attached to that replica.
  URL4_CLOUD_UNCLAIMED_RUN_WARN_S: {{ .Values.config.unclaimedRunWarnS | quote }}
  # Per-run downstream in-flight budget (OME-908). This is the APP's setting — the value it
  # writes onto every run as an explicit env entry (which beats this ConfigMap's `envFrom`,
  # so a stale copy here can never reach a run).
  URL4_CLOUD_RUNNER_IO_CONCURRENCY: {{ .Values.config.runnerIoConcurrency | quote }}
  # The run substrate the App schedules on (spec §9). `queue` is what makes this chart functional —
  # without it the App bridges NATS but answers every `GET /?q=` with 503.
  URL4_CLOUD_RUNNER: {{ .Values.runner.backend | quote }}
  # The queue stream's replica count (OME-1088).
  #
  # INVARIANT: rendered here AND in the runner pool's env from the SAME value. Both halves
  # declare the one singleton stream, and `ensure_stream` refuses a declaration whose
  # properties diverge from an existing one — so a value reaching only one half is a startup
  # failure for whichever half declares second, visible only on a clustered broker.
  URL4_CLOUD_RUN_QUEUE_REPLICAS: {{ .Values.config.runQueueReplicas | quote }}
  # The queue's bucket count (OME-1091).
  #
  # INVARIANT: rendered here AND in the runner pool's env from the SAME value. This half
  # PUBLISHES into one bucket (`bucket_subject`) and the worker POLLS them all
  # (`bucket_subjects`), so a count reaching only one half is not a startup failure like the
  # replica count above — it is silent: runs are accepted with a 202, land in buckets nobody
  # polls, and expire at `run_queue_max_age_s` with nothing to say why.
  URL4_CLOUD_RUN_QUEUE_BUCKET_COUNT: {{ .Values.config.runQueueBucketCount | quote }}
  # The shared events stream's own limits (uniform executor, PRD 01 §4).
  #
  # INVARIANT: rendered here AND in the runner pool's env from the SAME values (`values.events.*`)
  # — both halves apply their OWN configured limits at startup (`ensure_events_stream(...,
  # update=True)`). Every one of these four fields is MUTABLE, so a divergence is not a startup
  # failure like `URL4_CLOUD_RUN_QUEUE_REPLICAS` above: whichever half declares second silently
  # APPLIES its own values to the live stream, flipping the shared stream's limits on every
  # rollout. Only an IMMUTABLE field (storage, retention — neither configurable here) failing to
  # match fails startup. Both halves must render from the same `events.*` values for that reason.
  # `int64`, not a bare `quote`: Helm decodes values through JSON, which has no integer type,
  # so a large whole number like the 1 GiB default arrives as a float64 — and Go's default
  # float formatting renders it in SCIENTIFIC NOTATION (`1.073741824e+09`), which no Settings
  # int/byte-size field can parse (see `deployment-runner.yaml`'s identical fix for its own copy
  # of this same value).
  URL4_CLOUD_EVENTS_MAX_BYTES: {{ .Values.events.maxBytes | int64 | quote }}
  URL4_CLOUD_EVENTS_MAX_MSGS_PER_SUBJECT: {{ .Values.events.maxMsgsPerSubject | quote }}
  URL4_CLOUD_EVENTS_MAX_AGE_S: {{ .Values.events.maxAgeS | quote }}
  URL4_CLOUD_EVENTS_REPLICAS: {{ .Values.events.replicas | quote }}
  {{- with .Values.config.aigatewayBaseUrl }}
  # Enables the App's own `GET /v1/models` catalog endpoint (OME-625), which reads aigateway
  # using the CALLER's forwarded credential — it needs no credential of its own. Unset =>
  # `/v1/models` answers 503.
  # NOT sufficient on its own: the endpoint returns aigateway's catalog INTERSECTED with the
  # models declared in this image's `url4.toml` (/etc/url4/url4.toml), so the App reads that file
  # at boot too. An unusable declared world disables both catalog routes (503) and logs an ERROR;
  # it does NOT stop the App — runs, streaming and health are unaffected.
  URL4_CLOUD_AIGATEWAY_BASE_URL: {{ . | quote }}
  {{- end }}
  # The READ side of the artifact hand-off (OME-929) — the same store the worker's children write to.
  #
  # INVARIANT: rendered from the SAME `artifactStorage` values stanza as the Runner's copy in
  # `configmap-runner-env.yaml`. That shared origin is the fix: the two halves used to read one
  # variable nothing set, so each silently resolved its own pod-local directory.
  URL4_CLOUD_ARTIFACT_STORE: {{ .Values.artifactStorage.backend | quote }}
  {{- if and (eq .Values.artifactStorage.backend "filesystem") .Values.artifactStorage.filesystemDir }}
  # Only meaningful in filesystem mode, which is single-process only. Rendered under the same
  # condition it is read, so it is Helm-owned exactly when it is the operative setting — rather
  # than declared Helm-owned and set by nobody, which is how OME-929 happened.
  #
  # WHY also gated on a non-empty value: rendering "" would OVERRIDE the code's default with an
  # empty path, and `Path("")` is the working directory — a silently wrong location rather than
  # an absent setting. Omitting the key lets the documented default apply.
  URL4_CLOUD_ARTIFACTS_DIR: {{ .Values.artifactStorage.filesystemDir | quote }}
  {{- end }}
  {{- if eq .Values.artifactStorage.backend "s3" }}
  URL4_CLOUD_ARTIFACT_S3_ENDPOINT_URL: {{ include "screamingface-engine.artifactEndpointUrl" . | quote }}
  URL4_CLOUD_ARTIFACT_S3_BUCKET: {{ .Values.artifactStorage.s3.bucket | quote }}
  URL4_CLOUD_ARTIFACT_S3_REGION: {{ .Values.artifactStorage.s3.region | quote }}
  # NOTE: the ACCESS KEY is not here either. It is auto-generated when unset, so it must be
  # stable across upgrades — which means living in the Secret the chart can `lookup`. Both
  # halves of the pair therefore arrive by `envFrom.secretRef`, from one source.
  {{- end }}
  # OTLP span export for the control-plane `url4.accept` span (OME-1218). The SAME keys the pool
  # gets, from one helper — see `screamingface-engine.tracingEnv` for why they must match. These
  # are OpenTelemetry's own variable names, read by `tracing.loader` / the OTel SDK, not by
  # `Settings` (which only reads the URL4_CLOUD_* prefix, so they cannot collide with it).
  {{- include "screamingface-engine.tracingEnv" . }}
