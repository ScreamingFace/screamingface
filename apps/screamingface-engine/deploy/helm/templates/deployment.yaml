apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "screamingface-engine.fullname" . }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "screamingface-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "screamingface-engine.selectorLabels" . | nindent 8 }}
        {{/* FX-93: OMIT the chart-owned keys before merging in `podLabels`. Rendering them
        AFTER `podLabels` stops an override from winning, but the operator's own copy is still
        written first — a duplicate mapping key that a strict parser refuses and a lenient one
        resolves either way. `name`/`instance` come from `selectorLabels` above; `component` is
        rendered below. */}}
        {{- with (omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # FEATURE (unit 3, AC5): this component label is the one thing that distinguishes the
        # App from the runner pool (both share name+instance so aigateway admits their calls),
        # so a NetworkPolicy peer can name exactly the App.
        #
        # INVARIANT: CHART-OWNED. The `omit` above removes an operator's copy from `podLabels`,
        # so there is no duplicate key, and this line renders after it, so it cannot be
        # overridden. The aigateway chart lost an outage to exactly this:
        # a platform's `podLabels` rendered later, changed `component`, and emptied a Service
        # selector. Here the consequence would be a policy peer that no longer matches the App —
        # lockout rather than a zero-endpoint Service. Adding a POD label is safe: `spec.selector`
        # stays name+instance.
        app.kubernetes.io/component: control-plane
      annotations:
        # INVARIANT: a ConfigMap/Secret value change alone does NOT roll the pod — see the
        # aigateway chart's identical annotation for the live failure this prevents (config
        # updated, running pod kept the OLD env, silently wrong behavior).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if include "screamingface-engine.artifactSigningConfigured" . }}
        # FX-81: the App SIGNS a mount result's 303 and VERIFIES it with this same key (OQ-3.2),
        # so a rotated signing Secret must roll the App — without this annotation the App keeps
        # the OLD key until its next unrelated restart.
        # The checksum hashes the key's SOURCE — see the `artifactSigningChecksum` helper.
        checksum/artifact-signing: {{ include "screamingface-engine.artifactSigningChecksum" . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # INVARIANT: kubelet's legacy Docker-link env injection MUST stay off. It exports one
      # `{SERVICE_NAME}_PORT=tcp://<ip>:<port>` per Service in the namespace — and this Service is
      # `screamingface-engine`, so it would set `URL4_CLOUD_PORT`, colliding head-on with the app's own
      # `URL4_CLOUD_` settings prefix (config.Settings) and crashing startup on
      # `int("tcp://10.96.x.x:9108")`. Nothing here consumes those vars; the App is configured
      # solely by the ConfigMap + Secret below.
      enableServiceLinks: false
      # The ServiceAccount exists for pod identity only (OME-1092): the Job-scheduling Role and
      # RoleBinding are gone, so the control plane can no longer create Pods. The stateless App
      # is configured solely by the ConfigMap + Secret below.
      serviceAccountName: {{ include "screamingface-engine.serviceAccountName" . }}
      # WHY: a pod marked Terminating is removed from endpoints and sent SIGTERM at the SAME
      # moment, and endpoint removal takes seconds to reach the ingress. This App holds
      # long-lived WebSockets and REST calls that legitimately block for `syncMaxWaitS`, so an
      # immediate exit drops live streams and in-flight sync holds on every rollout. preStop
      # keeps it serving while endpoints propagate; the grace period must exceed preStop plus
      # the worst-case sync hold or the kubelet SIGKILLs mid-request.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: screamingface-engine
          image: {{ include "screamingface-engine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - screamingface-engine
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # INVARIANT: 9108 is not configurable, because the App's listen port is not either —
            # the chart's `command: [screamingface-engine]` runs `cli.main`, which serves uvicorn on a
            # hardcoded 0.0.0.0:9108 and reads no port from the environment. A `config.port` value
            # used to render here, so setting it produced a chart that lint/render/install all
            # accepted while the probes and the Service's `targetPort` pointed at a port nothing
            # listened on. Changing the port a container listens on has no operational value under
            # a Service anyway — `service.port` is the knob that does; keep this pinned to cli.py.
            - name: http
              containerPort: 9108
          envFrom:
            - configMapRef:
                name: {{ include "screamingface-engine.fullname" . }}
            {{- if eq .Values.artifactStorage.backend "s3" }}
            # The object-storage secret access key (OME-929). The App needs it to READ spilled
            # results back — it is the serve side of `GET /artifacts/{id}`, so unlike the Tavily
            # credential it is not merely forwarded to Jobs.
            - secretRef:
                name: {{ include "screamingface-engine.artifactSecretName" . }}
            {{- end }}
            {{- if include "screamingface-engine.artifactSigningConfigured" . }}
            # FEATURE (OQ-3.2; uniform executor PRD 05 DC-D3): the HMAC key the App SIGNS a
            # mount's 303 artifact URL with and VERIFIES it against. Present only when a key is
            # configured; without one a mount result over 1 MiB is streamed inline (MC-D9).
            - secretRef:
                name: {{ include "screamingface-engine.artifactSigningSecretName" . }}
            {{- end }}
            {{- if include "screamingface-engine.tracingHasSecret" . }}
            # The OTLP collector credential (OME-1131) for the App's `url4.accept` span (OME-1218),
            # under the SAME condition as the pool. Referenced only when one EXISTS — naming a
            # Secret that is never created would stop the App from starting on an unresolvable
            # envFrom.
            - secretRef:
                name: {{ include "screamingface-engine.tracingSecretName" . }}
            {{- end }}
          env:
            # HS256 topic-capability signing secret (spec §4). Never logged.
            - name: URL4_CLOUD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "screamingface-engine.authSecretName" . }}
                  key: {{ .Values.auth.jwtSecretKey }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # INVARIANT: pairs with `securityContext.readOnlyRootFilesystem`. Without one writable
          # path, any transitive dependency that writes a temp file or cache crashes the App at
          # an arbitrary later moment — a failure no local run reliably reproduces.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
