{{- /* The runner pool's own ServiceAccount (OME-1931, spec D6/D7). Rendered only when the worker
writes its pod-deletion-cost (`runnerPool.deletionCost.enabled`) AND the chart owns the account
(`runnerPool.serviceAccount.create`). The platform binds the pod-patch Role to THIS account, so
the App pod gains no right. */ -}}
{{- if and .Values.runnerPool.deletionCost.enabled .Values.runnerPool.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "screamingface-engine.runnerServiceAccountName" . }}
  labels:
    {{- include "screamingface-engine.labelsBase" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.runnerPool.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# WHY false on the object: only the runner pod opts in (`automountServiceAccountToken: true` in
# its pod spec). Another pod that names this account by mistake gets no token.
automountServiceAccountToken: false
{{- end }}
