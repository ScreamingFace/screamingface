{{/*
The shared artifact-signing key (OQ-3.2, contracts.md C6). Rendered ONLY when the chart owns the
Secret AND the node tier is enabled — `artifactSigning.existingSecret` means an operator (or an
External Secrets / Sealed Secrets flow) supplies it out-of-band, which is the recommended prod
shape.

WHY gated on `node.enabled`: the node is the only signer. With the tier off there is no 303 to
sign, so the App must NOT accept signatures either — attaching a key would widen the fetch
credential surface for nothing.

WHY `lookup` reuse, like `secret-artifact-storage.yaml`: the key authorizes short-lived URLs, so
a values-less `helm upgrade` that minted a NEW key would invalidate every URL already handed to
a caller mid-flight. Re-reading the cluster copy keeps them valid.

INVARIANT: the key MUST be `URL4_CLOUD_ARTIFACT_SIGNING_KEY`. Both tiers attach this with
`envFrom.secretRef`, which injects each key under its OWN name and cannot rename — the same
constraint `secret-tavily.yaml` learned by breaking.

WHY `screamingface-engine.labels` here and NOT `nodeLabels` (review round #3): this Secret is
SHARED — the node signs with it, the App verifies with it — so it belongs to neither tier alone.
Tagging it `component: node` would be a lie by the same logic that keeps `component: control-plane`
off it too; the standard labels (release `instance`, no node-only component) are the honest set.
*/}}
{{- if and .Values.node.enabled (not .Values.artifactSigning.existingSecret) }}
{{- $secretName := include "screamingface-engine.artifactSigningSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $signingKey := .Values.artifactSigning.signingKey -}}
{{- if not $signingKey -}}
{{- if and $existing $existing.data (index $existing.data "URL4_CLOUD_ARTIFACT_SIGNING_KEY") -}}
{{- $signingKey = (index $existing.data "URL4_CLOUD_ARTIFACT_SIGNING_KEY" | b64dec) -}}
{{- else -}}
{{/* 64 hex chars, matching the shape the artifact-storage secret generates. */}}
{{- $signingKey = randAlphaNum 64 | sha256sum -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  URL4_CLOUD_ARTIFACT_SIGNING_KEY: {{ $signingKey | quote }}
{{- end }}
