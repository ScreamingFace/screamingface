{{/*
The artifact-signing key (OQ-3.2, contracts.md C6), rendered when the chart owns it: a
`signingKey` is set and no `existingSecret` supplies it out-of-band (the recommended prod shape).

WHY no longer gated on the (now-removed) node tier's own switch (uniform executor PRD 05,
DC-D3): the App is the signer now — a mount result over 1 MiB answers 303 to a URL the App
signs and verifies. With no key configured there is nothing to render and the App streams such
a result inline (MC-D9), so the chart no longer mints a random key (whose offline re-renders
broke signed URLs, FX-91).

INVARIANT: the key MUST be `URL4_CLOUD_ARTIFACT_SIGNING_KEY`: the App attaches this with
`envFrom.secretRef`, which injects each key under its OWN name and cannot rename.
*/}}
{{- if and .Values.artifactSigning.signingKey (not .Values.artifactSigning.existingSecret) }}
{{- $secretName := include "screamingface-engine.artifactSigningSecretName" . -}}
{{- $signingKey := .Values.artifactSigning.signingKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  URL4_CLOUD_ARTIFACT_SIGNING_KEY: {{ $signingKey | quote }}
{{- end }}
