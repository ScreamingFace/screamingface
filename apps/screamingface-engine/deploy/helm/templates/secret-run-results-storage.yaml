{{/*
The run-results store's credentials (OME-1837, E5 P2 spec D9a, §8): the twin of
`secret-blob-storage.yaml`, for the third store. Holds BOTH halves of the App's S3 key pair.

`runResults.storage.s3.existingSecret` wins when set; otherwise the chart owns this Secret and,
with no values supplied, GENERATES the pair, which the bundled run-results Garage adopts on first
boot. Its consumers: the App (contexts, result reads, retention deletes), the runner pool unless
`runResults.storage.s3.poolExistingSecret` gives it a write-only key of its own, and the bundled
Garage itself (`GARAGE_DEFAULT_*`).

WHY its own pair: separate stores with separate credentials, so a key that leaks from one store
opens nothing in another.
*/}}
{{- if and (eq (include "screamingface-engine.runResultsBackend" .) "s3") (not .Values.runResults.storage.s3.existingSecret) }}
{{/*
INVARIANT (#1603 review round 2, owner decision 2026-11-04): an operator's OWN endpoint gets the
operator's credentials — values or `existingSecret` — or the render fails. A generated pair is
adopted only by the bundled run-results Garage; an external store would answer every request 403.
*/}}
{{/*
WHY `trim` (#1603 review round 3): a whitespace-only inline key is a missing key, not a
credential — truthy to the template, it would pass this guard and 403 at runtime. The same
trimmed values feed the Secret below, so a blank key is treated as unset everywhere.
*/}}
{{- $inlineAccessKey := .Values.runResults.storage.s3.accessKey | default "" | toString | trim -}}
{{- $inlineSecretKey := .Values.runResults.storage.s3.secretKey | default "" | toString | trim -}}
{{- if and .Values.runResults.storage.s3.endpointUrl (not (and $inlineAccessKey $inlineSecretKey)) -}}
{{- fail "runResults.storage.s3.endpointUrl names an external S3 store, so its credentials must be supplied: set runResults.storage.s3.existingSecret (recommended) or both runResults.storage.s3.accessKey and runResults.storage.s3.secretKey. A generated key pair is only adopted by the bundled run-results Garage." -}}
{{- end -}}
{{- $secretName := printf "%s-run-results-storage" (include "screamingface-engine.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := $inlineAccessKey -}}
{{- $secretKey := $inlineSecretKey -}}
{{/*
WHY reuse before generate: Garage adopts the default key only on first boot, so a values-less
`helm upgrade` that minted a new pair would leave every run-results request 403ing.
*/}}
{{- if and $existing $existing.data -}}
{{- if and (not $accessKey) (index $existing.data "URL4_CLOUD_RUN_RESULTS_S3_ACCESS_KEY") -}}
{{- $accessKey = (index $existing.data "URL4_CLOUD_RUN_RESULTS_S3_ACCESS_KEY" | b64dec) -}}
{{- end -}}
{{- if and (not $secretKey) (index $existing.data "URL4_CLOUD_RUN_RESULTS_S3_SECRET_KEY") -}}
{{- $secretKey = (index $existing.data "URL4_CLOUD_RUN_RESULTS_S3_SECRET_KEY" | b64dec) -}}
{{- end -}}
{{- end -}}
{{- if not $accessKey -}}
{{- $accessKey = printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24) -}}
{{- end -}}
{{- if not $secretKey -}}
{{- $secretKey = randAlphaNum 64 | sha256sum -}}
{{- end -}}
{{/*
The run-results Garage's cluster RPC secret (#1603 security review): random, 32 bytes as 64 hex — the
shape Garage requires — and reused across upgrades by the same `lookup` as the key pair.
WHY not `derivePassword` from the release name (what garage.yaml does for the results Garage):
a value derived from public inputs and a constant master is predictable by anyone who knows the
release name. AIDEV-NOTE: only the chart-owned Secret carries it; with `existingSecret`, that
Secret must carry `GARAGE_RPC_SECRET` too whenever the bundled run-results Garage is rendered.
*/}}
{{- $rpcSecret := "" -}}
{{- if and $existing $existing.data (index $existing.data "GARAGE_RPC_SECRET") -}}
{{- $rpcSecret = (index $existing.data "GARAGE_RPC_SECRET" | b64dec) -}}
{{- end -}}
{{- if not $rpcSecret -}}
{{- $rpcSecret = randAlphaNum 64 | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  URL4_CLOUD_RUN_RESULTS_S3_ACCESS_KEY: {{ $accessKey | quote }}
  URL4_CLOUD_RUN_RESULTS_S3_SECRET_KEY: {{ $secretKey | quote }}
  GARAGE_RPC_SECRET: {{ $rpcSecret | quote }}
{{- end }}
