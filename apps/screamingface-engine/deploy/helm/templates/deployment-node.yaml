{{- if .Values.node.enabled }}
{{/*
The node tier (unit 3, prd/03 §2.1, contracts.md C2/C3). `screamingface-engine node` builds the
declared world ONCE and serves url4's ASGI surface behind url4's own admission and timeout
guards. It is stateless: one world, one aigateway client, and per-request caller state only in a
ContextVar bound for the request's duration.

# INVARIANT: reachable ONLY from the App (the NetworkPolicy this chart renders). The tier trusts
# the `X-User-Email` the App injects; with no policy, any pod in the cluster could set it freely
# and impersonate any caller (contracts.md §10, AC5) — a correctness requirement, not hardening.

# INVARIANT: readiness reflects a BUILT world and a passed collision guard, and liveness does
# NOT probe a downstream. A tier that cannot start without aigateway, or that restarts when
# aigateway blinks, turns one outage into two (AC18/AC19).
*/}}
{{- if ne .Values.artifactStorage.backend "s3" -}}
{{- fail (printf "node.enabled requires artifactStorage.backend: s3 (OME-929) — the node's spill path writes an over-cap sync result to the SAME store the App must read it back from across pods; any other backend leaves a spilled result unservable" ) -}}
{{- end -}}
{{- if ge (float64 .Values.node.aigatewayTimeoutS) (float64 .Values.node.requestTimeoutS) -}}
{{- fail (printf "node.aigatewayTimeoutS (%v) must stay BELOW node.requestTimeoutS (%v): otherwise the request wrapper times out first and the caller gets a bare 504 instead of a 502 naming aigateway as the cause" .Values.node.aigatewayTimeoutS .Values.node.requestTimeoutS) -}}
{{- end -}}
{{- if eq (int64 .Values.node.metrics.port) (int64 .Values.node.port) -}}
{{- fail (printf "node.metrics.port (%v) must differ from node.port (%v): FX-82 moved /metrics off the request port precisely so a scrape cannot compete with a sync call for the same listener, and so the NetworkPolicy's second ingress rule can admit a scraper to metrics alone" .Values.node.metrics.port .Values.node.port) -}}
{{- end -}}
{{/* review round #8: the node itself refuses a body over this at STARTUP (world/node_tier's own
hard cap validation) — failing here too means a misconfigured value never reaches a running pod
at all. 524288 = 512 KiB, the inline cap (D9): a hard cap below it could never admit even the
smallest spilled result. */ -}}
{{- if lt (int64 .Values.node.resultHardCapBytes) 524288 -}}
{{- fail (printf "node.resultHardCapBytes (%v) must be at least 524288 (512 KiB, the inline cap, D9): a smaller hard cap would 413 a result that never even reached the spill threshold" .Values.node.resultHardCapBytes) -}}
{{- end -}}
{{/* WHY `le`, not `lt`: the grace period must be STRICTLY GREATER than preStop + the request
budget + the spill budget, or the kubelet's SIGKILL lands at the exact instant a maximally slow
request-then-spill would still be running. */ -}}
{{- $nodeMinGrace := ceil (addf (float64 .Values.node.preStopSleepSeconds) (float64 .Values.node.requestTimeoutS) (float64 .Values.node.spillTimeoutS)) -}}
{{- if le (float64 .Values.node.terminationGracePeriodSeconds) $nodeMinGrace -}}
{{- fail (printf "node.terminationGracePeriodSeconds (%v) must exceed node.preStopSleepSeconds (%v) + node.requestTimeoutS (%v) + node.spillTimeoutS (%v) = %v: the kubelet SIGKILLs the pod at the termination deadline, and a drain cut short interrupts an in-flight sync request or its spill write" (float64 .Values.node.terminationGracePeriodSeconds) (float64 .Values.node.preStopSleepSeconds) (float64 .Values.node.requestTimeoutS) (float64 .Values.node.spillTimeoutS) $nodeMinGrace) -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "screamingface-engine.nodeName" . }}
  labels:
    {{- include "screamingface-engine.nodeLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.node.replicas }}
  selector:
    matchLabels:
      # The node's OWN component label (now part of `nodeSelectorLabels` itself). It shares
      # `app.kubernetes.io/name` with the App so aigateway's NetworkPolicy admits its outbound
      # calls by that name, but without the component the node Service would also front the
      # App's pods — and the NodePolicy would select them too.
      {{- include "screamingface-engine.nodeSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "screamingface-engine.nodeSelectorLabels" . | nindent 8 }}
        {{/* review round #5: OMIT the chart-owned keys from `podLabels` rather than merely
        rendering them last. Rendering order alone stops an override from WINNING (the chart's
        value still applies), but the operator's OWN copy of the key is still written to the
        YAML first — a genuine duplicate mapping key (the exact class FX-87 fixed), and one a
        strict parser rejects regardless of which value wins. Omitting means there is nothing
        left to duplicate: `name`/`instance`/`component` arrive above from `nodeSelectorLabels`
        itself, and `part-of` is omitted too since it is re-declared below. */}}
        {{- with (omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" "app.kubernetes.io/part-of") }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # INVARIANT (FX-84): CHART-OWNED and rendered AFTER `podLabels`, mirroring the App
        # Deployment's own rule (see its identical comment) — an operator's `podLabels` override
        # must not be able to change which selector this pod matches. `component` is chart-owned
        # via `nodeSelectorLabels` itself above (guarded by the `omit` above, not by ordering);
        # only `part-of` still needs its own copy here.
        app.kubernetes.io/part-of: screamingface
      annotations:
        # INVARIANT: a ConfigMap/Secret value change alone rolls the pod — the same rule the App
        # and runner pool carry. The node's aigateway address, artifact-store settings and both
        # secrets arrive by reference; a stale env is silently wrong behavior.
        checksum/runner-env: {{ include (print $.Template.BasePath "/configmap-runner-env.yaml") . | sha256sum }}
        checksum/artifact-storage: {{ include (print $.Template.BasePath "/secret-artifact-storage.yaml") . | sha256sum }}
        # WHY the key's SOURCE and not the rendered Secret (review round #2): with no
        # `existingSecret`/`signingKey` its `lookup` is EMPTY under `helm template` (no live
        # cluster to query), so it falls back to `randAlphaNum` — a NEW value on every offline
        # render, which would roll this stateless-but-in-flight-holding tier on every GitOps sync.
        # The cost of NOT hashing it (FX-91): an offline render does write a new key that no pod
        # restarts for, so GitOps must pin one — see the NOTES.txt warning.
        checksum/artifact-signing: {{ include "screamingface-engine.artifactSigningChecksum" . }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # INVARIANT: kubelet's legacy Docker-link env injection MUST stay off, the same rule as
      # the App and the runner pool. It would inject a `{SERVICE_NAME}_PORT` variable per
      # Service — and this release's Services include `screamingface-engine`, whose value
      # collides with the app's own `URL4_CLOUD_` settings prefix.
      enableServiceLinks: false
      # The node talks to aigateway and object storage, never the Kubernetes API. No token.
      automountServiceAccountToken: false
      serviceAccountName: {{ include "screamingface-engine.serviceAccountName" . }}
      # SIGTERM removes the pod from endpoints while in-flight sync calls (max 30 s) finish.
      terminationGracePeriodSeconds: {{ .Values.node.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node
          # The control-plane image, NOT the benchmark image: the node serves the world and runs
          # no benchmark assets. The `node` subcommand is the mode switch, pinned beside the
          # Deployment that uses it.
          image: {{ include "screamingface-engine.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - screamingface-engine
            - node
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            # FX-82/RD2: `/metrics` moved off the request port so a scrape can never compete with
            # a sync call for the listener, and so the NetworkPolicy can admit a scraper to ONLY
            # this port. Two DISTINCT containerPorts now; the Service still targets only `http`.
            - name: http
              containerPort: {{ .Values.node.port }}
            - name: metrics
              containerPort: {{ .Values.node.metrics.port }}
          env:
            # The tier's OWN ladder, rendered from `node` — the same values the probes and the
            # resource arithmetic already consume. Without these the tier reads the code
            # defaults, which happen to coincide today, so a drift would be invisible.
            - name: URL4_CLOUD_NODE_REQUEST_TIMEOUT_S
              value: {{ .Values.node.requestTimeoutS | quote }}
            - name: URL4_CLOUD_NODE_AIGATEWAY_TIMEOUT_S
              value: {{ .Values.node.aigatewayTimeoutS | quote }}
            - name: URL4_CLOUD_NODE_SPILL_TIMEOUT_S
              value: {{ .Values.node.spillTimeoutS | quote }}
            - name: URL4_CLOUD_NODE_MAX_INFLIGHT_PER_WORKER
              value: {{ .Values.node.maxInflightPerWorker | quote }}
            - name: URL4_CLOUD_NODE_WORKERS
              value: {{ .Values.node.workers | quote }}
            - name: URL4_CLOUD_NODE_RETRY_AFTER_S
              value: {{ .Values.node.retryAfterS | quote }}
            - name: URL4_CLOUD_NODE_ARTIFACT_URL_TTL_S
              value: {{ .Values.node.artifactUrlTtlS | quote }}
            - name: URL4_CLOUD_NODE_PORT
              value: {{ .Values.node.port | quote }}
            - name: URL4_CLOUD_NODE_METRICS_PORT
              value: {{ .Values.node.metrics.port | quote }}
            # `int64`, not a bare `quote`: Helm decodes values through JSON, which has no
            # integer type, so a large whole number like the 64 MiB default arrives as a
            # float64 — and Go's default float formatting renders it in SCIENTIFIC NOTATION
            # (`6.7108864e+07`), which no Settings int/byte-size field can parse.
            - name: URL4_CLOUD_RESULT_HARD_CAP_BYTES
              value: {{ .Values.node.resultHardCapBytes | int64 | quote }}
          envFrom:
            # The SAME deploy-time env the worker pool reads: AIGATEWAY_BASE_URL and the
            # artifact-store settings are rendered once, into this ConfigMap, so the sync tier
            # and the run tier cannot be pointed at different aigateway or store by a one-sided
            # edit. Keys the node does not read are ignored.
            - configMapRef:
                name: {{ include "screamingface-engine.fullname" . }}-runner-env
            {{- if eq .Values.artifactStorage.backend "s3" }}
            # The credential pair the spill path signs its PUTs with (contracts.md C5). The
            # node writes spilled sync responses to the SAME store the App reads them from.
            - secretRef:
                name: {{ include "screamingface-engine.artifactSecretName" . }}
            {{- end }}
            # The shared HMAC key OQ-3.2: the node signs the 303's short-lived Location.
            - secretRef:
                name: {{ include "screamingface-engine.artifactSigningSecretName" . }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.node.preStopSleepSeconds }}"]
          livenessProbe:
            {{- toYaml .Values.node.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.node.readinessProbe | nindent 12 }}
          # FX-88: covers the world build. A large declared world can take longer to build than
          # liveness's own restart window tolerates; the startup probe gives it room BEFORE
          # liveness/readiness start counting failures at all, without weakening either probe's
          # own steady-state cadence.
          startupProbe:
            {{- toYaml .Values.node.startupProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          # INVARIANT: pairs with `securityContext.readOnlyRootFilesystem`. Without one writable
          # path, any transitive dependency that writes a temp file crashes the pod at an
          # arbitrary later moment.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
