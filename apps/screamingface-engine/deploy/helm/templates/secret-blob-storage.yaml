{{/*
The blob store's credentials (OME-1540; #1603 review, owner decision 2026-11-03) — the twin of
`secret-artifact-storage.yaml`, for the second store. Holds BOTH halves of its S3 key pair.

`blobs.storage.s3.existingSecret` wins when set; otherwise the chart owns this Secret and, with
no values supplied, GENERATES the pair, which the bundled blob Garage adopts on first boot. Three
consumers, one source: the App (uploads and fetches), the runner pool (model-call reads), and
the blob Garage itself (`GARAGE_DEFAULT_*`).

WHY its own pair rather than the artifact one: separate stores with separate credentials — a
key that leaks from one store opens nothing in the other.
*/}}
{{- if and (eq (include "screamingface-engine.blobBackend" .) "s3") (not .Values.blobs.storage.s3.existingSecret) }}
{{- $secretName := printf "%s-blob-storage" (include "screamingface-engine.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := .Values.blobs.storage.s3.accessKey -}}
{{- $secretKey := .Values.blobs.storage.s3.secretKey -}}
{{/*
WHY reuse before generate: Garage adopts the default key only on first boot, so a values-less
`helm upgrade` that minted a new pair would leave every blob request 403ing.
*/}}
{{- if and $existing $existing.data -}}
{{- if and (not $accessKey) (index $existing.data "URL4_CLOUD_BLOB_S3_ACCESS_KEY") -}}
{{- $accessKey = (index $existing.data "URL4_CLOUD_BLOB_S3_ACCESS_KEY" | b64dec) -}}
{{- end -}}
{{- if and (not $secretKey) (index $existing.data "URL4_CLOUD_BLOB_S3_SECRET_KEY") -}}
{{- $secretKey = (index $existing.data "URL4_CLOUD_BLOB_S3_SECRET_KEY" | b64dec) -}}
{{- end -}}
{{- end -}}
{{- if not $accessKey -}}
{{- $accessKey = printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24) -}}
{{- end -}}
{{- if not $secretKey -}}
{{- $secretKey = randAlphaNum 64 | sha256sum -}}
{{- end -}}
{{/*
The blob Garage's cluster RPC secret (#1603 security review): random, 32 bytes as 64 hex — the
shape Garage requires — and reused across upgrades by the same `lookup` as the key pair.
WHY not `derivePassword` from the release name (what garage.yaml does for the results Garage):
a value derived from public inputs and a constant master is predictable by anyone who knows the
release name. AIDEV-NOTE: only the chart-owned Secret carries it; with `existingSecret`, that
Secret must carry `GARAGE_RPC_SECRET` too whenever the bundled blob Garage is rendered.
*/}}
{{- $rpcSecret := "" -}}
{{- if and $existing $existing.data (index $existing.data "GARAGE_RPC_SECRET") -}}
{{- $rpcSecret = (index $existing.data "GARAGE_RPC_SECRET" | b64dec) -}}
{{- end -}}
{{- if not $rpcSecret -}}
{{- $rpcSecret = randAlphaNum 64 | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "screamingface-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  URL4_CLOUD_BLOB_S3_ACCESS_KEY: {{ $accessKey | quote }}
  URL4_CLOUD_BLOB_S3_SECRET_KEY: {{ $secretKey | quote }}
  GARAGE_RPC_SECRET: {{ $rpcSecret | quote }}
{{- end }}
