# Plain (helm-free) manifest for the aigateway stub, applied by up.sh before the engine chart.
# Service name `aigw-stub` on port 8080 matches `values-kind.yaml`'s
# `config.aigatewayBaseUrl: http://aigw-stub:8080`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aigw-stub
  labels:
    app: aigw-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aigw-stub
  template:
    metadata:
      labels:
        app: aigw-stub
    spec:
      containers:
        - name: aigw-stub
          image: aigw-stub:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STUB_LATENCY_MS
              value: "200"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aigw-stub
  labels:
    app: aigw-stub
spec:
  selector:
    app: aigw-stub
  ports:
    - name: http
      port: 8080
      targetPort: http
