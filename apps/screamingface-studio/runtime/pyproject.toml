[project]
name = "screamingface-runtime"
version = "0.1.0"
description = "Standalone local runtime for ScreamingFace Studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "screamingface[runtime]",
]

[project.scripts]
screamingface-runtime = "screamingface_runtime.cli:main"
screamingface-runtime-smoke = "screamingface_runtime.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingface_runtime"]

[tool.uv.sources]
aigateway = { path = "../../aigateway", editable = true }
url4 = { path = "../../../packages/url4", editable = true }
screamingface = { path = "../../../packages/screamingface", editable = true }
scoreboard = { path = "../../scoreboard", editable = true }

[tool.uv]
environments = ["sys_platform == 'darwin'"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyinstaller>=6.16,<7",
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
