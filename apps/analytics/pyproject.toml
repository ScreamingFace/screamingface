[project]
name = "sf-analytics-service"
version = "0.1.0"
description = "Opt-in ScreamingFace event ingestion and PostHog delivery"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141.1", "httpx>=0.28.1", "pydantic>=2.13.4", "pydantic-settings>=2.14.2", "uvicorn>=0.52.1"]
[project.scripts]
sf-analytics = "analytics_service.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/analytics_service"]
[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "pytest-asyncio>=1.4.0,<2", "pytest-cov>=5", "ruff>=0.16.1"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901"]
[tool.ruff.lint.mccabe]
max-complexity = 8
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
