{{/*
The object-storage credentials for the cache snapshot (OME-1021). Mirrors the Engine's
artifact-storage Secret (OME-929): holds BOTH halves of the S3 key pair, is stable across
`helm upgrade` via `lookup`, and generates the pair in Garage's own shapes when no values
are supplied — so `snapshot.garage.enabled: true` needs no operator input at all.

INVARIANT: one Secret, two consumers — the gateway Deployment (envFrom) signs the PUTs, and
Garage itself (env, mapped to GARAGE_DEFAULT_*) adopts this very key on first boot. The
data flows one way, which is what keeps the deployment declarative. The key names are
exactly the env vars the app reads.
*/}}
{{- if and .Values.snapshot.enabled (not .Values.snapshot.storage.existingSecret) }}
{{- $secretName := include "aigateway.snapshotSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $accessKey := .Values.snapshot.storage.accessKey -}}
{{- $secretKey := .Values.snapshot.storage.secretKey -}}
{{- if and $existing $existing.data -}}
{{- if and (not $accessKey) (index $existing.data "AIGW_CACHE_SNAPSHOT_S3_ACCESS_KEY") -}}
{{- $accessKey = (index $existing.data "AIGW_CACHE_SNAPSHOT_S3_ACCESS_KEY" | b64dec) -}}
{{- end -}}
{{- if and (not $secretKey) (index $existing.data "AIGW_CACHE_SNAPSHOT_S3_SECRET_KEY") -}}
{{- $secretKey = (index $existing.data "AIGW_CACHE_SNAPSHOT_S3_SECRET_KEY" | b64dec) -}}
{{- end -}}
{{- end -}}
{{- if not $accessKey -}}
{{- $accessKey = printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24) -}}
{{- end -}}
{{- if not $secretKey -}}
{{- $secretKey = randAlphaNum 64 | sha256sum -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  AIGW_CACHE_SNAPSHOT_S3_ACCESS_KEY: {{ $accessKey | quote }}
  AIGW_CACHE_SNAPSHOT_S3_SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
