{{/*
The E14 receipt signing key and the archive writer key (OME-1307). Rendered ONLY when the chart
owns the Secret: cache versions are enabled, `config.cacheVersions.existingSecret` is empty, and at
least one inline value is set. `existingSecret` means an operator (or an External Secrets / Sealed
Secrets flow) supplies it out of band, which is the recommended prod shape.

WHY `enabled` in the guard: the Deployment mounts the Secret only when `enabled`, so an unmounted
chart Secret is noise.

INVARIANT: the keys MUST be the env var names. The Pod attaches this with `envFrom.secretRef`,
which injects every key under its OWN name and cannot rename.

WHY the chart never mints the receipt key (no `genPrivateKey`, no `randAlphaNum`): the scoreboard
must hold its public half, so a key generated in this chart could never be verified there.

WHY NO `lookup` REUSE: see `secret-tracing.yaml`. A reuse branch would silently revert a rotation
to the stale cluster copy. Inline values are dev-only; `existingSecret` is the durable path.

WHY `toJson` and not `quote`: `quote` does not escape a newline, and YAML folds a raw newline in a
double-quoted scalar into a space. A JSON string is a valid YAML double-quoted scalar.
*/}}
{{- if and .Values.config.cacheVersions.enabled (not .Values.config.cacheVersions.existingSecret) (include "aigateway.cacheVersionsInlineSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aigateway.cacheVersionsSecretName" . }}
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.config.cacheVersions.receiptSigningKey }}
  AIGATEWAY_RECEIPT_SIGNING_KEY: {{ . | toJson }}
  {{- end }}
  {{- with .Values.config.cacheVersions.archiveAccessKey }}
  AIGW_CACHE_VERSION_S3_ACCESS_KEY: {{ . | toJson }}
  {{- end }}
  {{- with .Values.config.cacheVersions.archiveSecretKey }}
  AIGW_CACHE_VERSION_S3_SECRET_KEY: {{ . | toJson }}
  {{- end }}
{{- end }}
