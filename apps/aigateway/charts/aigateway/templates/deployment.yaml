apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aigateway.fullname" . }}
  labels:
    {{- include "aigateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    # INVARIANT: this selector stays name+instance ONLY. `spec.selector` is immutable once the
    # Deployment exists, so adding `component: gateway` here would make `helm upgrade` of any
    # already-installed release fail with `field is immutable` — invisible to fresh installs
    # and to render-only CI. The component label lives on the Pod template below, which is
    # mutable and is what the Service and the NetworkPolicies actually select on.
    matchLabels:
      {{- include "aigateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aigateway.selectorLabels" . | nindent 8 }}
        # Distinct component, same pattern as the migrate Job (`component: migrate`) and the
        # bundled Garage (`component: garage`): selectorLabels alone match EVERY workload this
        # chart renders, so any selector that must name the gateway — the Service, the
        # NetworkPolicy — needs this label to stay scoped now that Garage Pods carry the same
        # name/instance pair. Template labels only: see the selector note above.
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the Pods when the ConfigMap changes. Without this a `helm upgrade` that flips
        # AIGW_OPENROUTER_ENABLED (or any other key) updates the ConfigMap and changes nothing
        # else — envFrom is read once at container start, so every Pod keeps the old value and
        # the upgrade reports success. Same guard aigateway-ui already carries.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aigateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: aigateway
          image: {{ include "aigateway.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
          envFrom:
            - configMapRef:
                name: {{ include "aigateway.fullname" . }}
            {{- if .Values.snapshot.enabled }}
            # The snapshot key pair: either the chart-owned Secret or the operator's
            # existingSecret (the key names are the env vars the app reads).
            - secretRef:
                name: {{ if .Values.snapshot.storage.existingSecret }}{{ .Values.snapshot.storage.existingSecret }}{{ else }}{{ include "aigateway.snapshotSecretName" . }}{{ end }}
            {{- end }}
          env:
            - name: AIGATEWAY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: AIGATEWAY_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.jwtSecretKey }}
            - name: AIGATEWAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.adminPasswordKey }}
            - name: AIGATEWAY_PROVISIONING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.provisioningTokenKey }}
                  optional: true
            {{- if .Values.auth.secretKeyKey }}
            # AIGATEWAY_SECRET_KEY: the AES-256-GCM master key for credential_blobs.
            # WHY hosted deployments MUST set this (README §security): without it
            # get_or_create_master_key persists a generated key into secret_master_keys — the
            # SAME database that holds credential_blobs — so one pg_dump, snapshot, replica or
            # stolen backup captures the key together with the ciphertext it protects. Two
            # tables in one database are one artifact. Supplying the key from a Secret puts it
            # in a different trust domain, which is what makes the separation load-bearing, and
            # is a HARD PRECONDITION AT ANY REPLICA COUNT (see values.yaml auth.secretKeyKey).
            # AIDEV-NOTE: do not re-justify this with replica divergence. Replicas share one
            # Postgres and converge on the one existing key row, so credentials written by one
            # replica ARE readable by another. An operator who tests that false claim, finds it
            # untrue, and dismisses the warning discards the true reason above along with it.
            # AIDEV-NOTE: if this deployment has ALREADY auto-generated a key, the Secret must
            # carry THAT key, read out of secret_master_keys. A fresh value makes every stored
            # provider credential and OAuth refresh token undecryptable.
            # Opt-in: rendered only when secretKeyKey is set.
            - name: AIGATEWAY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aigateway.authSecretName" . }}
                  key: {{ .Values.auth.secretKeyKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
