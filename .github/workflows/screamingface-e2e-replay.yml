# The golden-replay guard (OME-964): replay every fixture-pinned board from the
# committed cache snapshot on a throwaway stack and fail when the published score
# drifts. Its own workflow — not a job in screamingface-tests.yml — because paths:
# is workflow-level and this lane must ALSO fire on engine/gateway changes (the main
# drift sources) without dragging the whole SDK matrix along with them.
#
# Spend is impossible by construction: the gateway boots with no provider keys; a
# cache miss is a loud test failure, never a live call.
name: ScreamingFace E2E Replay

on:
  push:
    paths:
      - "packages/screamingface/**"
      - "packages/url4/**"
      - "apps/screamingface-engine/**"
      - "apps/aigateway/**"
      - ".github/workflows/screamingface-e2e-replay.yml"
  pull_request:
    paths:
      - "packages/screamingface/**"
      - "packages/url4/**"
      - "apps/screamingface-engine/**"
      - "apps/aigateway/**"
      - ".github/workflows/screamingface-e2e-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install SDK dependencies
        run: uv sync

      # The harness syncs the gateway and engine venvs itself (sync_project); only
      # the benchmark asset bundles need preparing up front, via the same
      # `screamingface prepare` a user runs (OME-1001).
      - name: Cache benchmark assets
        uses: actions/cache@v6
        with:
          path: /tmp/screamingface-data/benchmark-assets
          key: benchmark-assets-${{ hashFiles('apps/screamingface-engine/src/screamingface_engine/benchmarks/**', 'apps/screamingface-engine/src/screamingface_engine_inspect/**', 'packages/screamingface/tests/e2e/fixtures/goldens/inspect-gsm8k-vote.reducer-golden.json', 'packages/screamingface/tests/e2e/fixtures/goldens/inspect-gsm8k-fusion.fusion-golden.json') }}

      - name: Prepare benchmark assets
        # --extra runtime: `screamingface prepare` imports the embedded-server module,
        # whose deps (uvicorn et al.) live in the user-facing runtime extra.
        run: uv run --extra runtime screamingface prepare --all --data-dir /tmp/screamingface-data

      # The reducer and fusion lanes (OME-1289 E4a, test_reducer_replay.py and test_fusion_replay.py)
      # replay the IMPORTED board `inspect-gsm8k`, whose bundle is built by the Engine's own
      # preparer and only with its `benchmarks` extra (the SDK step above never builds it). The
      # marker file makes a cache hit skip the download; a miss costs one GSM8K download from
      # Hugging Face (no token needed).
      # The harness re-syncs the engine venv WITHOUT the extra for the other lanes, so this sync
      # only makes the preparer importable. Gated on the lanes' goldens: until the user records
      # the fixtures of one lane that lane skips, so the sync and the download would be spent for
      # nothing. Both goldens are also part of the cache key above, so the first run after a lane's
      # fixtures land misses the cache, prepares the bundle and saves it.
      - name: Prepare the imported GSM8K assets
        if: hashFiles('packages/screamingface/tests/e2e/fixtures/goldens/inspect-gsm8k-vote.reducer-golden.json', 'packages/screamingface/tests/e2e/fixtures/goldens/inspect-gsm8k-fusion.fusion-golden.json') != ''
        working-directory: apps/screamingface-engine
        run: |
          uv sync --extra benchmarks
          if [ ! -f /tmp/screamingface-data/benchmark-assets/inspect-gsm8k/cases.json ]; then
            uv run python -m screamingface_engine.benchmarks.prepare --root /tmp/screamingface-data/benchmark-assets --bundle inspect-gsm8k
          fi

      # A local Task's bundle (OME-1527: gdpval-text, draco and draco-3pass moved from hand-built
      # folders) is not in `screamingface prepare`; the Engine's own preparer writes it, as the
      # image build does.
      # It refuses a non-empty directory, so a bundle restored from the cache is kept as is.
      - name: Prepare the local-Task bundles a golden replays
        working-directory: apps/screamingface-engine
        run: |
          for bundle in gdpval-text draco draco-3pass; do
            if [ ! -f "/tmp/screamingface-data/benchmark-assets/$bundle/cases.json" ]; then
              uv run --extra benchmarks python -m screamingface_engine.benchmarks.prepare \
                --root /tmp/screamingface-data/benchmark-assets --bundle "$bundle"
            fi
          done

      # synthetic.manifest.json is deliberately untracked — it carries the gateway's
      # LIVE revision constants, so a fresh checkout regenerates it with the gateway's
      # own code (single-authority rule) instead of committing a copy that goes stale.
      - name: Generate the synthetic plumbing fixture
        working-directory: apps/aigateway
        run: |
          uv sync
          .venv/bin/python ../../packages/screamingface/tests/e2e/fixtures/generate_synthetic.py

      # -rs so a skipped board prints its loud reason ("no recorded fixtures yet")
      # in the CI log instead of hiding inside a green run.
      - name: Replay the e2e lane against the goldens
        env:
          SCREAMINGFACE_TEST_E2E: "1"
          SCREAMINGFACE_E2E_ASSETS: /tmp/screamingface-data/benchmark-assets
        run: uv run pytest tests/e2e -rs -v
