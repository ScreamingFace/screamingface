name: url4 Tests

on:
  push:
    paths:
      - "packages/url4/**"
      - ".github/workflows/url4-tests.yml"
  pull_request:
    paths:
      - "packages/url4/**"
      - ".github/workflows/url4-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Base install — no optional extras. Proves the library works, and that the
  # core import graph stays framework-free, on the install most consumers get.
  test:
    name: tests (base install)
    runs-on: ubuntu-latest
    # A unit test that binds and serves would otherwise run to GitHub's 6h
    # default. The `_no_real_listen` guard in tests/conftest.py prevents that
    # class; this is the backstop for whatever it does not catch.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/url4

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # WHY before `uv sync`: sync SILENTLY regenerates a stale lock, so a lockfile that no
      # longer matches pyproject.toml is invisible to every later step. Until this guard
      # existed, url4's own drift only ever surfaced in the screamingface-engine lane, which locks the
      # same package — that is how the 1.0.0 and 1.1.0 release bumps each shipped a stale
      # lock (f2b46c06, 9061f40f).
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github

      - name: Lint (ruff format)
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Run unit tests with aggregate coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=url4 \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Suppression ratchet
        run: uv run python scripts/check_suppressions.py

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: url4 Test Results (${{ matrix.python-version }})
          path: packages/url4/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: always() && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        with:
          coverageFile: packages/url4/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.95

  # The serve path is what this package ships as a console script, and the base
  # job never installs uvicorn — so without this job `url4 serve` has no CI
  # coverage at all. Runs the suite WITH the extra (the configuration in which
  # the missing-uvicorn tests used to hang the runner), then drives a real node
  # over HTTP.
  serve:
    name: serve smoke (url4[server])
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/url4

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install with the server extra
        run: uv sync --extra server

      - name: Unit tests with uvicorn present
        # Guards the regression class directly: these tests must assert the
        # missing-extra branch by simulating it, never by depending on the
        # ambient venv. With uvicorn installed the old versions bound port
        # 4404 and served forever.
        run: uv run pytest -q --no-cov

      - name: Import isolation still holds with a server installed
        # The strong form of the guarantee — uvicorn is on the path here, so
        # "url4 did not import it" is a real claim rather than a vacuous one.
        run: uv run pytest -q --no-cov tests/unit/test_import_isolation.py

      - name: Console script smoke
        run: |
          uv run url4 --version
          echo "('a','b')!'merge'" | uv run url4 eval

      - name: Serve over real HTTP
        run: |
          set -euo pipefail
          cat > ci-url4.toml <<'TOML'
          host = "127.0.0.1"
          port = 4404
          # A reduce backend is handed the merged sources as its INTENT with
          # empty stdin, so the reduce route must consume {intent}. A
          # stdin-only command (like /upper) silently returns an empty 200.
          default_route = "/reduce"

          [commands]
          "/upper"  = ["tr", "a-z", "A-Z"]
          "/reduce" = ["python3", "-c", "import sys; sys.stdout.write(sys.argv[1])", "{intent}"]

          [data]
          "/rubrics/42" = "score 1-5 on clarity"

          [holdings]
          default = "DEFAULT-SHELF"
          science = "SCIENCE-SHELF"

          [identities.emily]
          notes = "EMILY-NOTES"
          TOML

          uv run url4 serve --config ci-url4.toml > serve.log 2>&1 &
          echo $! > serve.pid

          # Bounded readiness wait — never an unbounded loop.
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 5 http://127.0.0.1:4404/healthz >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 0.5
          done
          if [ "${ready:-0}" != "1" ]; then
            echo "::error::node never became ready"; cat serve.log; exit 1
          fi

          get() { curl -fsS --max-time 10 --get --data-urlencode "q=$2" "http://127.0.0.1:4404$1"; }
          expect() {
            if ! printf '%s' "$1" | grep -q -- "$2"; then
              echo "::error::expected '$2' in: $1"; exit 1
            fi
          }

          expect "$(get /v1 "(/upper(hello world)!'go')!''")" "HELLO WORLD"
          expect "$(get /v1 "(/rubrics/42)!''")"             clarity
          expect "$(get /v1 "(@)!''")"                       DEFAULT-SHELF
          expect "$(get /v1/science "(@)!''")"               SCIENCE-SHELF
          expect "$(get /v1 "(@emily/notes)!''")"            EMILY-NOTES

          # Fan-out reduce: both per-source results must reach the default
          # route, which receives them merged as its intent.
          reduced="$(get /v1 "(/upper(a)!'go',/upper(b)!'go')!'pick'")"
          expect "$reduced" A
          expect "$reduced" B
          expect "$reduced" pick

          # Error contract: parse error -> 400, unknown route -> 404, POST -> 405.
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$@"; }
          [ "$(code --get --data-urlencode "q=(@/science)!''" http://127.0.0.1:4404/v1)" = 400 ]
          [ "$(code --get --data-urlencode "q=(/nope(x)!'go')!''" http://127.0.0.1:4404/v1)" = 404 ]
          [ "$(code -X POST http://127.0.0.1:4404/v1)" = 405 ]

          echo "serve smoke OK"

      - name: Stop the node
        if: always()
        run: |
          if [ -f serve.pid ]; then kill "$(cat serve.pid)" 2>/dev/null || true; fi
          if [ -f serve.log ]; then echo "--- serve.log ---"; cat serve.log; fi

  build:
    name: Build & validate package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/url4
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist + wheel
        run: uv build --out-dir dist
      - name: Validate metadata (twine check)
        run: uvx twine check --strict dist/*

  cost:
    name: CI cost diff
    if: always()
    needs: [test, build, serve]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: HupBaHa/cost-diff@v0.1.2
        with:
          current-job-id: ${{ job.check_run_id }}
          baseline-event: push
          comment-mode: update
