name: Charts

# The aigateway chart was previously linted ONLY inside release-aigateway.yml, which runs after a
# release tag — so a chart change in a pull request had no gate at all and a broken chart was
# discovered at deploy time. This lane moves that check to the PR.
#
# Its own workflow rather than jobs inside aigateway-tests.yml / aigateway-ui-tests.yml because
# `paths:` filters are workflow-level: putting a chart job in each app's lane would make every
# chart edit run both full application test suites, and the checks here are about the PAIR of
# charts anyway — neither app's lane owns them.
#
# SECURITY: nothing here interpolates `github.event.*`. The only expression is `github.ref` in the
# concurrency group, which is a ref name and never attacker-authored free text.
on:
  push:
    paths:
      - "apps/aigateway/charts/**"
      - "apps/aigateway-ui/charts/**"
      - "apps/aigateway-ui/Dockerfile"
      - "apps/report-intake/charts/**"
      # The verifier asserts the rendered ConfigMap against report-intake's `Settings` fields, so
      # a renamed field has to re-run it. Without this line the rename lands green here and the
      # pod runs on the field's default — which for AUTH_MODE is authentication disabled.
      - "apps/report-intake/src/report_intake/config.py"
      - "apps/screamingface-engine/deploy/helm/**"
      - ".github/scripts/verify_chart_wiring.py"
      - ".github/workflows/charts.yml"
      # The verifier compares the chart's image against the images these lanes publish, and checks
      # that every dev lane has its own cache scope. A chart naming an image nobody pushes is
      # installable and permanently ImagePullBackOff, so editing either lane has to re-run the
      # comparison. `dev-build-*` is a glob because the cache-scope check spans all of them.
      - ".github/workflows/release-aigateway-ui.yml"
      - ".github/workflows/release-report-intake.yml"
      - ".github/workflows/release-screamingface-engine.yml"
      - ".github/workflows/dev-build-*.yml"
      # The verifier asserts release-report-intake.yml's tag filter against the component and
      # tag-separator declared here, so a rename in this file alone has to re-run it. Without this
      # line that rename lands green and the release tag builds nothing, silently.
      - "release-please-config.json"
  pull_request:
    paths:
      - "apps/aigateway/charts/**"
      - "apps/aigateway-ui/charts/**"
      - "apps/aigateway-ui/Dockerfile"
      - "apps/report-intake/charts/**"
      # The verifier asserts the rendered ConfigMap against report-intake's `Settings` fields, so
      # a renamed field has to re-run it. Without this line the rename lands green here and the
      # pod runs on the field's default — which for AUTH_MODE is authentication disabled.
      - "apps/report-intake/src/report_intake/config.py"
      - "apps/screamingface-engine/deploy/helm/**"
      - ".github/scripts/verify_chart_wiring.py"
      - ".github/workflows/charts.yml"
      # The verifier compares the chart's image against the images these lanes publish, and checks
      # that every dev lane has its own cache scope. A chart naming an image nobody pushes is
      # installable and permanently ImagePullBackOff, so editing either lane has to re-run the
      # comparison. `dev-build-*` is a glob because the cache-scope check spans all of them.
      - ".github/workflows/release-aigateway-ui.yml"
      - ".github/workflows/release-report-intake.yml"
      - ".github/workflows/release-screamingface-engine.yml"
      - ".github/workflows/dev-build-*.yml"
      # The verifier asserts release-report-intake.yml's tag filter against the component and
      # tag-separator declared here, so a rename in this file alone has to re-run it. Without this
      # line that rename lands green and the release tag builds nothing, silently.
      - "release-please-config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Lint and verify chart wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # Kept because it catches malformed Chart.yaml and stray files, but NOT relied on: `helm
      # lint` reports "0 chart(s) failed" for a chart that cannot render at all, since it reads
      # templates without executing them. The verify step below is what actually exercises them.
      - name: Lint
        run: |
          helm lint apps/aigateway/charts/aigateway
          helm lint apps/aigateway/charts/db
          helm lint apps/aigateway-ui/charts/aigateway-ui
          helm lint apps/report-intake/charts/report-intake
          helm lint apps/screamingface-engine/deploy/helm

      # Renders the charts and asserts on parsed output, including the cross-chart console/gateway
      # contract and screamingface-engine's paired Runner image.
      - name: Verify chart wiring
        run: python3 .github/scripts/verify_chart_wiring.py

      # The prod values file overrides clientPodNames wholesale, so nothing above exercises it.
      - name: Render the prod values
        run: |
          helm template aigw apps/aigateway/charts/aigateway \
            --values apps/aigateway/charts/aigateway/values-prod.yaml > /dev/null

      # report-intake's cloud posture. The verifier renders it too, but this step is what a
      # failure reads as: `values-cloud.yaml` needs eight install-time values the chart cannot
      # guess — a Gateway's name, a Cloudflare team and audience, two Secret names, the cluster's
      # Pod CIDR, and the mesh data plane's pod name and namespace. Six of the eight stop the
      # render outright; the other two default to a NAME with no object behind it. All eight, and
      # where each comes from, are in apps/report-intake/DEPLOYMENT.md. The placeholders below
      # exercise the templates; nothing consumes this rendering.
      #
      # AIDEV-NOTE: release-report-intake.yml renders the same file and needs the SAME --set keys.
      # It runs only on a release tag, so it cannot notice when a newly-required value has left it
      # unable to render — which already happened once. `verify_chart_wiring.py` now asserts the
      # two lanes carry an identical set, keyed off THIS step.
      #
      # AIDEV-NOTE: the last three exist because `values-cloud.yaml` deliberately ships
      # `config.allowedNetworks: []` and `networkPolicy.clientPodNames: []`. Both decide who may
      # forge `X-User-Email`, so the chart refuses to render rather than default them to something
      # working-but-overbroad that nobody is ever forced to narrow. Adding a real default to
      # values-cloud.yaml to quieten this step would defeat that guard — add a placeholder here.
      - name: Render report-intake's cloud values
        run: |
          helm template reports apps/report-intake/charts/report-intake \
            --values apps/report-intake/charts/report-intake/values-cloud.yaml \
            --set gateway.parentRef.name=ci-placeholder-gateway \
            --set gateway.identity.cloudflareAccess.teamDomain=ci-placeholder.cloudflareaccess.com \
            --set gateway.identity.cloudflareAccess.audience=ci-placeholder-aud \
            --set turnstile.existingSecret=ci-placeholder-turnstile \
            --set database.existingSecret=ci-placeholder-db \
            --set 'config.allowedNetworks[0]=10.42.0.0/16' \
            --set 'networkPolicy.clientPodNames[0]=ci-placeholder-envoy' \
            --set networkPolicy.clientNamespace=ci-placeholder-envoy-ns > /dev/null

  image:
    name: Build the console image
    runs-on: ubuntu-latest
    # The chart is only deployable if the image it names can be built. Nothing else in CI compiles
    # this Dockerfile — aigateway-ui-tests.yml runs `next build` on the host, which exercises the
    # app but not the multi-stage copy of .next/standalone, .next/static and public/ that the
    # runtime stage depends on. Omitting any of those three produces an image that starts cleanly
    # and serves a broken page.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/aigateway-ui/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
