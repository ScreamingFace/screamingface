name: ScreamingFace Tests

on:
  push:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      # the cache-hit contract fixtures that tests/test_cache_hit_contract.py consumes
      - "apps/aigateway/tests/fixtures/cache_hit_contract/**"
      - "apps/screamingface-engine/tests/unit/data/cache_hit_contract/**"
      - ".github/workflows/screamingface-tests.yml"
  pull_request:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      # the cache-hit contract fixtures that tests/test_cache_hit_contract.py consumes
      - "apps/aigateway/tests/fixtures/cache_hit_contract/**"
      - "apps/screamingface-engine/tests/unit/data/cache_hit_contract/**"
      - ".github/workflows/screamingface-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Needed by the two reporting steps below: the test report writes a check run,
  # and the coverage report writes a pull-request comment.
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra notebook

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Test and coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=screamingface \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: screamingface Test Results (${{ matrix.python-version }})
          path: packages/screamingface/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: always() && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        with:
          coverageFile: packages/screamingface/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.95

      - name: Verify deterministic notebooks
        run: uv run --extra notebook python scripts/check_notebooks.py

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run python scripts/check_distribution.py
