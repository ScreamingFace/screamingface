name: ScreamingFace Tests

on:
  push:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      # the cache-hit contract fixtures that tests/test_cache_hit_contract.py consumes
      - "apps/aigateway/tests/fixtures/cache_hit_contract/**"
      - "apps/screamingface-engine/tests/unit/data/cache_hit_contract/**"
      # the combine contract fixtures that tests/unit/test_binding_pattern_conformance.py and
      # tests/test_combine_contract_fixture.py consume
      - "apps/screamingface-engine/tests/unit/data/combine_contract/**"
      # the operator goldens that tests/test_vote_median_contract_fixtures.py checks
      - "apps/screamingface-engine/tests/unit/fixtures/combine/**"
      # the engine's signal-key grammar and corpus that tests/unit/test_signal_key_conformance.py reads
      - "apps/screamingface-engine/src/screamingface_engine/combine/ports.py"
      - "apps/screamingface-engine/tests/unit/test_combine_ports.py"
      # the canonical_params source that tests/unit/test_canonical_params_conformance.py binds
      - "apps/screamingface-engine/src/screamingface_engine/combine/spec.py"
      # the field_rules@1 grammars that tests/unit/test_signal_key_conformance.py binds
      - "apps/screamingface-engine/src/screamingface_engine/combine/operators/fields.py"
      # the cache snapshot column layout that tests/e2e/test_reducer_lane_contracts.py reads
      - "apps/aigateway/src/aigateway/core/request_cache/snapshot.py"
      # the Engine files that the SDK conformance and contract checks read
      - "apps/screamingface-engine/src/screamingface_engine/combine/**"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/operation_outputs.py"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/contract.py"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/definition.py"
      - "apps/screamingface-engine/tests/unit/data/corrective_loop_candidate.url4"
      - ".github/workflows/screamingface-tests.yml"
  pull_request:
    paths:
      - "docs/spec/fixtures/ome_400/**"
      - "packages/screamingface/**"
      - "packages/url4/**"
      # the cache-hit contract fixtures that tests/test_cache_hit_contract.py consumes
      - "apps/aigateway/tests/fixtures/cache_hit_contract/**"
      - "apps/screamingface-engine/tests/unit/data/cache_hit_contract/**"
      # the combine contract fixtures that tests/unit/test_binding_pattern_conformance.py and
      # tests/test_combine_contract_fixture.py consume
      - "apps/screamingface-engine/tests/unit/data/combine_contract/**"
      # the operator goldens that tests/test_vote_median_contract_fixtures.py checks
      - "apps/screamingface-engine/tests/unit/fixtures/combine/**"
      # the engine's signal-key grammar and corpus that tests/unit/test_signal_key_conformance.py reads
      - "apps/screamingface-engine/src/screamingface_engine/combine/ports.py"
      - "apps/screamingface-engine/tests/unit/test_combine_ports.py"
      # the canonical_params source that tests/unit/test_canonical_params_conformance.py binds
      - "apps/screamingface-engine/src/screamingface_engine/combine/spec.py"
      # the field_rules@1 grammars that tests/unit/test_signal_key_conformance.py binds
      - "apps/screamingface-engine/src/screamingface_engine/combine/operators/fields.py"
      # the cache snapshot column layout that tests/e2e/test_reducer_lane_contracts.py reads
      - "apps/aigateway/src/aigateway/core/request_cache/snapshot.py"
      # the Engine files that the SDK conformance and contract checks read
      - "apps/screamingface-engine/src/screamingface_engine/combine/**"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/operation_outputs.py"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/contract.py"
      - "apps/screamingface-engine/src/screamingface_engine/benchmarks/definition.py"
      - "apps/screamingface-engine/tests/unit/data/corrective_loop_candidate.url4"
      - ".github/workflows/screamingface-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Needed by the two reporting steps below: the test report writes a check run,
  # and the coverage report writes a pull-request comment.
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra notebook

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      # `-n auto --dist worksteal`: same flags and same reason as the gate line in
      # .claude/sdlc.local.md (OME-1444) — one worker per runner core.
      - name: Test and coverage
        run: |
          uv run pytest \
            -n auto --dist worksteal \
            --tb=short \
            --junitxml=results.xml \
            --cov=screamingface \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: screamingface Test Results (${{ matrix.python-version }})
          path: packages/screamingface/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: >-
          always() && github.event_name == 'pull_request' && matrix.python-version == '3.12' &&
          github.event.pull_request.head.repo.full_name == github.repository
        with:
          coverageFile: packages/screamingface/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.95

      - name: Verify deterministic notebooks
        run: uv run --extra notebook python scripts/check_notebooks.py

      - name: Build distributions
        run: uv build

      - name: Verify distribution contents
        run: uv run python scripts/check_distribution.py
