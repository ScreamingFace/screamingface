name: Release screamingface-engine

on:
  push:
    tags: ["screamingface-engine-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. screamingface-engine-v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#screamingface-engine-v}"
          # One shipped distribution now (the control plane and the run mode were merged into a
          # single artifact), so there is exactly one version to agree with the tag, and one
          # pyproject.toml holding it.
          DECLARED=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' apps/screamingface-engine/pyproject.toml)
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but apps/screamingface-engine/pyproject.toml reports $DECLARED"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ONE image, entered in either of two modes (`screamingface-engine serve` / `screamingface-engine run`). The
  # Dockerfile uses the REPO ROOT as context: it COPYs packages/url4, which carries both the wire
  # contract (`url4.streaming`) the control plane needs and the engine (`url4.dag`) the run mode
  # needs.
  image:
    needs: verify
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/screamingface/screamingface-engine
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Context is the REPO ROOT, not the app dir — the Dockerfile COPYs a path dependency
          # (packages/url4) that lives outside its own directory, matching docker-compose.yml.
          context: .
          file: apps/screamingface-engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}:${{ needs.verify.outputs.version }}
            ${{ env.REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  benchmark-image:
    needs: [verify, image]
    runs-on: ubuntu-latest
    env:
      REPO: ghcr.io/screamingface/screamingface-engine-benchmark
      BASE: ghcr.io/screamingface/screamingface-engine
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/screamingface-engine/Dockerfile.benchmark
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ env.BASE }}:${{ needs.verify.outputs.version }}
          tags: ${{ env.REPO }}:${{ needs.verify.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    # NOTE: the chart is LINTED only. OCI Helm publishing is DEFERRED until the NATS dependency in
    # apps/screamingface-engine/deploy/helm/Chart.yaml is pinned + vendored — it is a placeholder today
    # (Chart.yaml: "confirm before enabling"), so `helm template`/`helm package` fail with
    # "found in Chart.yaml, but missing in charts/ directory: nats". Follow-up: OME-567.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
      - name: Lint chart
        run: helm lint apps/screamingface-engine/deploy/helm

  release:
    needs: [verify, image, benchmark-image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ScreamingFace screamingface-engine ${{ needs.verify.outputs.version }}
          draft: true
          body: |
            Control-plane image:
            ```
            docker pull ghcr.io/screamingface/screamingface-engine:${{ needs.verify.outputs.version }}
            ```

            DRACO benchmark Runner image:
            ```
            docker pull ghcr.io/screamingface/screamingface-engine-benchmark:${{ needs.verify.outputs.version }}
            ```

            Helm chart: OCI publish deferred until the NATS dependency is pinned (see OME-567).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
