name: Release AI Gateway

on:
  push:
    tags: ["aigateway-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. aigateway-v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#aigateway-v}"
          MANIFEST=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' apps/aigateway/pyproject.toml)
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION but apps/aigateway/pyproject.toml reports $MANIFEST"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/aigateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/screamingface/screamingface-aigateway:${{ needs.verify.outputs.version }}
            ghcr.io/screamingface/screamingface-aigateway:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
      - name: Lint and render charts
        run: |
          helm lint apps/aigateway/charts/db
          helm lint apps/aigateway/charts/aigateway
          helm template aigw-db apps/aigateway/charts/db \
            --namespace aigw \
            --values apps/aigateway/charts/db-aigateway.values.yaml >/tmp/aigw-db.yaml
          helm template aigw apps/aigateway/charts/aigateway \
            --namespace aigw >/tmp/aigw.yaml
          helm template aigw apps/aigateway/charts/aigateway \
            --namespace aigw \
            --values apps/aigateway/charts/aigateway/values-prod.yaml >/tmp/aigw-prod.yaml
      - name: Package Helm chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist/charts
          helm package apps/aigateway/charts/aigateway \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/charts
      - name: Log in to GHCR for Helm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push Helm chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: helm push "dist/charts/aigateway-$VERSION.tgz" oci://ghcr.io/screamingface/screamingface/charts

  release:
    needs: [verify, image, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ScreamingFace AI Gateway ${{ needs.verify.outputs.version }}
          draft: true
          body: |
            Container image:
            ```
            docker pull ghcr.io/screamingface/screamingface-aigateway:${{ needs.verify.outputs.version }}
            ```

            Helm chart:
            ```
            helm pull oci://ghcr.io/screamingface/screamingface/charts/aigateway --version ${{ needs.verify.outputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to sf-installer (public)
        env:
          GH_TOKEN: ${{ secrets.SF_INSTALLER_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release delete "$TAG" --repo OpenMined/sf-installer --yes 2>/dev/null || true
          NOTES=$(printf 'AI Gateway container image: `%s`\nAI Gateway Helm chart: `%s`\n' \
            "ghcr.io/screamingface/screamingface-aigateway:$VERSION" \
            "oci://ghcr.io/screamingface/screamingface/charts/aigateway --version $VERSION"
          )
          gh release create "$TAG" \
            --repo OpenMined/sf-installer \
            --title "ScreamingFace AI Gateway $VERSION" \
            --notes "$NOTES"
