name: Repo Checks

# SECURITY: every `run:` below is a static command. No event payload, ref name, PR title or
# commit message is interpolated into a shell context, so there is no injection surface here.
on:
  push:
    paths:
      - ".claude/skills/sdlc-**"
      - ".claude/scripts/**"
      - ".github/workflows/repo-checks.yml"
      - ".github/workflows/preview-*.yml"
      - ".github/scripts/preview_contract.py"
      - ".github/scripts/preview_access.sh"
      - ".github/scripts/test_preview_access.py"
      - ".github/scripts/test_preview_contract.py"
      - ".github/dependabot.yml"
      - ".github/dependabot-ignores.yml"
      # Mirror/ledger drift arrives in docs-only PRs, which match none of the patterns
      # above — without these two the mirror-status job would never see the change it
      # exists to catch (OME-1215).
      - "docs/tasks/**"
      - "docs/work/**"
  pull_request:
    paths:
      - ".claude/skills/sdlc-**"
      - ".claude/scripts/**"
      - ".github/workflows/repo-checks.yml"
      - ".github/workflows/preview-*.yml"
      - ".github/scripts/preview_contract.py"
      - ".github/scripts/preview_access.sh"
      - ".github/scripts/test_preview_access.py"
      - ".github/scripts/test_preview_contract.py"
      - ".github/dependabot.yml"
      - ".github/dependabot-ignores.yml"
      - "docs/tasks/**"
      - "docs/work/**"
  # WHY a schedule: the ignore audit checks state that changes when UPSTREAM ships, not when we
  # commit. Path triggers alone would only re-check it on the rare PR that edits the config, so a
  # blocker could clear and sit unnoticed for months — exactly the rot the audit exists to catch.
  # Monday morning, so a liftable ignore is visible at the start of the week.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-contract:
    name: Preview contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Test Preview selection, security, and admission
        run: uv run --project apps/screamingface-engine pytest .github/scripts/test_preview_*.py -q
      - name: Validate Preview access helper
        run: bash -n .github/scripts/preview_access.sh

  loop-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SHARED-LOOP parity
        run: python3 .claude/scripts/check_loop_parity.py

  mirror-status:
    name: Mirror <-> ledger status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No setup-uv and no setup-python: the gate and its tests are stdlib-only `python3`,
      # which is what makes them cheap enough to run on every docs PR. No network call and
      # no Linear token — Linear remains the status authority, but a quality gate that
      # needs a credential is red on every fork PR, so this one asserts only what the
      # docs/work ledgers in the checkout can prove.
      - name: Gate tests
        run: python3 .claude/scripts/tests/test_check_mirror_status.py
      - name: Mirror status gate
        run: python3 .claude/scripts/check_mirror_status.py

  dependabot-ignores:
    name: Dependabot ignore audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # Needs `npm view` for the npm_peer probes; node is not otherwise required here.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Exit codes are deliberately asymmetric (see the script's docstring): DRIFT between
      # dependabot.yml and the registry fails, because that is our own inconsistency and always
      # fixable. A merely LIFTABLE ignore only warns — failing a PR because upstream published a
      # release would train people to disable this check, which is worse than the rot it catches.
      - name: Audit dependabot ignore rules
        run: uv run .claude/scripts/audit_dependabot_ignores.py
