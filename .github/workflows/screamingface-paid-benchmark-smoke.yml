# The paid Benchmark smoke (OME-1275): run every Benchmark the engine serves once for
# real — Imported (inspect evals) and hand-built alike — as a Fusion of three
# flash-tier seeded models, 2 Cases per Benchmark, through the full product path, and
# fail on any infrastructure failure code.
#
# workflow_dispatch ONLY, on purpose: this lane spends real money (bounded: 2 Cases
# per Benchmark) through the OPENROUTER_API_KEY repo secret. It is a button the
# owner presses after wrapper/gateway/route refactors or new imports — never a merge
# gate, never on push/pull_request. The local twin is
# `just screamingface test-paid-benchmarks [scope] [benchmarks]`.
name: ScreamingFace Paid Benchmark Smoke

on:
  workflow_dispatch:
    inputs:
      # WHY a choice: the hand-built rubric Benchmarks (DRACO, HealthBench, GDPval)
      # call a pro-tier Judge once per criterion, so a press after an inspect import
      # can pick `imported` and skip that spend. Read only through env: below.
      scope:
        description: "Which Benchmarks to run"
        type: choice
        options:
          - all
          - imported
          - hand-built
        default: all
      # WHY free text beside the choice (OME-1522): smoking one new Benchmark should not
      # pay for its whole kind. Filled in, it replaces `scope`; a name the live engine
      # does not list fails the press before any paid call. Read only through env: below,
      # never interpolated into a run: script.
      benchmarks:
        description: "Only these Benchmark ids, comma-separated (e.g. musique,inspect-gsm8k); overrides scope"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  paid-smoke:
    runs-on: ubuntu-latest
    # 180: a cold cache means one dataset download per Benchmark before boot, then one
    # paid Fusion run per Benchmark — and the shelf grows with every import. The
    # imported shelf alone took 15–38 min per press; the rubric Benchmarks judge every
    # criterion (DRACO five times), so the hand-built ones get generous headroom.
    # The asset cache is saved right after the prepare step (below), so even a
    # deadline death here never costs the downloads twice.
    timeout-minutes: 180
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Fail before booting anything if the secret is absent (e.g. a fork) — the
      # pytest gate would otherwise burn minutes of stack boot to print a skip.
      - name: Require the OpenRouter key secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not configured — the paid smoke cannot run"
            exit 1
          fi

      - name: Install SDK dependencies
        run: uv sync

      # The bundles are dataset snapshots pinned by commit sha — slow to download once,
      # immutable afterwards, so the cache key only needs the code that pins and
      # prepares them: the inspect plugin for the Imported Benchmarks, the engine's
      # benchmarks package for the hand-built ones.
      # WHY restore/save split, not the all-in-one actions/cache: that one saves in
      # its post step only when the WHOLE job succeeds — a failing smoke (the very
      # run someone needs to repeat) would throw away every freshly downloaded
      # dataset. Saving right after prepare decouples the cache from the verdict.
      - name: Restore benchmark assets
        id: assets-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/screamingface-data/benchmark-assets
          key: benchmark-assets-${{ hashFiles('apps/screamingface-engine/src/screamingface_engine_inspect/**', 'apps/screamingface-engine/src/screamingface_engine/benchmarks/**') }}

      # The engine serves the Imported Benchmarks only with the `benchmarks` extra
      # (uncoinstallable with the SDK's runtime extra), and every bundle comes from
      # the engine's own preparer. Every bundle is prepared whatever is picked: one
      # cache entry serves every press, and a cache hit makes the extra ones free.
      # WHY the temp file, not `done < <(...)` (PR #1035 review): a failed
      # --list-bundles inside process substitution does NOT trip `set -e` — the loop
      # would see an empty list, prepare nothing, and the pytest step would then have
      # skipped green without SCREAMINGFACE_PAID_REQUIRED below.
      - name: Install the engine's preparer extra
        working-directory: apps/screamingface-engine
        run: uv sync --extra benchmarks

      - name: Prepare benchmark assets
        working-directory: apps/screamingface-engine
        # Read-only Hugging Face token for gated datasets (xstest, OME-1269), scoped to
        # this step only (not the dependency install above); without it the prepare step refuses
        # the gated Benchmark by name, which fails this owner-pressed run.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_BENCHMARKS }}
        run: |
          assets=/tmp/screamingface-data/benchmark-assets
          bundles_file="$(mktemp)"
          uv run python -m screamingface_engine.benchmarks.prepare --list-bundles > "$bundles_file"
          missing=()
          while read -r bundle; do
            case "$bundle" in */*|*..*) echo "::error::suspicious bundle id '$bundle'"; exit 1 ;; esac
            if uv run python -c "import json,sys;json.load(open(sys.argv[1]))" \
                "$assets/$bundle/cases.json" >/dev/null 2>&1; then
              continue
            fi
            rm -rf "$assets/${bundle:?}"
            missing+=("--bundle" "$bundle")
          done < "$bundles_file"
          if [ ${#missing[@]} -gt 0 ]; then
            uv run python -m screamingface_engine.benchmarks.prepare --root "$assets" "${missing[@]}"
          fi

      - name: Save benchmark assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/screamingface-data/benchmark-assets
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      # SCREAMINGFACE_PAID_REQUIRED: this workflow IS the paid button, so an
      # unavailable stack must FAIL the run — a pytest skip exits 0, and a green
      # no-op run would tell the owner the whole shelf was re-proven when zero ran.
      # No `-m paid` filter: merge CI never collects tests/paid (tests/conftest.py
      # deselects it without SCREAMINGFACE_TEST_PAID=1), so the lane's free gate tests
      # run here, on every press, or nowhere.
      - name: Run the paid smoke over the picked Benchmarks
        env:
          SCREAMINGFACE_PAID_SCOPE: ${{ inputs.scope }}
          SCREAMINGFACE_PAID_BENCHMARKS: ${{ inputs.benchmarks }}
          SCREAMINGFACE_TEST_PAID: "1"
          SCREAMINGFACE_PAID_REQUIRED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCREAMINGFACE_E2E_ASSETS: /tmp/screamingface-data/benchmark-assets
          SCREAMINGFACE_PAID_LOG_DIR: /tmp/screamingface-paid-logs
        run: uv run pytest tests/paid -rs -v --junitxml /tmp/screamingface-paid-logs/junit.xml

      # The press overview on the run page itself (failed Benchmarks first, then totals:
      # graded Cases, cost, tokens, time), so a verdict needs no artifact download.
      # The smoke writes summary.md before its verdict; a boot failure leaves none.
      - name: Publish the paid smoke overview
        if: always()
        run: |
          if [ -f /tmp/screamingface-paid-logs/summary.md ]; then
            cat /tmp/screamingface-paid-logs/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Everything needed to debug a press, in one download: the stack's own logs
      # (gateway request lines, engine model-call lifecycle), one full Report per
      # Benchmark under reports/ (member + synthesizer answers, grade, judge reasoning,
      # run/trace ids to find the matching log lines), and junit.xml verdicts.
      # The OpenRouter key never appears in any of it: it is in no child's environment
      # and travels only inside the SDK's connect request body, which neither app
      # logs at info level.
      # Owner-accepted exposure: this repo is public, so any signed-in GitHub user can
      # download the artifact for its retention window — the reports republish
      # public-dataset questions, model answers and judge reasoning that can quote
      # the reference answer.
      - name: Upload debug bundle
        id: debug-bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-smoke-debug-bundle
          path: /tmp/screamingface-paid-logs
          if-no-files-found: ignore
          retention-days: 14

      # One click from the overview to the bundle, instead of scrolling to the run's
      # Artifacts panel. artifact-url is empty when the upload found no files (a boot
      # failure before the log dir exists), so no dead link is written then.
      - name: Link the debug bundle from the overview
        if: always() && steps.debug-bundle.outputs.artifact-url != ''
        env:
          BUNDLE_URL: ${{ steps.debug-bundle.outputs.artifact-url }}
        run: |
          echo "📦 [Download the debug bundle]($BUNDLE_URL) — stack logs, one Report per Benchmark, junit.xml (kept 14 days)" >> "$GITHUB_STEP_SUMMARY"
