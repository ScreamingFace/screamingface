name: AI Gateway Tests

on:
  push:
    paths:
      - "apps/aigateway/**"
      - ".github/workflows/aigateway-tests.yml"
  pull_request:
    paths:
      - "apps/aigateway/**"
      - ".github/workflows/aigateway-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/aigateway

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # WHY helm is in the TEST job (OME-1184): `tests/unit/test_chart_render_tracing.py`
      # renders the chart and asserts against the rendered manifest, because `helm lint`
      # reports "0 chart(s) failed" for a chart that cannot render at all.
      #
      # Those tests carry `skipif(shutil.which("helm") is None)`. Without this step they would
      # SKIP here and pass while asserting nothing — not hypothetical: it is exactly what
      # happened to the engine's equivalent chart tests, whose `test` job has no helm and whose
      # `chart` job runs no pytest, so they have never once executed on the merge gate
      # (OME-1189). A conditional skip reads as healthy locally and is invisible in CI output.
      #
      # SECURITY: a pinned third-party action, no `github.event.*` interpolation anywhere.
      - uses: azure/setup-helm@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # WHY before `uv sync`: sync SILENTLY regenerates a stale lock, so a lockfile that no
      # longer matches pyproject.toml is invisible to every later step — including the
      # version bump a release PR makes and never locks.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github

      - name: Lint (ruff format)
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run pyright

      - name: Enterprise import guard
        run: uv run python scripts/check_no_enterprise.py

      - name: Run unit tests with aggregate coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=aigateway \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -m "not live and not needs_postgres" \
            -v

      - name: Run auth surface coverage
        run: |
          uv run pytest tests/unit/auth tests/unit/test_auth_routes.py \
            --cov=aigateway.core.auth \
            --cov=aigateway.routes.auth \
            --cov=aigateway.routes.auth_session \
            --cov=aigateway.routes.accounts \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Run Postgres migration smoke
        env:
          AIGW_TEST_PG: "1"
        run: uv run pytest -m needs_postgres -v

      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: AI Gateway Test Results (${{ matrix.python-version }})
          path: apps/aigateway/results.xml
          reporter: java-junit

      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: always() && github.event_name == 'pull_request'
        with:
          coverageFile: apps/aigateway/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80

  cost:
    name: CI cost diff
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: HupBaHa/cost-diff@v0.1.2
        with:
          current-job-id: ${{ job.check_run_id }}
          baseline-event: push
          comment-mode: update
