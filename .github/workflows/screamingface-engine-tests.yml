name: screamingface-engine-tests
on:
  push:
    paths:
      - "apps/screamingface-engine/**"
      # the wire contract (`url4.streaming`) and the engine both ship from here
      - "packages/url4/**"
      - ".github/workflows/screamingface-engine-tests.yml"
  pull_request:
    paths:
      - "apps/screamingface-engine/**"
      # the wire contract (`url4.streaming`) and the engine both ship from here
      - "packages/url4/**"
      - ".github/workflows/screamingface-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

# Rapid pushes to the same ref would otherwise run duplicate matrices to completion.
concurrency:
  group: screamingface-engine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: apps/screamingface-engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # WHY before `uv sync`: sync SILENTLY regenerates a stale lock, so a lockfile that no
      # longer matches pyproject.toml is invisible to every later step. That exact defect shipped
      # once already (a package rename left the lock stale) and CI could not see it.
      - name: Check the lockfile is current
        run: uv lock --check
      - run: uv sync --dev
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # One image holds both modes, so nothing at runtime proves the boundary — this is what
      # keeps the run mode's import graph free of FastAPI/uvicorn/the kubernetes client, and the
      # control plane free of the engine.
      - name: Check layering
        run: python3 ../../.claude/scripts/check_layering.py
      - name: Run unit tests with aggregate coverage
        run: |
          uv run pytest \
            --tb=short \
            --junitxml=results.xml \
            --cov=screamingface_engine \
            --cov=url4.streaming \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v
      - name: Test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: screamingface-engine Test Results (${{ matrix.python-version }})
          path: apps/screamingface-engine/results.xml
          reporter: java-junit
      - name: Coverage report
        uses: orgoro/coverage@v3.3
        if: always() && github.event_name == 'pull_request'
        with:
          coverageFile: apps/screamingface-engine/coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.80

  # The conformance suite's real-broker half (`STREAM_FACTORIES[JetStreamConsumer]`) is skipped
  # wherever no NATS is reachable — which was everywhere. This job is the one place it runs.
  # It is what would have caught frames never being acked and streams never being bounded: both
  # are invisible against the in-memory double by construction.
  conformance:
    name: EventStream conformance (real NATS)
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: --name nats-conformance
    defaults:
      run:
        working-directory: apps/screamingface-engine
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --dev
      # The service container runs `nats-server` without -js, so JetStream must be enabled for
      # the stream APIs the adapter uses. Running our own gives us that flag.
      - name: Start NATS with JetStream
        run: |
          docker rm -f nats-conformance || true
          docker run -d --name nats-js -p 4222:4222 nats:2.10-alpine -js
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run the adapter conformance suite against the real broker
        run: |
          uv run pytest -v \
            tests/unit/test_stream_contract.py \
            tests/unit/test_attach_from_sequence_bounds.py \
            tests/unit/test_jetstream_subscribe_ensures_stream.py \
            tests/integration/test_run_queue_roundtrip.py
      # A skip here means the probe did not find the broker and the job proved nothing.
      - name: Fail if the real-broker parameters were skipped
        run: |
          uv run pytest -q \
            tests/unit/test_stream_contract.py \
            tests/unit/test_attach_from_sequence_bounds.py \
            | tee result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::real-NATS conformance parameters were skipped — the broker was unreachable"
            exit 1
          fi

  image:
    name: Build the deployable images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # WHY build on PRs at all: `592e4a89` rewrote the Dockerfile substantially (repo-root
      # context, mirrored /app layout, editable path-dep resolution at runtime) and nothing built
      # it until a release tag — so a break surfaced at release time, on the release path.
      - uses: docker/setup-buildx-action@v4
        with:
          # Let the benchmark build consume the PR-built base without publishing it.
          driver: docker
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/screamingface-engine/Dockerfile
          push: false
          load: true
          tags: screamingface-engine:ci
      - name: Build the benchmark image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/screamingface-engine/Dockerfile.benchmark
          build-contexts: |
            screamingface-engine-ci=docker-image://screamingface-engine:ci
          build-args: |
            BASE=screamingface-engine-ci
          push: false
          load: true
          tags: screamingface-engine-benchmark:ci
      # Both argv modes must at least start from the built image: the entrypoint is the mode
      # switch, so a broken one is a deployment that cannot run either half.
      - name: Smoke both modes
        run: |
          docker run --rm screamingface-engine:ci screamingface-engine --help
          docker run --rm screamingface-engine:ci screamingface-engine run --help
          docker run --rm screamingface-engine-benchmark:ci screamingface-engine run --help

  chart:
    name: Render the Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # `helm lint` alone reported "0 chart(s) failed" on a chart that cannot render at all —
      # every template aborts on the `natsUrl` `fail` when it is unset. Templating is the check
      # that actually exercises the templates; linting only reads them.
      - name: Lint
        run: helm lint apps/screamingface-engine/deploy/helm
      - name: Template with an external NATS
        run: |
          helm template screamingface-engine apps/screamingface-engine/deploy/helm \
            --set config.natsUrl=nats://nats.example:4222 > /dev/null
      # WHY no `helm dependency build`: the NATS subchart is already vendored at
      # `charts/nats-1.2.2.tgz`, matching `Chart.lock`. `dependency build` re-resolves
      # every dependency against its registered `helm repo`, which is not registered on a
      # fresh runner — `Error: no repository definition for https://nats-io.github.io/...`
      # — even though the vendored archive already satisfies the template. Templating reads
      # straight from `charts/`, so nothing needs re-fetching here.
      - name: Template with the bundled NATS subchart
        run: |
          helm template screamingface-engine apps/screamingface-engine/deploy/helm \
            --set nats.enabled=true \
            --set config.natsUrl=nats://screamingface-engine-nats:4222 > /dev/null
      # The cloud posture lives in its own values file (it needs a Gateway name the chart cannot
      # know), so nothing above exercises it — bare `helm template` renders no HTTPRoute at all.
      # Without this step `values-cloud.yaml` could drift out of the schema unnoticed until a deploy.
      - name: Template the cloud values (Gateway API edge)
        run: |
          rendered=$(helm template screamingface-engine apps/screamingface-engine/deploy/helm \
            -f apps/screamingface-engine/deploy/helm/values-cloud.yaml \
            --set gateway.parentRef.name=ci-gateway \
            --set gateway.cloudflareAccess.teamDomain=ci.cloudflareaccess.com \
            --set gateway.cloudflareAccess.audience=ci-aud \
            --set config.natsUrl=nats://nats.example:4222)
          echo "$rendered" | grep -q 'kind: HTTPRoute' || { echo "::error::values-cloud.yaml rendered no HTTPRoute"; exit 1; }
          # The cloud posture must ship the identity filter, not just the route. Its ABSENCE is the
          # one prerequisite that fails open: the edge would forward a client-supplied
          # X-User-Email and aigateway in `cloudflare_headers` mode would believe it.
          echo "$rendered" | grep -q 'kind: SecurityPolicy' || { echo "::error::values-cloud.yaml rendered no SecurityPolicy — the edge would not verify Cloudflare Access"; exit 1; }
          echo "$rendered" | grep -q 'header: X-User-Email' || { echo "::error::the SecurityPolicy does not inject X-User-Email, which is the contract aigateway reads"; exit 1; }
      # A JWT filter with no team domain verifies nothing and one with no audience accepts every
      # application in the Cloudflare team, so values.schema.json refuses both. If this ever
      # SUCCEEDS, an install could render an edge that authenticates nobody.
      - name: An enabled Cloudflare Access filter with no team domain must be refused
        run: |
          if helm template screamingface-engine apps/screamingface-engine/deploy/helm \
               --set gateway.enabled=true \
               --set gateway.parentRef.name=ci-gateway \
               --set gateway.cloudflareAccess.enabled=true \
               --set config.natsUrl=nats://x:4222 >/dev/null 2>&1; then
            echo "::error::values.schema.json accepted cloudflareAccess.enabled=true with an empty teamDomain/audience"
            exit 1
          fi
      # An enabled Gateway edge with no parentRef attaches to nothing and silently serves no
      # traffic, so values.schema.json refuses it. If this ever SUCCEEDS, that guard is gone.
      - name: An enabled Gateway with no parentRef must be refused
        run: |
          if helm template screamingface-engine apps/screamingface-engine/deploy/helm \
               --set gateway.enabled=true \
               --set config.natsUrl=nats://x:4222 >/dev/null 2>&1; then
            echo "::error::values.schema.json accepted gateway.enabled=true with an empty parentRef.name"
            exit 1
          fi
      # values.schema.json has additionalProperties:false, so a stale key must be rejected. If
      # this ever SUCCEEDS, the schema stopped guarding the values file.
      - name: A stale value must be refused
        run: |
          if helm template screamingface-engine apps/screamingface-engine/deploy/helm \
               --set config.natsUrl=nats://x:4222 \
               --set runner.image=stale/removed:v1 >/dev/null 2>&1; then
            echo "::error::values.schema.json accepted a removed key (runner.image)"
            exit 1
          fi

  cost:
    name: CI cost diff
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: HupBaHa/cost-diff@v0.1.2
        with:
          current-job-id: ${{ job.check_run_id }}
          baseline-event: push
          comment-mode: update
