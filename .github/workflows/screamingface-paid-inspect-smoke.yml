# The paid imported-board smoke (OME-1275): run every inspect_evals board once for
# real — a Fusion of three flash-tier seeded models, 2 Cases per board — through the
# full product path, and fail on any infrastructure failure code.
#
# workflow_dispatch ONLY, on purpose: this lane spends real money (a fraction of a
# dollar per run) through the OPENROUTER_API_KEY repo secret. It is a button the
# owner presses after wrapper/gateway/route refactors or new imports — never a merge
# gate, never on push/pull_request. The local twin is
# `just screamingface test-paid-inspect`.
name: ScreamingFace Paid Inspect Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-smoke:
    runs-on: ubuntu-latest
    # 120: a cold cache means one dataset download per imported board before boot,
    # then one paid Fusion run per board — and the shelf grows with every import.
    # The asset cache is saved right after the prepare step (below), so even a
    # deadline death here never costs the downloads twice.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/screamingface

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Fail before booting anything if the secret is absent (e.g. a fork) — the
      # pytest gate would otherwise burn minutes of stack boot to print a skip.
      - name: Require the OpenRouter key secret
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is not configured — the paid smoke cannot run"
            exit 1
          fi

      - name: Install SDK dependencies
        run: uv sync

      # The imported bundles are dataset snapshots pinned by commit sha — slow to
      # download once, immutable afterwards, so the cache key only needs the pins.
      # WHY restore/save split, not the all-in-one actions/cache: that one saves in
      # its post step only when the WHOLE job succeeds — a failing smoke (the very
      # run someone needs to repeat) would throw away every freshly downloaded
      # dataset. Saving right after prepare decouples the cache from the verdict.
      - name: Restore benchmark assets
        id: assets-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/screamingface-data/benchmark-assets
          key: inspect-assets-${{ hashFiles('apps/screamingface-engine/src/screamingface_engine_inspect/**') }}

      # The engine serves the imported boards only with the `benchmarks` extra
      # (uncoinstallable with the SDK's runtime extra), and their bundles come from
      # the engine's own preparer — `screamingface prepare --all` covers only the
      # ScreamingFace-authored boards.
      # WHY the temp file, not `done < <(...)` (PR #1035 review): a failed
      # --list-bundles inside process substitution does NOT trip `set -e` — the loop
      # would see an empty list, prepare nothing, and the pytest step would then have
      # skipped green without SCREAMINGFACE_PAID_REQUIRED below.
      - name: Prepare imported benchmark assets
        working-directory: apps/screamingface-engine
        run: |
          uv sync --extra benchmarks
          assets=/tmp/screamingface-data/benchmark-assets
          bundles_file="$(mktemp)"
          uv run python -m screamingface_engine.benchmarks.prepare --list-bundles > "$bundles_file"
          missing=()
          while read -r bundle; do
            case "$bundle" in inspect-*) ;; *) continue ;; esac
            case "$bundle" in */*|*..*) echo "::error::suspicious bundle id '$bundle'"; exit 1 ;; esac
            if uv run python -c "import json,sys;json.load(open(sys.argv[1]))" \
                "$assets/$bundle/cases.json" >/dev/null 2>&1; then
              continue
            fi
            rm -rf "$assets/${bundle:?}"
            missing+=("--bundle" "$bundle")
          done < "$bundles_file"
          if [ ${#missing[@]} -gt 0 ]; then
            uv run python -m screamingface_engine.benchmarks.prepare --root "$assets" "${missing[@]}"
          fi

      - name: Save benchmark assets
        if: steps.assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/screamingface-data/benchmark-assets
          key: ${{ steps.assets-cache.outputs.cache-primary-key }}

      # SCREAMINGFACE_PAID_REQUIRED: this workflow IS the paid button, so an
      # unavailable stack must FAIL the run — a pytest skip exits 0, and a green
      # no-op run would tell the owner the whole shelf was re-proven when zero ran.
      - name: Run the paid smoke over every imported board
        env:
          SCREAMINGFACE_TEST_PAID: "1"
          SCREAMINGFACE_PAID_REQUIRED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SCREAMINGFACE_E2E_ASSETS: /tmp/screamingface-data/benchmark-assets
          SCREAMINGFACE_PAID_LOG_DIR: /tmp/screamingface-paid-logs
        run: uv run pytest tests/paid -m paid -rs -v --junitxml /tmp/screamingface-paid-logs/junit.xml

      # Everything needed to debug a press, in one download: the stack's own logs
      # (gateway request lines, engine model-call lifecycle), one full Report per
      # board under reports/ (member + synthesizer answers, grade, judge reasoning,
      # run/trace ids to find the matching log lines), and junit.xml verdicts.
      # The OpenRouter key never appears in any of it: it is in no child's environment
      # and travels only inside the SDK's connect request body, which neither app
      # logs at info level.
      # Owner-accepted exposure: this repo is public, so any signed-in GitHub user can
      # download the artifact for its retention window — the reports republish
      # public-dataset questions, model answers and judge reasoning that can quote
      # the reference answer.
      - name: Upload debug bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paid-smoke-debug-bundle
          path: /tmp/screamingface-paid-logs
          if-no-files-found: ignore
          retention-days: 14
