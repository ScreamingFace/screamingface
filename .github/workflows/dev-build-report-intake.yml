# Dev image on every merge to main (path-filtered): immutable main-<shortsha> tags
# so a dev environment can track main automatically. Release builds are untouched
# — this never tags 'latest' and never publishes charts. Single-arch (amd64) for
# speed; dev clusters are amd64.
#
# Mirrors dev-build-aigateway.yml. The chart is NOT published here on purpose: the
# release lane owns it, and a dev cluster tracks main by overriding image.tag on a
# chart it already has. Pointing it at one of these builds is
# `--set image.tag=main-<shortsha>`; the repository is unchanged, which is the
# reason the tags below name the same repository release-report-intake.yml does
# (asserted by .github/scripts/verify_chart_wiring.py — a dev image under another
# name is one the chart can never be pointed at without editing values).
#
# THE CHART IS NOT WHAT MAKES THAT IMAGE SAFE TO DEPLOY. A dev install still needs
# values-cloud.yaml's eight install-time values, and the ones that decide who may
# forge an identity — config.allowedNetworks and the NetworkPolicy peers — are
# empty by design and refused at render. See apps/report-intake/DEPLOYMENT.md.
#
# SECURITY: no `run:` block interpolates a `${{ }}` expression carrying free text.
# The two that interpolate at all read `github.sha` and the checkout's own git log;
# no `github.event.*` value is referenced anywhere in this file.
name: Dev build report-intake
on:
  push:
    branches: [main]
    paths:
      - "apps/report-intake/**"
      - ".github/workflows/dev-build-report-intake.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write # OIDC → Azure; no stored credentials
concurrency:
  group: dev-build-report-intake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the image's embedded build timestamp to the commit's own timestamp.
      # WHY: with a warm layer cache, two builds from different commits can
      # reproduce an IDENTICAL config `created` time (observed 2026-08-21:
      # #686's chart-only merge tied #684's build to the second), and any
      # consumer that orders these tags by build time — the deployment
      # automation that promotes them does exactly that — treats a tie as
      # not-newer and never ships the new build. Commit time is unique per
      # merge, monotonic on main, and makes the build reproducible.
      - id: epoch
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Platform registry (ACR) — the dev cluster pulls from here. OIDC only:
      # sp-screamingface-ci is federated to this repo's main branch and holds
      # AcrPush on acropenmined and nothing else. No secrets are stored here;
      # the three vars below are non-secret identifiers.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name acropenmined
      - uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.epoch }}
        with:
          # Context is the repo root — matches the release workflows (screamingface-engine's
          # Dockerfile COPYs packages/url4 from outside its own directory).
          context: .
          file: apps/report-intake/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/screamingface/screamingface-report-intake:main-${{ steps.sha.outputs.short }}
            acropenmined.azurecr.io/screamingface-report-intake:main-${{ steps.sha.outputs.short }}
            acropenmined.azurecr.io/screamingface-report-intake:main-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # Its OWN scope. Sharing one with a sibling lane whose layer set is disjoint
          # is pure eviction pressure with no hits, and is the easy mistake when a lane
          # is copied — verify_chart_wiring.py asserts every dev lane's scope is distinct.
          cache-from: type=gha,scope=dev-report-intake
          cache-to: type=gha,scope=dev-report-intake,mode=max
