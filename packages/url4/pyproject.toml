[project]
name = "url4"
version = "1.5.1"
description = "Standalone core library for the url4 expression protocol — grammar, parser, AST, interpreter, and scope"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenMined" }]
keywords = ["ai", "llm", "ensemble", "dag", "expression-protocol", "url4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://screamingface.ai"
Repository = "https://github.com/ScreamingFace/screamingface"
Issues = "https://github.com/ScreamingFace/screamingface/issues"

[project.optional-dependencies]
# Url4Node.serve() and `url4 serve` — the ASGI app itself is framework-free; only
# serving over HTTP needs uvicorn.
server = ["uvicorn>=0.30"]

# `url4.streaming` — the CloudEvents/OTel wire contract IS pydantic models.
#
# WHY an extra and not a base dependency: nothing under `url4.core`, `url4.dag`, `url4.io` or
# `url4.observe` imports pydantic. Making it mandatory would have every embedder of the ENGINE
# install a wire-format library for a subsystem they never touch, which is the same doctrine
# `observe.py` states for itself — the engine core does not gain a transport dependency because
# an embedder wants to watch a run. `apps/screamingface-engine` depends on `url4[streaming]`.
streaming = ["pydantic>=2.13.4"]

# The `url4` CLI: `url4 serve` (HTTP node) and `url4 eval` (network-free one-shot).
# `serve` additionally needs the `server` extra (uvicorn) at runtime.
[project.scripts]
url4 = "url4.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/url4"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]
# PLR1702 (too-many-nested-blocks) is preview-gated in ruff; enable preview but
# scope it to explicitly-selected rules so ONLY PLR1702 activates — not ruff's
# broad preview behavior. Without this the rule silently does nothing.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:url4",
]

[tool.coverage.run]
# `url4.streaming` is the url4-cloud wire contract. It ships from this distribution, but its tests
# live with its only consumers, in apps/screamingface-engine/tests — that suite gates it via `--cov=url4.streaming`.
# Measuring it here too would drag this package's engine-focused 95% gate down to whatever the
# streaming contract happens to score, which is a number this suite has no way to move.
omit = ["src/url4/streaming/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    # WHY the extra is in the DEV group: pydantic is deliberately not a runtime dependency of the
    # engine (see [project.optional-dependencies].streaming), but `url4.streaming` ships in this
    # distribution and this package's own pyright/pytest run has to be able to resolve it.
    # Without this the gate reports "Import pydantic could not be resolved" for code it owns.
    "url4[streaming]",
]

# Notebook-only aids for examples/ (not needed by the library itself).
# `graphviz` also needs the system Graphviz binary: `apt install graphviz` /
# `brew install graphviz`.
notebook = [
    "graphviz>=0.21",
]
