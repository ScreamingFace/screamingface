<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080" font-family="Menlo, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#565664" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1560" height="1080" fill="#0d0d10"/>

  <!-- header -->
  <text x="48" y="52" font-size="13" letter-spacing="2.5" fill="#d4a24e">&#128561; SCREAMINGFACE &#183; GDPVAL-TEXT &#8212; WHAT THE BENCHMARK MEASURES</text>
  <text x="46" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f2f4">Real professional work, graded criterion by criterion &#8212; on our metric, not OpenAI's.</text>
  <text x="48" y="126" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">GDPval tasks are written by professionals averaging 14 years of experience, across the nine largest sectors of US GDP.</text>
  <text x="48" y="146" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">This board serves the prose-only slice of the 220-task open gold set, and grades plain-text answers against each task's own rubric.</text>

  <!-- ══ band : the slice ══ -->
  <rect x="100" y="184" width="1360" height="120" rx="8" fill="#131318" stroke="#2a2a31"/>
  <rect x="100" y="166" width="150" height="24" rx="4" fill="#2dd4bf"/>
  <text x="175" y="182" font-size="11" font-weight="bold" fill="#0d0d10" text-anchor="middle">THE SLICE</text>

  <rect x="130" y="206" width="150" height="56" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="205" y="229" font-size="13" fill="#dfe8ea" text-anchor="middle">220 tasks</text>
  <text x="205" y="247" font-size="11" fill="#8a8a92" text-anchor="middle">open gold set</text>

  <line x1="280" y1="234" x2="486" y2="234" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="383" y="220" font-size="11" fill="#9a9aa4" text-anchor="middle">keep prose deliverables</text>
  <text x="383" y="252" font-size="11" fill="#6a6a74" text-anchor="middle">.docx .txt .md .pdf &#183; none</text>

  <rect x="488" y="206" width="140" height="56" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="558" y="229" font-size="13" fill="#dfe8ea" text-anchor="middle">109 tasks</text>
  <text x="558" y="247" font-size="11" fill="#8a8a92" text-anchor="middle">text subset</text>

  <line x1="628" y1="234" x2="836" y2="234" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="732" y="220" font-size="11" fill="#e06c8a" text-anchor="middle">drop 7 tasks</text>
  <text x="732" y="252" font-size="11" fill="#6a6a74" text-anchor="middle">references unreadable (scans)</text>

  <rect x="838" y="206" width="150" height="56" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="913" y="229" font-size="13" fill="#2dd4bf" text-anchor="middle">102 cases</text>
  <text x="913" y="247" font-size="11" fill="#8a8a92" text-anchor="middle">the board</text>

  <text x="1030" y="226" font-size="12" fill="#9a9aa4">still broad: 9/9 GDP sectors &#183; 37/44 occupations</text>
  <text x="1030" y="248" font-size="12" fill="#6a6a74">excluded: spreadsheets, slides, artifacts &#8212; later phases</text>

  <!-- ══ card 1 : one case ══ -->
  <rect x="100" y="334" width="430" height="400" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="128" y="372" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">ONE CASE</text>
  <text x="128" y="394" font-size="12" font-style="italic" fill="#8a8a92" font-family="Georgia, serif">"Do the job a professional was asked to do."</text>
  <rect x="382" y="356" width="120" height="24" rx="4" fill="none" stroke="#2dd4bf"/>
  <text x="442" y="372" font-size="11" fill="#2dd4bf" text-anchor="middle">baked at build</text>

  <rect x="140" y="420" width="350" height="42" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="315" y="446" font-size="12" fill="#dfe8ea" text-anchor="middle">"Draft the audit findings memo for&#8230;"</text>

  <text x="152" y="492" font-size="11" fill="#6a6a74">its reference files, parsed once at build time:</text>
  <rect x="152" y="504" width="150" height="28" rx="4" fill="#101820" stroke="#3a4654"/>
  <text x="227" y="522" font-size="11" fill="#dfe8ea" text-anchor="middle">brief.pdf</text>
  <rect x="316" y="504" width="150" height="28" rx="4" fill="#101820" stroke="#3a4654"/>
  <text x="391" y="522" font-size="11" fill="#dfe8ea" text-anchor="middle">ledger.docx</text>
  <line x1="227" y1="532" x2="227" y2="548" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="391" y1="532" x2="391" y2="548" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="152" y="550" width="314" height="30" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="309" y="569" font-size="11" fill="#dfe8ea" text-anchor="middle">extracted text, baked into the case</text>

  <text x="128" y="622" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Every candidate reads byte-identical inputs</tspan></text>
  <text x="128" y="642" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">&#8212; parsing happens at build, never in the run.</text>
  <text x="128" y="672" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">The answer is plain text &#8212; 83 of these 102</text>
  <text x="128" y="692" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">tasks originally expected a formatted file.</text>

  <!-- ══ card 2 : graded per criterion ══ -->
  <rect x="565" y="334" width="430" height="400" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="593" y="372" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">GRADED PER CRITERION</text>
  <rect x="843" y="356" width="118" height="24" rx="4" fill="none" stroke="#d4a24e"/>
  <text x="902" y="372" font-size="11" fill="#d4a24e" text-anchor="middle">judge model</text>

  <rect x="705" y="404" width="150" height="28" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="423" font-size="12" fill="#dfe8ea" text-anchor="middle">case</text>
  <line x1="780" y1="432" x2="780" y2="444" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="444" width="150" height="28" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="780" y="463" font-size="12" fill="#dfe8ea" text-anchor="middle">your Candidate</text>
  <line x1="780" y1="472" x2="780" y2="484" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="484" width="150" height="28" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="503" font-size="12" fill="#dfe8ea" text-anchor="middle">plain-text answer</text>
  <line x1="780" y1="512" x2="780" y2="524" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="660" y="524" width="240" height="30" rx="6" fill="#20180a" stroke="#d4a24e"/>
  <text x="780" y="543" font-size="12" fill="#ecd9b0" text-anchor="middle">judge &#8212; one call per criterion</text>

  <text x="593" y="586" font-size="12" fill="#9a9aa4">median <tspan fill="#dfe8ea">44 criteria</tspan> per task (min 13 / max 83)</text>
  <text x="593" y="608" font-size="12" fill="#9a9aa4">&#8776; <tspan fill="#d4a24e">4,500 judge calls</tspan> per candidate on a full run</text>

  <text x="593" y="648" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">File-format criteria are removed first</tspan> &#8212;</text>
  <text x="593" y="668" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">"delivered as a .docx": 99 items, 2.9% of points</text>
  <text x="593" y="688" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">a text answer could never earn.</text>

  <!-- ══ card 3 : the case score ══ -->
  <rect x="1030" y="334" width="430" height="400" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="1058" y="372" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE CASE SCORE</text>
  <rect x="1322" y="356" width="118" height="24" rx="4" fill="none" stroke="#e06c8a"/>
  <text x="1381" y="372" font-size="11" fill="#e06c8a" text-anchor="middle">no clamp</text>

  <text x="1058" y="412" font-size="12" fill="#9a9aa4">its rubric: +2, +1, and a &#8722;1 penalty</text>
  <text x="1058" y="446" font-size="13" fill="#dfe8ea">hit <tspan fill="#4ade80">+2</tspan> &#183; missed <tspan fill="#9a9aa4">+1</tspan> &#183; hit <tspan fill="#e06c8a">&#8722;1</tspan></text>

  <text x="1058" y="498" font-size="14" fill="#f0f0f2">case  =</text>
  <text x="1205" y="486" font-size="13" fill="#dfe8ea" text-anchor="middle">2 &#8722; 1</text>
  <line x1="1160" y1="494" x2="1250" y2="494" stroke="#9a9aa4"/>
  <text x="1205" y="516" font-size="13" fill="#dfe8ea" text-anchor="middle">2 + 1</text>
  <text x="1290" y="500" font-size="14" fill="#d4a24e" font-weight="bold">=  0.33</text>

  <text x="1058" y="556" font-size="12" fill="#9a9aa4">earned: hits add, penalty hits subtract</text>
  <text x="1058" y="576" font-size="12" fill="#9a9aa4">possible: positive points only (2 + 1 = 3)</text>

  <text x="1058" y="614" font-size="13" fill="#e06c8a">hit only the penalty?  &#8722;1 of 3  =  <tspan font-weight="bold">&#8722;0.33</tspan></text>

  <text x="1058" y="656" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Below zero is a real result</tspan> &#8212; and a case</text>
  <text x="1058" y="676" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">no judge graded scores None, never a fake 0.</text>

  <!-- ══ score card ══ -->
  <rect x="100" y="764" width="1360" height="196" rx="8" fill="#16130d" stroke="#d4a24e" stroke-width="1.5"/>
  <rect x="100" y="746" width="150" height="24" rx="4" fill="#d4a24e"/>
  <text x="175" y="762" font-size="11" font-weight="bold" fill="#16130d" text-anchor="middle">THE SCORE</text>

  <text x="140" y="826" font-size="18" fill="#f0f0f2">score  =</text>
  <text x="286" y="814" font-size="15" fill="#dfe8ea">sum of the 102 case scores</text>
  <line x1="286" y1="826" x2="640" y2="826" stroke="#9a9aa4"/>
  <text x="463" y="850" font-size="15" fill="#dfe8ea" text-anchor="middle">102</text>
  <text x="672" y="832" font-size="13" fill="#9a9aa4">&#8212; plain mean, unclipped</text>

  <text x="880" y="814" font-size="13" fill="#d4a24e">&#8776; 4,500 judge calls &#183; roughly $51 per candidate</text>
  <text x="880" y="838" font-size="12" fill="#9a9aa4">rehearse with limit=1 &#8212; grading, not answering, is the cost</text>

  <text x="140" y="912" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e06c8a">Never quote this against the GDPval leaderboard.</tspan> The official metric is blinded experts picking between the model's file and a human</text>
  <text x="140" y="934" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">professional's deliverable &#8212; unreachable here. The valid claim this board supports: does the fusion beat the solo model, same rules?</text>

  <!-- footer -->
  <text x="48" y="1044" font-size="11" letter-spacing="1.5" fill="#6a6a74">RUBRIC-GRADED &#183; 102 OF 220 TASKS &#183; NEGATIVES SUBTRACT &#183; NOT THE LEADERBOARD METRIC</text>
  <text x="1512" y="1044" font-size="11" letter-spacing="1.5" fill="#6a6a74" text-anchor="end">GDPVAL: OPENAI OPEN GOLD SET &#183; ARXIV 2510.04374</text>
</svg>
