<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" font-family="Menlo, 'SF Mono', Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#565664" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1560" height="900" fill="#0d0d10"/>

  <!-- header -->
  <text x="48" y="52" font-size="13" letter-spacing="2.5" fill="#d4a24e">&#128561; SCREAMINGFACE &#183; MEDXPERTQA &#8212; WHAT THE BENCHMARK MEASURES</text>
  <text x="46" y="96" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f2f4">2,450 expert medical questions, one letter each &#8212; graded by string match.</text>
  <text x="48" y="126" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9a9aa4">Your Candidate reasons step by step, then commits to a single lettered choice. An exact match against the published key grades it &#8212; no judge model, no grading tokens, no opinion.</text>

  <!-- ══ card 1 : the exam ══ -->
  <rect x="100" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="128" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE EXAM</text>
  <text x="128" y="230" font-size="12" font-style="italic" fill="#8a8a92" font-family="Georgia, serif">"Expert-level. Ten choices. One is right."</text>
  <rect x="352" y="192" width="150" height="24" rx="4" fill="none" stroke="#2dd4bf"/>
  <text x="427" y="208" font-size="11" fill="#2dd4bf" text-anchor="middle">2,450 questions</text>

  <rect x="140" y="258" width="350" height="58" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="315" y="281" font-size="12" fill="#dfe8ea" text-anchor="middle">"A 61-year-old with crushing chest</text>
  <text x="315" y="299" font-size="12" fill="#dfe8ea" text-anchor="middle">pain and ST elevation&#8230;"</text>

  <text x="152" y="346" font-size="11" fill="#6a6a74">ten choices, A through J, inside the question:</text>
  <rect x="152" y="358" width="76" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="190" y="376" font-size="11" fill="#dfe8ea" text-anchor="middle">(A)</text>
  <rect x="236" y="358" width="76" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="274" y="376" font-size="11" fill="#dfe8ea" text-anchor="middle">(B)</text>
  <rect x="320" y="358" width="76" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="358" y="376" font-size="11" fill="#dfe8ea" text-anchor="middle">(C)</text>
  <text x="424" y="376" font-size="11" fill="#6a6a74">&#8230;</text>
  <rect x="446" y="358" width="76" height="28" rx="4" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="484" y="376" font-size="11" fill="#dfe8ea" text-anchor="middle">(J)</text>

  <text x="152" y="414" font-size="11" fill="#6a6a74">official cuts preserved for sub-scores:</text>
  <text x="152" y="434" font-size="11" fill="#9a9aa4">question_type &#183; medical_task &#183; body_system</text>

  <text x="128" y="486" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Written by physicians, with real frontier</tspan></text>
  <text x="128" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">headroom &#8212; the best solo models miss a quarter.</text>

  <!-- ══ card 2 : two turns ══ -->
  <rect x="565" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="593" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">TWO TURNS</text>
  <rect x="835" y="192" width="126" height="24" rx="4" fill="none" stroke="#4ade80"/>
  <text x="898" y="208" font-size="11" fill="#4ade80" text-anchor="middle">no judge</text>

  <rect x="625" y="240" width="310" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="261" font-size="11" fill="#dfe8ea" text-anchor="middle">"Q: &#8230; A: Let's think step by step."</text>
  <line x1="780" y1="272" x2="780" y2="296" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="300" width="150" height="32" rx="6" fill="#0d1b24" stroke="#2dd4bf"/>
  <text x="780" y="321" font-size="12" fill="#dfe8ea" text-anchor="middle">your Candidate</text>
  <line x1="780" y1="332" x2="780" y2="356" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="360" width="150" height="32" rx="6" fill="#101820" stroke="#3a4654"/>
  <text x="780" y="381" font-size="12" fill="#dfe8ea" text-anchor="middle">reasoning</text>
  <line x1="780" y1="392" x2="780" y2="416" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="613" y="420" width="334" height="32" rx="6" fill="#1c1410" stroke="#d4a24e"/>
  <text x="780" y="441" font-size="11" fill="#dfe8ea" text-anchor="middle">"Therefore, among A through J, the answer is"</text>
  <line x1="780" y1="452" x2="780" y2="476" stroke="#565664" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="705" y="480" width="150" height="32" rx="6" fill="#0d2018" stroke="#4ade80"/>
  <text x="780" y="501" font-size="12" fill="#dfe8ea" text-anchor="middle">" (E)"</text>

  <text x="593" y="524" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">The bare trigger makes the letter come first</tspan></text>
  <text x="593" y="542" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#c2c2ca">&#8212; two Candidate calls per case, reason then commit.</text>

  <!-- ══ card 3 : the case grade ══ -->
  <rect x="1030" y="170" width="430" height="380" rx="8" fill="#131318" stroke="#2a2a31"/>
  <text x="1058" y="208" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#f0f0f2">THE CASE GRADE</text>
  <rect x="1290" y="192" width="150" height="24" rx="4" fill="none" stroke="#d4a24e"/>
  <text x="1365" y="208" font-size="11" fill="#d4a24e" text-anchor="middle">exact match</text>

  <text x="1058" y="256" font-size="12" fill="#9a9aa4">committed letter equals the key:</text>
  <text x="1082" y="292" font-size="16" fill="#4ade80">E &#61; E</text>
  <text x="1420" y="292" font-size="16" font-weight="bold" fill="#4ade80" text-anchor="end">&#8594;  1</text>

  <text x="1058" y="340" font-size="12" fill="#9a9aa4">any other letter &#8212; or no letter at all:</text>
  <text x="1082" y="376" font-size="16" fill="#e06c8a">B &#8800; E&#160;&#160;&#160;&#160;"" &#8800; E</text>
  <text x="1420" y="376" font-size="16" font-weight="bold" fill="#e06c8a" text-anchor="end">&#8594;  0</text>

  <line x1="1058" y1="404" x2="1432" y2="404" stroke="#2a2a31"/>
  <text x="1058" y="436" font-size="12" fill="#9a9aa4">an unparseable reply is scored wrong &#8212;</text>
  <text x="1058" y="454" font-size="12" fill="#9a9aa4">never rescued, never dropped from the exam.</text>

  <text x="1058" y="506" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Declining is not a strategy</tspan> &#8212; the official</text>
  <text x="1058" y="526" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca">empty-prediction verdict keeps denominators honest.</text>

  <!-- ══ score card ══ -->
  <rect x="100" y="580" width="1360" height="240" rx="8" fill="#16130d" stroke="#d4a24e" stroke-width="1.5"/>
  <rect x="100" y="562" width="150" height="24" rx="4" fill="#d4a24e"/>
  <text x="175" y="578" font-size="11" font-weight="bold" fill="#16130d" text-anchor="middle">THE SCORE</text>

  <text x="140" y="632" font-size="18" fill="#f0f0f2">score  =</text>
  <text x="286" y="620" font-size="15" fill="#dfe8ea">cases whose committed letter matches the key</text>
  <line x1="286" y1="632" x2="740" y2="632" stroke="#9a9aa4"/>
  <text x="513" y="656" font-size="15" fill="#dfe8ea" text-anchor="middle">cases run</text>

  <text x="140" y="706" font-size="13" fill="#9a9aa4">worked example: 1,764 right out of 2,450 &#8594; 1,764 / 2,450 = <tspan fill="#d4a24e" font-weight="bold">0.72</tspan> &#183; answered_rate reported beside it</text>

  <!-- range bar -->
  <rect x="820" y="622" width="500" height="10" rx="5" fill="#131318" stroke="#2a2a31"/>
  <rect x="820" y="622" width="360" height="10" rx="5" fill="#0d2018" stroke="#4ade80"/>
  <text x="820" y="612" font-size="11" fill="#6a6a74">0</text>
  <text x="1320" y="612" font-size="11" fill="#6a6a74" text-anchor="end">1</text>
  <circle cx="1180" cy="627" r="6" fill="#d4a24e"/>
  <text x="1180" y="656" font-size="11" fill="#d4a24e" text-anchor="middle">0.72</text>
  <text x="1340" y="631" font-size="11" fill="#9a9aa4">score range 0&#8230;1</text>

  <text x="140" y="768" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#c2c2ca"><tspan font-weight="700" fill="#e8e8ec">Plain accuracy over the cases run</tspan> &#8212; and answered_rate tells you whether a low score is knowledge or formatting. Higher is better.</text>

  <!-- footer -->
  <text x="48" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74">OFFICIAL 2,450 TEXT QUESTIONS &#183; TWO INVOCATIONS PER CASE &#183; FREE EXACT-MATCH GRADING</text>
  <text x="1512" y="878" font-size="11" letter-spacing="1.5" fill="#6a6a74" text-anchor="end">MEDXPERTQA: ZUO ET AL., ARXIV 2501.18362</text>
</svg>
