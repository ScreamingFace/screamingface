[project]
name = "screamingface"
version = "0.1.1.post3"
description = "Evaluate Models and Fusions on URL4-native research benchmarks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "llm", "evaluation", "benchmarks", "url4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pynacl>=1.5",
    "pyyaml>=6.0",
    "websockets>=17.0.1,<18",
]

[project.urls]
Homepage = "https://screamingface.ai"
Repository = "https://github.com/ScreamingFace/screamingface"
Issues = "https://github.com/ScreamingFace/screamingface/issues"

[project.scripts]
screamingface = "screamingface._runtime.cli:main"

[project.optional-dependencies]
# INVARIANT: safe to `pip install screamingface[notebook]` inside a hosted notebook. The
# connection panel's ImportError points users here and `sf.connect()` is the documented
# entrypoint, so this extra stays limited to what renders the panel. Notebook-*authoring*
# and test tooling belongs in the dev group below, not in a user-facing extra.
notebook = [
    "ipywidgets>=8.1",
]
runtime = [
    "aiosqlite==0.22.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.0",
    "datasets==5.0.1",
    "fastapi>=0.141.1",
    "immutabledict>=4.2.0",
    "kubernetes>=31.0.0",
    "langdetect>=1.0.9",
    "litellm==1.97.0",
    "nats-py>=2.9.0",
    "nltk>=3.9.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "pyjwt==2.13.0",
    "tortoise-orm[asyncpg]==1.1.8",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingface"]

[tool.hatch.build.hooks.custom]
path = "scripts/runtime_build_hook.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C901", "PLR0911", "PLR0912", "PLR0915", "PLR1702"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 26
max-branches = 7
max-returns = 3

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:screamingface",
]
markers = [
    # OME-961: boots the real gateway (Postgres testcontainer) + engine as subprocesses.
    # Gated like aigateway's needs_postgres lane: set SCREAMINGFACE_TEST_E2E=1 and have
    # Docker running, or the tests skip loudly with the reason.
    "e2e: end-to-end replay tests against the locally booted stack (docker + env-gated)",
]

[tool.coverage.run]
# The SDK test job intentionally installs only the notebook extra. The optional
# runtime is exercised by its clean-wheel and live-stack integration checks.
omit = ["src/screamingface/_runtime/*"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.6.3",
    "nbclient>=0.10",
    "nbformat>=5.11.0",
    "pydantic>=2.9",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "testcontainers[postgres]>=4.15,<5",
]
